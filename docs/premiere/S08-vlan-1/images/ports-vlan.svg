<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Affectation des ports aux VLAN</title><desc>Sur le switch, les ports Fa0/1 et Fa0/2 sont dans le VLAN 10, Fa0/3 et Fa0/4 dans le VLAN 20, les autres restent dans le VLAN 1.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Chaque port appartient à UN VLAN (mode « access »)</tspan></text><rect x="40" y="70" width="920" height="110" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="60" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Switch Catalyst 2960 – face avant</tspan></text><rect x="70" y="115" width="56" height="44" rx="5" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="98" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="98" dy="0">Fa0/1</tspan></text><text x="98" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#3949ab" text-anchor="middle" font-weight="600"><tspan x="98" dy="0">VLAN 10</tspan></text><rect x="142" y="115" width="56" height="44" rx="5" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="170" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="170" dy="0">Fa0/2</tspan></text><text x="170" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#3949ab" text-anchor="middle" font-weight="600"><tspan x="170" dy=