<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Un switch, deux réseaux séparés avec les VLAN</title><desc>À gauche, tous les postes sont dans le même réseau de diffusion. À droite, les VLAN 10 et 20 découpent le même switch en deux réseaux qui ne se voient plus.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Les VLAN : un seul boîtier, plusieurs réseaux séparés</tspan></text><rect x="20" y="55" width="460" height="395" rx="14" fill="#ffffff" stroke="#90a4ae" stroke-width="2" stroke-dasharray="6 5"/><text x="250" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="250" dy="0">SANS VLAN : tout le monde se voit</tspan></text><rect x="80" y="220" width="340" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="250" y="247" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="250" dy="0">SWITCH</tspan></text><rect x="93" y="262" width="0" height="0" rx="8" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><line x1="115" y1="270" x2="115" y2="330" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/><rect x="87" y="330" width="56" height="38" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="115" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="115" dy="0">PC1</tspan></text><text x="115" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#90a4ae" text-anchor="middle" font-weight="600"><tspan x="115" dy="0">Direction</tspan></text><rect x="108" y="258" width="14" height="12" rx="2" fill="#90a4ae" stroke="#90a4ae" stroke-width="1"/><rect x="183" y="262" width="0" height="0" rx="8" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><line x1="205" y1="270" x2="205" y2="330" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/><rect x="177" y="330" width="56" height="38" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="205" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="205" dy="0">PC2</tspan></text><text x="205" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#90a4ae" text-anchor="middle" font-weight="600"><tspan x="205" dy="0">Direction</tspan></text><rect x="198" y="258" width="14" height="12" rx="2" fill="#90a4ae" stroke="#90a4ae" stroke-width="1"/><rect x="273" y="262" width="0" height="0" rx="8" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><line x1="295" y1="270" x2="295" y2="330" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/><rect x="267" y="330" width="56" height="38" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="295" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="295" dy="0">PC3</tspan></text><text x="295" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#90a4ae" text-anchor="middle" font-weight="600"><tspan x="295" dy="0">Atelier</tspan></text><rect x="288" y="258" width="14" height="12" rx="2" fill="#90a4ae" stroke="#90a4ae" stroke-width="1"/><rect x="363" y="262" width="0" height="0" rx="8" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><line x1="385" y1="270" x2="385" y2="330" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/><rect x="357" y="330" width="56" height="38" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="385" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="385" dy="0">PC4</tspan></text><text x="385" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#90a4ae" text-anchor="middle" font-weight="600"><tspan x="385" dy="0">Atelier</tspan></text><rect x="378" y="258" width="14" height="12" rx="2" fill="#90a4ae" stroke="#90a4ae" stroke-width="1"/><text x="250" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="250" dy="0">un seul réseau de diffusion</tspan></text><text x="250" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="250" dy="0">(un broadcast arrive chez tous les postes)</tspan></text><text x="250" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="250" dy="0">L'atelier voit les postes de la Direction</tspan></text><rect x="520" y="55" width="460" height="395" rx="14" fill="#ffffff" stroke="#90a4ae" stroke-width="2" stroke-dasharray="6 5"/><text x="750" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="750" dy="0">AVEC VLAN : Direction | Atelier</tspan></text><rect x="580" y="220" width="340" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="750" y="247" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="750" dy="0">SWITCH</tspan></text><rect x="593" y="262" width="0" height="0" rx="8" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><line x1="615" y1="270" x2="615" y2="330" stroke="#3949ab" stroke-width="3" str