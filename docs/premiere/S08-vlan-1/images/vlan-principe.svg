="600"><tspan x="795" dy="0">Atelier</tspan></text><rect x="788" y="258" width="14" height="12" rx="2" fill="#ef6c00" stroke="#ef6c00" stroke-width="1"/><rect x="863" y="262" width="0" height="0" rx="8" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><line x1="885" y1="270" x2="885" y2="330" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="857" y="330" width="56" height="38" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="885" y="354" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="885" dy="0">PC4</tspan></text><text x="885" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ef6c00" text-anchor="middle" font-weight="600"><tspan x="885" dy="0">Atelier</tspan></text><rect x="878" y="258" width="14" height="12" rx="2" fill="#ef6c00" stroke="#ef6c00" stroke-width="1"/><rect x="660" y="135" width="80" height="36" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="700" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="700" dy="0">VLAN 10</tspan></text><rect x="760" y="135" width="80" height="36" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="800" y="159" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">VLAN 20</tspan></text><line x1="700" y1="171" x2="615" y2="256" stroke="#3949ab" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="700" y1="171" x2="705" y2="256" stroke="#3949ab" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="800" y1="171" x2="795" y2="256" stroke="#ef6c00" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="800" y1="171" x2="885" y2="256" stroke="#ef6c00" stroke-width="2" stroke-linecap="round" stroke-dasharray="4