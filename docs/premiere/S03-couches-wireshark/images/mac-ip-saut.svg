<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img"><title>MAC qui changent, IP qui restent</title><desc>PC1 envoie un ping vers SRV2 à travers le routeur R1. Sur chaque segment, les adresses MAC changent ; les adresses IP restent les mêmes ; le TTL baisse de 1 au passage du routeur.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="980" height="520" fill="#ffffff" rx="10"/><text x="490.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0">Au passage du routeur : les MAC changent, les IP restent</tspan></text><rect x="110" y="50" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="115" y="55" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="140" y1="90" x2="140" y2="100" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="122" y="98" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="140" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="140" dy="0">PC1</tspan></text><text x="140" y="142" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="140" dy="0">192.168.10.11</tspan></text><rect x="452" y="66" width="76" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><line x1="470" y1="66" x2="462" y2="50" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><line x1="510" y1="66" x2="518" y2="50" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="462" y="77" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="476" y="77" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="490" y="77" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="504" y="77" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><circle cx="520" cy="72" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="490" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="490" dy="0">R1</tspan></text><rect x="812" y="46" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="821" cy="55.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="832" y1="55.5" x2="860" y2="55.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="812" y="68" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="821" cy="77.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="832" y1="77.5" x2="860" y2="77.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="812" y="90" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="821" cy="99.5" r="3" fill="#f9a825" stroke="#3949ab" stroke-width="1"/><line x1="832" y1="99.5" x2="860" y2="99.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><text x="840" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="840" dy="0">SRV2</tspan></text><text x="840" y="150" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="840" dy="0">192.168.20.100</tspan></text><line x1="190" y1="105" x2="440" y2="105" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><line x1="540" y1="105" x2="790" y2="105" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><text x="315" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="315" dy="0">segment 1</tspan></text><text x="665" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="665" dy="0">segment 2</tspan></text><rect x="60" y="200" width="400" height="250" rx="12" fill="#ffffff" stroke="#00897b" stroke-width="3"/><text x="260" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="260" dy="0">Trame sur le segment 1</tspan></text><rect x="76" y="248" width="368" height="74" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/><text x="88" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="start" font-weight="700"><tspan x="88" dy="0">Ethernet (MAC)</tspan></text><text x="88" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="88" dy="0">source : MAC de PC1</tspan></text><text x="88" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="88" dy="0">destination : MAC de R1 (côté Gi0/0)</tspan></text><rect x="76" y="332" width="368" height="74" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><text x="88" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="88" dy="0">IP</tspan></text><text x="88" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="88" dy="0">source 192.168.10.11  →  dest. 192.168.20.100</tspan></text><text x="88" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="88" dy="0">TTL = 128</tspan></text><text x="260" y="430" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="260" dy="0">ICMP : demande d'écho (ping)</tspan></text><rect x="520" y="200" width="400" height="250" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="720" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="720" dy="0">Trame sur le segment 2</tspan></text><rect x="536" y="248" width="368" height="74" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/><text x="548" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="start" font-weight="700"><tspan x="548" dy="0">Ethernet (MAC)</tspan></text><text x="548" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="548" dy="0">source : MAC de R1 (côté Gi0/1)</tspan></text><text x="548" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="548" dy="0">destination : MAC de SRV2</tspan></text><rect x="536" y="332" width="368" height="74" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><text x="548" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="548" dy="0">IP</tspan></text><text x="548" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="548" dy="0">source 192.168.10.11  →  dest. 192.168.20.100</tspan></text><text x="548" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="548" dy="0">TTL = 127   (−1 au 