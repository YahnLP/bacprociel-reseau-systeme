<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img"><title>L'encapsulation</title><desc>Les données sont placées dans un segment ou message, lui-même placé dans un paquet IP, lui-même placé dans une trame Ethernet.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="980" height="470" fill="#ffffff" rx="10"/><text x="490.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0">Encapsulation : des poupées russes</tspan></text><rect x="40" y="70" width="900" height="360" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="60" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#00897b" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Trame Ethernet</tspan></text><text x="60" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">couche 2 – liaison : MAC source et destination</tspan></text><rect x="130" y="140" width="720" height="270" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="150" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="150" dy="0">Paquet IP</tspan></text><text x="150" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="150" dy="0">couche 3 – réseau : IP source et destination, TTL</tspan></text><rect x="220" y="210" width="540" height="180" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="240" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="240" dy="0">Segment TCP / UDP / message ICMP</tspan></text><text x="240" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="240" dy="0">couche 4 – transport : ports (ou type ICMP)</tspan></text><rect x="310" y="290" width="360" height="70" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="490" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="490" dy="0">Données</tspan></text><text x="490" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="490" dy="0">couche 7 – application (HTTP, DNS…)</tspan></text></svg>
