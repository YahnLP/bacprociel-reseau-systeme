<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img"><title>Emprunter des bits à la partie machine</title><desc>Le masque /24 devient /26 : on emprunte les deux premiers bits du dernier octet à la partie machine. Ces deux bits désignent le numéro du sous-réseau.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="980" height="480" fill="#ffffff" rx="10"/><text x="490.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0">Du /24 au /26 : on emprunte 2 bits à la partie machine</tspan></text><text x="40" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">4ᵉ octet du MASQUE (8 bits) : 1 = fait partie du réseau, 0 = fait partie de la machine</tspan></text><text x="40" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="start" font-weight="700"><tspan x="40" dy="0">/24 : masque 255.255.255.0 → tout le 4ᵉ octet = machine</tspan></text><rect x="40" y="120" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="71" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="71" dy="0">0</tspan></text><rect x="110" y="120" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="141" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="141" dy="0">0</tspan></text><rect x="180" y="120" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="211" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="211" dy="0">0</tspan></text><rect x="250" y="120" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="281" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="281" dy="0">0</tspan></text><rect x="320" y="120" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="351" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="351" dy="0">0</tspan></text><rect x="390" y="120" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="421" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="421" dy="0">0</tspan></text><rect x="460" y="120" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="491" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="491" dy="0">0</tspan></text><rect x="530" y="120" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="561" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="561" dy="0">0</tspan></text><text x="320" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">8 bits machine</tspan></text><text x="40" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="start" font-weight="700"><tspan x="40" dy="0">/26 : masque 255.255.255.192 → 2 bits « sous-réseau » + 6 bits machine</tspan></text><rect x="40" y="250" width="62" height="48" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="71" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="71" dy="0">1</tspan></text><rect x="110" y="250" width="62" height="48" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="141" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="141" dy="0">1</tspan></text><rect x="180" y="250" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="211" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="211" dy="0">0</tspan></text><rect x="250" y="250" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="281" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="281" dy="0">0</tspan></text><rect x="320" y="250" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="351" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="351" dy="0">0</tspan></text><rect x="390" y="250" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="421" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="421" dy="0">0</tspan></text><rect x="460" y="250" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="491" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="491" dy="0">0</tspan></text><rect x="530" y="250" width="62" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="561" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="561" dy="0">0</tspan></text><text x="110" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="110" dy="0">2 bits empruntés</tspan></text><text x="390" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="390" dy="0">6 bits machine</tspan></text><rect x="36" y="246" width="144" height="56" rx="10" fill="none" stroke="#c62828" stroke-width="3"/><text x="40" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="40" dy="0">dans l'adresse, ces 2 bits donnent le sous-réseau : 00 = A · 01 = B · 10 = C · 11 = D</tspan></text><rect x="40" y="385" width="900" height="54.25" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="52" y="407.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">2 bits empruntés → 2² = 4 sous-réseaux. Il reste 6 bits machine → 2⁶ − 2 = 62 machines par sous-réseau. 192 = 128</tspan><tspan x="52" dy="18.1">+ 64 = 11000000.</tspan></text></svg>
