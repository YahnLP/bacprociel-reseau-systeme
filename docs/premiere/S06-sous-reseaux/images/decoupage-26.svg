<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img"><title>Un /24 découpé en quatre /26</title><desc>Le réseau 192.168.1.0/24 (256 adresses) est découpé en quatre sous-réseaux de 64 adresses : .0, .64, .128 et .192.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="980" height="380" fill="#ffffff" rx="10"/><text x="490.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0">192.168.1.0 /24  →  quatre sous-réseaux /26</tspan></text><rect x="40" y="62" width="900" height="44" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/><text x="490" y="91" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="490" dy="0">le 4ᵉ nombre va de 0 à 255 : 256 adresses</tspan></text><rect x="40" y="130" width="225" height="150" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="152" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="152" dy="0">Sous-réseau A</tspan></text><text x="152" y="188" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="152" dy="0">192.168.1.0 /26</tspan></text><text x="152" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="152" dy="0">machines : .1 à .62</tspan></text><text x="152" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="152" dy="0">diffusion : .63</tspan></text><text x="152" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="152" dy="0">62 machines</tspan></text><rect x="265" y="130" width="225" height="150" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="377" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="377" dy="0">Sous-réseau B</tspan></text><text x="377" y="188" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="377" dy="0">192.168.1.64 /26</tspan></text><text x="377" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="377" dy="0">machines : .65 à .126</tspan></text><text x="377" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="377" dy="0">diffusion : .127</tspan></text><text x="377" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="377" dy="0">62 machines</tspan></text><rect x="490" y="130" width="225" height="150" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="602" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="602" dy="0">Sous-réseau C</tspan></text><text x="602" y="188" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="602" dy="0">192.168.1.128 /26</tspan></text><text x="602" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="602" dy="0">machines : .129 à .190</tspan></text><text x="602" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="602" dy="0">diffusion : .191</tspan></text><text x="602" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="602" dy="0">62 machines</tspan></text><rect x="715" y="130" width="225" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="827" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="827" dy="0">Sous-réseau D</tspan></text><text x="827" y="188" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="827" dy="0">192.168.1.192 /26</tspan></text><text x="827" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="827" dy="0">machines : .193 à .254</tspan></text><text x="827" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="827" dy="0">diffusion : .255</tspan></text><text x="827" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="827" dy="0">62 machines</tspan></text><text x="40" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">0</tspan></text><text x="265" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="265" dy="0">64</tspan></text><text x="490" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="490" dy="0">128</tspan></text><text x="715" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="715" dy="0">192</tspan></text><text x="940" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="940" dy="0">256</tspan></text><rect x="40" y="320" width="900" height="36.125" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="52" y="342.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">Chaque sous-réseau a son adresse de réseau (1ère) et sa diffusion (dernière) : 64 − 2 = 62 machines utilisables.</tspan></text></svg>
