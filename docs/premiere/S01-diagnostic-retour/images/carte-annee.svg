<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img"><title>La carte de l'année de Première</title><desc>Six étapes : comprendre les couches et protocoles, découper et relier, séparer avec les VLAN, héberger des services, protéger, puis le projet A2.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="980" height="520" fill="#ffffff" rx="10"/><text x="490.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0">La carte de l'année : six étapes, une brique à la fois</tspan></text><line x1="78" y1="70" x2="78" y2="500" stroke="#9fa8da" stroke-width="4" stroke-linecap="round"/><circle cx="78" cy="92" r="18" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="78" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="78" dy="0">1</tspan></text><rect x="120" y="62" width="820" height="62" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="145" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="145" dy="0">Comprendre</tspan></text><text x="145" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="145" dy="0">Les couches, les trames, les protocoles usuels</tspan></text><rect x="820" y="76" width="100" height="34" rx="17" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><text x="870" y="99" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">S03–S04</tspan></text><circle cx="78" cy="168" r="18" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="78" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="78" dy="0">2</tspan></text><rect x="120" y="138" width="820" height="62" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/><text x="145" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#00897b" text-anchor="start" font-weight="700"><tspan x="145" dy="0">Découper et relier</tspan></text><text x="145" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="145" dy="0">Switch administrable, sous-réseaux, routeur</tspan></text><rect x="820" y="152" width="100" height="34" rx="17" fill="#ffffff" stroke="#00897b" stroke-width="2"/><text x="870" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">S05–S07</tspan></text><circle cx="78" cy="244" r="18" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="78" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="78" dy="0">3</tspan></text><rect x="120" y="214" width="820" height="62" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="145" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="145" dy="0">Séparer</tspan></text><text x="145" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="145" dy="0">VLAN et trunk : deux réseaux sur un même switch</tspan></text><rect x="820" y="228" width="100" height="34" rx="17" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/><text x="870" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">S08–S09</tspan></text><circle cx="78" cy="320" r="18" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="78" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="78" dy="0">4</tspan></text><rect x="120" y="290" width="820" height="62" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="145" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="145" dy="0">Héberger</tspan></text><text x="145" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="145" dy="0">Serveur Linux, SSH, DHCP, DNS, web, partage</tspan></text><rect x="820" y="304" width="100" height="34" rx="17" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="870" y="327" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">S10–S12</tspan></text><circle cx="78" cy="396" r="18" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="78" y="401" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="78" dy="0">5</tspan></text><rect x="120" y="366" width="820" height="62" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="145" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="145" dy="0">Protéger</tspan></text><text x="145" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="145" dy="0">Cuivre certifié, fibre, sécurité de base</tspan></text><rect x="820" y="380" width="100" height="34" rx="17" fill="#ffffff" stroke="#c62828" stroke-width="2"/><text x="870" y="403" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">S13–S14</tspan></text><circle cx="78" cy="472" r="18" fill="#b28704" stroke="#ffffff" stroke-width="2"/><text x="78" y="477" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="78" dy="0">6</tspan></text><rect x="120" y="442" width="820" height="62" rx="12" fill="#fffde7" stroke="#b28704" stroke-width="2.5"/><text x="145" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#b28704" text-anchor="start" font-weight="700"><tspan x="145" dy="0">Le projet A2</tspan></text><text x="145" y="492" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="145" dy="0">Étude, réalisation, recette, soutenance</tspan></text><rect x="820" y="456" width="100" height="34" rx="17" fill="#ffffff" stroke="#b28704" stroke-width="2"/><text x="870" y="479" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#b28704" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">S15–S20</tspan></text></svg>
