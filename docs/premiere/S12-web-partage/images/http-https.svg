<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img"><title>HTTP et HTTPS vus par un espion sur le réseau</title><desc>En HTTP, le contenu de la page est lisible par quiconque capture les trames. En HTTPS, il est chiffré : seul le serveur et le navigateur le lisent.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="430" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">HTTP en clair, HTTPS chiffré : ce que voit un espion</tspan></text><rect x="30" y="60" width="450" height="300" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="255" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="255" dy="0">HTTP (port 80)</tspan></text><rect x="55" y="110" width="400" height="170" rx="8" fill="#ffffff" stroke="#c62828" stroke-width="2"/><text x="70" y="142" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="70" dy="0">GET /direction.html HTTP/1.1</tspan></text><text x="70" y="170" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="70" dy="0">Host: intranet.mecapro.local</tspan></text><text x="70" y="198" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="70" dy="0"></tspan></text><text x="70" y="226" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="70" dy="0">&lt;h1&gt;Espace Direction&lt;/h1&gt;</tspan></text><text x="70" y="254" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="70" dy="0">salaires : …</tspan></text><text x="255" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="255" dy="0">Tout est lisible</tspan></text><text x="255" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="255" dy="0">(ce qu'on voit dans l'analyseur de trames)</tspan></text><rect x="520" y="60" width="450" height="300" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="745" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="745" dy="0">HTTPS (port 443)</tspan></text><rect x="545" y="110" width="400" height="170" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/><text x="560" y="142" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="560" dy="0">16 03 03 02 ac 01 00 02</tspan></text><text x="560" y="170" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="560" dy="0">a8 03 03 5f 3a 91 d0 7c</tspan></text><text x="560" y="198" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="560" dy="0">e4 af 57 a9 00 86 2e 16</tspan></text><text x="560" y="226" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="560" dy="0">6c 63 99 fa e3 4f ba e6</tspan></text><text x="560" y="254" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="560" dy="0">bc 21 6d 09 6d 33 96 f2</tspan></text><text x="745" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="745" dy="0">Illisible sans la clé</tspan></text><text x="745" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="745" dy="0">(ce qu'on voit dans l'analyseur de trames)</tspan></text><text x="500" y="405" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Le cadenas du navigateur = HTTPS : la page ET les mots de passe sont protégés pendant le trajet.</tspan></text></svg>
