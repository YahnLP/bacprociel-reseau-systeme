<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Partage de fichiers : groupes et droits</title><desc>Deux dossiers partagés, un par service. Le groupe Direction lit et écrit dans son dossier mais n'a aucun accès à celui de l'Atelier, et réciproquement.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un partage = des dossiers + des groupes + des droits</tspan></text><circle cx="70" cy="79" r="11" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><path d="M50,111 a20,20 0 0 1 40,0 z" fill="#e8eaf6" stroke="#3949ab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="70" dy="0">alice</tspan></text><circle cx="70" cy="184" r="11" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><path d="M50,216 a20,20 0 0 1 40,0 z" fill="#e8eaf6" stroke="#3949ab" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="70" dy="0">bob</tspan></text><circle cx="70" cy="319" r="11" fill="#e8eaf6" stroke="#ef6c00" stroke-width="3"/><path d="M50,351 a20,20 0 0 1 40,0 z" fill="#e8eaf6" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="70" dy="0">carl</tspan></text><rect x="190" y="125" width="130" height="44" rx="22" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="255" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="255" dy="0">Direction</tspan></text><rect x="190" y="313" width="130" height="44" rx="22" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="255" y="341" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="255" dy="0">Atelier</tspan></text><line x1="108" y1="100" x2="190" y2="140" stroke="#3949ab" stroke-width="3" stroke-linecap="round"/><line x1="108" y1="205" x2="190" y2="158" stroke="#3949ab" stroke-width="3" stroke-linecap="round"/><line x1="108" y1="340" x2="190" y2="335" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><text x="255" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="255" dy="0">groupe</tspan></text><text x="255" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="255" dy="0">groupe</tspan></text><rect x="620" y="90" width="330" height="100" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="785" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="785" dy="0">\\SRV\direction</tspan></text><text x="785" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="785" dy="0">groupe Direction : lecture + écriture</tspan></text><text x="785" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="785" dy="0">autres : aucun accès</tspan></text><rect x="620" y="290" width="330" height="100" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="785" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="785" dy="0">\\SRV\atelier</tspan></text><text x="785" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="785" dy="0">groupe Atelier : lecture + écriture</tspan></text><text x="785" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="785" dy="0">autres : aucun accès</tspan></text><line x1="320" y1="147" x2="610" y2="140" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="465" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="465" dy="0">accès autorisé</tspan></text><line x1="320" y1="335" x2="610" y2="340" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="465" y="365" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="465" dy="0">accès autorisé</tspan></text><line x1="320" y1="318" x2="625" y2="195" stroke="#c62828" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="462.2" y1="249.2" x2="477.8" y2="264.8" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="477.8" y1="249.2" x2="462.2" y2="264.8" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="540" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="540" dy="0">accès refusé</tspan></text><rect x="40" y="415" width="920" height="54.25" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="52" y="437.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">Principe : on donne les droits à des GROUPES, jamais personne par personne. Un nouvel arrivant dans la Direction =</tspan><tspan x="52" dy="18.1">on l'ajoute au groupe, et c'est tout.</tspan></text></svg>
