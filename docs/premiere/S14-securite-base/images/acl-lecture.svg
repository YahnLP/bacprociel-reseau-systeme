<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Comment le routeur lit une liste de filtrage (ACL)</title><desc>Le routeur compare chaque paquet aux règles de haut en bas ; la première règle qui correspond s'applique, puis il s'arrête. Une règle « refuser tout » termine la liste.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Une ACL se lit de haut en bas : la 1re règle qui correspond gagne</tspan></text><text x="40" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Liste « WEB-ONLY » appliquée en entrée sur l'interface côté postes</tspan></text><rect x="40" y="90" width="560" height="48" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><circle cx="70" cy="114" r="15" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="70" y="119" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="70" dy="0">10</tspan></text><text x="100" y="121" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="100" dy="0">permit</tspan></text><text x="190" y="120" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="190" dy="0">tcp  192.168.10.0/24  →  192.168.20.100  port 80</tspan></text><rect x="40" y="150" width="560" height="48" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><circle cx="70" cy="174" r="15" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="70" y="179" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="70" dy="0">20</tspan></text><text x="100" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="100" dy="0">permit</tspan></text><text x="190" y="180" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="190" dy="0">tcp  192.168.10.0/24  →  192.168.20.100  port 443</tspan></text><rect x="40" y="210" width="560" height="48" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><circle cx="70" cy="234" r="15" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="70" y="239" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="70" dy="0">30</tspan></text><text x="100" y="241" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="100" dy="0">deny</tspan></text><text x="190" y="240" font-family="Consolas, Menlo, monospace" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="190" dy="0">ip  tout  →  tout</tspan></text><text x="40" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Tests depuis un poste du réseau 192.168.10.0/24 :</tspan></text><text x="60" y="333" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Navigateur vers le serveur (port 80)</tspan></text><text x="420" y="333" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="start" font-weight="700"><tspan x="420" dy="0">→ règle 10</tspan></text><rect x="520" y="313" width="110" height="30" rx="15" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="575" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="575" dy="0">AUTORISÉ</tspan></text><text x="60" y="377" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Ping vers le serveur (ICMP)</tspan></text><text x="420" y="377" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="start" font-weight="700"><tspan x="420" dy="0">→ règle 30</tspan></text><rect x="520" y="357" width="110" height="30" rx="15" fill="#c62828" stroke="#c62828" stroke-width="0"/><text x="575" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="575" dy="0">REFUSÉ</tspan></text><text x="60" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Accès SSH vers le serveur (port 22)</tspan></text><text x="420" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="start" font-weight="700"><tspan x="420" dy="0">→ règle 30</tspan></text><rect x="520" y="401" width="110" height="30" rx="15" fill="#c62828" stroke="#c62828" stroke-width="0"/><text x="575" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="575" dy="0">REFUSÉ</tspan></text><rect x="660" y="90" width="300" height="168" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="810" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8a6d00" text-anchor="middle" font-weight="700"><tspan x="810" dy="0">Bon à savoir</tspan></text><text x="676" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="676" dy="0">• chaque ACL se termine par un</tspan></text><text x="676" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="676" dy="0">  « deny » implicite (même caché)</tspan></text><text x="676" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="676" dy="0">• l'ordre des règles compte</tspan></text><text x="676" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="676" dy="0">• on place l'ACL le plus près</tspan></text><text x="676" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="676" dy="0">  possible de la source</tspan></text></svg>
