<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img"><title>La sécurité par couches</title><desc>Plusieurs barrières successives : accès physique, réseau, équipements, systèmes et utilisateurs. Si une barrière cède, la suivante protège encore.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="480" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Défense en profondeur : plusieurs barrières, pas une seule</tspan></text><rect x="50" y="60" width="900" height="66" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="72" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="72" dy="0">Utilisateurs</tspan></text><text x="72" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="72" dy="0">sensibilisation, mots de passe longs, pas de partage de compte</tspan></text><rect x="90" y="136" width="820" height="66" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="112" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="112" dy="0">Systèmes</tspan></text><text x="112" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="112" dy="0">mises à jour, pare-feu du poste, services inutiles coupés</tspan></text><rect x="130" y="212" width="740" height="66" rx="14" fill="#fffde7" stroke="#b28704" stroke-width="3"/><text x="152" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#b28704" text-anchor="start" font-weight="700"><tspan x="152" dy="0">Équipements réseau</tspan></text><text x="152" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="152" dy="0">mots de passe forts, SSH (pas Telnet), ports libres coupés, sauvegarde</tspan></text><rect x="170" y="288" width="660" height="66" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="192" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="192" dy="0">Réseau</tspan></text><text x="192" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="192" dy="0">VLAN, filtrage (ACL) entre les zones, Wi-Fi invités séparé</tspan></text><rect x="210" y="364" width="580" height="66" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="232" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="232" dy="0">Accès physique</tspan></text><text x="232" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="232" dy="0">local technique et baie fermés à clé, badge, caméra</tspan></text></svg>
