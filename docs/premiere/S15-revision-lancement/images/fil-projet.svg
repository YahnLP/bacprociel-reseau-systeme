<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Le fil du projet A2 en quatre étapes</title><desc>Le projet se déroule sur quatre séances : étude, réalisation, recette puis soutenance. Chaque étape produit un livrable précis.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Quatre séances, quatre livrables</tspan></text><rect x="40" y="80" width="210" height="230" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="145" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="145" dy="0">S16</tspan></text><text x="145" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="145" dy="0">Étude</tspan></text><text x="145" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="145" dy="0">schéma, plan d'adressage,</tspan></text><text x="145" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="145" dy="0">liste du matériel</tspan></text><line x1="254" y1="195" x2="274" y2="195" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="278" y="80" width="210" height="230" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="383" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="383" dy="0">S17</tspan></text><text x="383" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="383" dy="0">Réalisation</tspan></text><text x="383" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="383" dy="0">câblage, VLAN, routeur,</tspan></text><text x="383" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="383" dy="0">serveur, Wi-Fi, sauvegardes</tspan></text><line x1="492" y1="195" x2="512" y2="195" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="516" y="80" width="210" height="230" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="621" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="621" dy="0">S18</tspan></text><text x="621" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="621" dy="0">Recette</tspan></text><text x="621" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="621" dy="0">tests, pannes à réparer,</tspan></text><text x="621" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="621" dy="0">dossier technique</tspan></text><line x1="730" y1="195" x2="750" y2="195" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="754" y="80" width="210" height="230" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="859" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="859" dy="0">S19</tspan></text><text x="859" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="859" dy="0">Soutenance</tspan></text><text x="859" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="859" dy="0">démonstration,</tspan></text><text x="859" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="859" dy="0">questions, panne en direct</tspan></text><text x="500" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Tout ce que tu as appris de S05 à S14 sert ici : switch, VLAN, routeur, DHCP, DNS, web, sécurité.</tspan></text></svg>
