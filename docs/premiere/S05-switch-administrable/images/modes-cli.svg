<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" role="img"><title>Les modes de la console Cisco</title><desc>Quatre modes : utilisateur, privilégié, configuration globale, configuration d'interface. enable monte d'un mode, configure terminal aussi, interface aussi ; exit redescend.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="980" height="570" fill="#ffffff" rx="10"/><text x="490.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0">Les modes de la console : on monte, on descend</tspan></text><rect x="170" y="60" width="640" height="85" rx="12" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="190" y="94" font-family="Consolas, Menlo, monospace" font-size="20" fill="#90a4ae" text-anchor="start" font-weight="700"><tspan x="190" dy="0">SW&gt;</tspan></text><text x="190" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="190" dy="0">Mode utilisateur</tspan></text><text x="190" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="190" dy="0">regarder un peu (show limité)</tspan></text><rect x="170" y="185" width="640" height="85" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="190" y="219" font-family="Consolas, Menlo, monospace" font-size="20" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="190" dy="0">SW#</tspan></text><text x="190" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="190" dy="0">Mode privilégié</tspan></text><text x="190" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="190" dy="0">tout regarder (show …), sauvegarder</tspan></text><rect x="170" y="310" width="640" height="85" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="190" y="344" font-family="Consolas, Menlo, monospace" font-size="20" fill="#00897b" text-anchor="start" font-weight="700"><tspan x="190" dy="0">SW(config)#</tspan></text><text x="190" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="190" dy="0">Configuration globale</tspan></text><text x="190" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="190" dy="0">nom, mots de passe, routes… (ce qui concerne tout le switch)</tspan></text><rect x="170" y="435" width="640" height="85" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="190" y="469" font-family="Consolas, Menlo, monospace" font-size="20" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="190" dy="0">SW(config-if)#</tspan></text><text x="190" y="495" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="190" dy="0">Configuration d'une interface (ou d'une ligne)</tspan></text><text x="190" y="513" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="190" dy="0">description, shutdown, VLAN… (un port à la fois)</tspan></text><line x1="330" y1="148" x2="330" y2="182" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="345" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="start" font-weight="700"><tspan x="345" dy="0">enable</tspan></text><text x="345" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="345" dy="0">enable</tspan></text><line x1="650" y1="182" x2="650" y2="148" stroke="#c62828" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="665" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="start" font-weight="700"><tspan x="665" dy="0">exit</tspan></text><text x="665" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="665" dy="0">exit</tspan></text><line x1="330" y1="273" x2="330" y2="307" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="345" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="start" font-weight="700"><tspan x="345" dy="0">configure terminal</tspan></text><text x="345" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="345" dy="0">configure terminal</tspan></text><line x1="650" y1="307" x2="650" y2="273" stroke="#c62828" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="665" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="start" font-weight="700"><tspan x="665" dy="0">exit</tspan></text><text x="665" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="665" dy="0">exit</tspan></text><line x1="330" y1="398" x2="330" y2="432" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="345" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="start" font-weight="700"><tspan x="345" dy="0">interface fa0/1</tspan></text><text x="345" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="345" dy="0">interface fa0/1</tspan></text><line x1="650" y1="432" x2="650" y2="398" stroke="#c62828" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="665" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="start" font-weight="700"><tspan x="665" dy="0">exit</tspan></text><text x="665" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="665" dy="0">exit</tspan></text><text x="490" y="548" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="490" dy="0">end  (ou Ctrl+Z) : retour direct au mode privilégié</tspan></text></svg>
