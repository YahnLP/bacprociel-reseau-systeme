<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Un trunk transporte plusieurs VLAN sur un seul câble</title><desc>Deux switchs reliés par un seul câble trunk. Les trames des VLAN 10 et 20 y circulent avec une étiquette indiquant leur VLAN.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un seul câble, plusieurs VLAN : le trunk</tspan></text><rect x="180" y="202" width="180" height="56" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="270" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="270" dy="0">SW1 – bâtiment A</tspan></text><rect x="640" y="202" width="180" height="56" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="730" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="730" dy="0">SW2 – bâtiment B</tspan></text><rect x="10" y="90" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="15" y="95" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="40" y1="130" x2="40" y2="140" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="22" y="138" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="40" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">Direction</tspan></text><text x="40" y="182" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="40" dy="0">VLAN 10</tspan></text><rect x="10" y="300" width="60" height="40" rx="5" fill="#eceff1" stroke="#ef6c00" stroke-width="3"/><rect x="15" y="305" width="50" height="30" rx="3" fill="#c5cae9" stroke="#ef6c00" stroke-width="1"/><line x1="40" y1="340" x2="40" y2="350" stroke="#ef6c00" stroke-width="4" stroke-linecap="round"/><rect x="22" y="348" width="36" height="7" rx="3" fill="#eceff1" stroke="#ef6c00" stroke-width="2"/><text x="40" y="375" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">Atelier</tspan></text><text x="40" y="392" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="40" dy="0">VLAN 20</tspan></text><line x1="75" y1="120" x2="330" y2="202" stroke="#3949ab" stroke-width="3" stroke-linecap="round"/><line x1="75" y1="330" x2="330" y2="258" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="930" y="90" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="935" y="95" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="960" y1="130" x2="960" y2="140" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="942" y="138" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="960" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="960" dy="0">Direction</tspan></text><text x="960" y="182" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="960" dy="0">VLAN 10</tspan></text><rect x="930" y="300" width="60" height="40" rx="5" fill="#eceff1" stroke="#ef6c00" stroke-width="3"/><rect x="935" y="305" width="50" height="30" rx="3" fill="#c5cae9" stroke="#ef6c00" stroke-width="1"/><line x1="960" y1="340" x2="960" y2="350" stroke="#ef6c00" stroke-width="4" stroke-linecap="round"/><rect x="942" y="348" width="36" height="7" rx="3" fill="#eceff1" stroke="#ef6c00" stroke-width="2"/><text x="960" y="375" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="960" dy="0">Atelier</tspan></text><text x="960" y="392" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="960" dy="0">VLAN 20</tspan></text><line x1="925" y1="120" x2="670" y2="202" stroke="#3949ab" stroke-width="3" stroke-linecap="round"/><line x1="925" y1="330" x2="670" y2="258" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="360" y="216" width="280" height="28" rx="6" fill="#eceff1" stroke="#3a4270" stroke-width="3"/><text x="500.0" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">TRUNK (802.1Q)</tspan></text><rect x="370" y="150" width="130" height="36" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="435" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="435" dy="0">[VLAN 10] trame</tspan></text><rect x="500" y="150" width="130" height="36" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="565" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="565" dy="0">[VLAN 10] trame</tspan></text><rect x="370" y="274" width="130" height="36" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="435" y="297" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="435" dy="0">[VLAN 20] trame</tspan></text><rect x="500" y="274" width="130" height="36" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="565" y="297" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="565" dy="0">[VLAN 20] trame</tspan></text><text x="500" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Chaque trame porte une étiquette (VLAN ID)</tspan></text><rect x="70" y="400" width="860" height="54.25" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="82" y="422.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="82" dy="0">Sur le trunk, la trame est « étiquetée » (4 octets ajoutés : le VLAN ID). Le switch d'arrivée lit</tspan><tspan x="82" dy="18.1">l'étiquette, l'enlève et envoie la trame seulement aux ports de ce VLAN.</tspan></text></svg>
