<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img"><title>Que fait un routeur d'un paquet ?</title><desc>Il lit l'adresse de destination, cherche la route la plus précise dans sa table, puis envoie au prochain routeur ; sans route il rejette.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="470" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Ce que fait un routeur de chaque paquet</tspan></text><rect x="60" y="60" width="380" height="70" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="88" cy="95" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="88" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="88" dy="0">1</tspan></text><text x="116" y="91" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="116" dy="0">Lire l'adresse de destination</tspan></text><text x="116" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="116" dy="0">dans l'en-tête IP</tspan></text><rect x="60" y="155" width="380" height="70" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="88" cy="190" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="88" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="88" dy="0">2</tspan></text><text x="116" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="116" dy="0">Chercher dans la table de routage</tspan></text><text x="116" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="116" dy="0">la route la plus précise (masque le plus long)</tspan></text><line x1="250" y1="130" x2="250" y2="155" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="480" y="110" width="340" height="100" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="650" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="650" dy="0">Une route correspond-elle ?</tspan></text><text x="650" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="650" dy="0">(réseau connecté, statique, par défaut)</tspan></text><line x1="440" y1="190" x2="480" y2="160" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="590" y1="210" x2="590" y2="255" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="608" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="608" dy="0">oui</tspan></text><rect x="440" y="260" width="300" height="80" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="590" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">3. Envoyer au prochain saut</tspan></text><text x="590" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="590" dy="0">ou directement (réseau connecté)</tspan></text><line x1="780" y1="210" x2="780" y2="348" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="798" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="798" dy="0">non</tspan></text><rect x="60" y="350" width="760" height="80" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="440" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="440" dy="0">Sinon : pas de route ⇒ le paquet est jeté</tspan></text><text x="440" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="440" dy="0">le routeur répond « destination injoignable » à l'émetteur (message ICMP)</tspan></text></svg>
