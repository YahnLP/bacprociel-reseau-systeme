<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Bilan de liaison optique</title><desc>Le bilan additionne les pertes de la fibre, des connecteurs et des soudures ; il doit rester inférieur à la perte maximale admise par l'émetteur.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Bilan de liaison : on additionne les pertes en dB</tspan></text><rect x="48" y="138" width="84" height="26" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="55.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="64.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="73.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="82.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="91.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="100.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="109.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="118.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="52" cy="142" r="2" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="90" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="90" dy="0">Switch A</tspan></text><rect x="868" y="138" width="84" height="26" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="875.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="884.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="893.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="902.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="911.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="920.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="929.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="938.0" y="146" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="872" cy="142" r="2" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="910" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="910" dy="0">Switch B</tspan></text><line x1="140" y1="150" x2="860" y2="150" stroke="#b28704" stroke-width="5" stroke-linecap="round"/><circle cx="200" cy="150" r="9" fill="#ffffff" stroke="#c62828" stroke-width="3"/><text x="200" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="200" dy="0">connecteur</tspan></text><text x="200" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="200" dy="0">0,5 dB</tspan></text><circle cx="500" cy="150" r="9" fill="#ffffff" stroke="#c62828" stroke-width="3"/><text x="500" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">soudure</tspan></text><text x="500" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">0,1 dB</tspan></text><circle cx="800" cy="150" r="9" fill="#ffffff" stroke="#c62828" stroke-width="3"/><text x="800" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">connecteur</tspan></text><text x="800" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">0,5 dB</tspan></text><text x="350" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8a6d00" text-anchor="middle" font-weight="700"><tspan x="350" dy="0">fibre 2 km × 0,4 dB/km = 0,8 dB</tspan></text><rect x="40" y="230" width="920" height="130" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="60" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Perte totale = 0,8 + 0,5 + 0,1 + 0,5 = 1,9 dB</tspan></text><text x="60" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Perte maximale admise par l'émetteur (exemple 1000BASE-LX) : environ 6 dB</tspan></text><text x="60" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="60" dy="0">1,9 dB &lt; 6 dB  ⇒  marge de 4,1 dB : la liaison est conforme</tspan></text><text x="60" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="60" dy="0">(Valeurs usuelles d'exercice : à vérifier avec la fiche technique des composants utilisés.)</tspan></text></svg>
