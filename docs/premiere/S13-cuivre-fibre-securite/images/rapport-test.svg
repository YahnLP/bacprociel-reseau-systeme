<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Lire un rapport de test cuivre</title><desc>Trois liaisons testées : la A est conforme, la B dépasse la longueur maximale du lien permanent (90 m), la C a une paire inversée.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un rapport de test : trois liaisons, trois verdicts</tspan></text><rect x="30" y="60" width="940" height="40" rx="6" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="40" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Liaison</tspan></text><text x="170" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="170" dy="0">Longueur</tspan></text><text x="300" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="300" dy="0">Cartographie</tspan></text><text x="470" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="470" dy="0">Atténuation</tspan></text><text x="640" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="640" dy="0">Diaphonie (NEXT)</tspan></text><text x="840" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="840" dy="0">Résultat</tspan></text><rect x="30" y="100" width="940" height="52" rx="0" fill="#e8f5e9" stroke="#90a4ae" stroke-width="1"/><text x="40" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">A  bureau 12</tspan></text><text x="170" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="170" dy="0">62 m</tspan></text><text x="300" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="300" dy="0">OK</tspan></text><text x="470" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="470" dy="0">OK (marge 6,1 dB)</tspan></text><text x="640" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="640" dy="0">OK (marge 8,4 dB)</tspan></text><text x="840" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="840" dy="0">RÉUSSI</tspan></text><rect x="30" y="152" width="940" height="52" rx="0" fill="#ffebee" stroke="#90a4ae" stroke-width="1"/><text x="40" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">B  atelier 03</tspan></text><text x="170" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="170" dy="0">103 m</tspan></text><text x="300" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="300" dy="0">OK</tspan></text><text x="470" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="470" dy="0">ÉCHEC (−2,0 dB)</tspan></text><text x="640" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="640" dy="0">OK (marge 3,0 dB)</tspan></text><text x="840" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="840" dy="0">ÉCHEC</tspan></text><rect x="30" y="204" width="940" height="52" rx="0" fill="#ffebee" stroke="#90a4ae" stroke-width="1"/><text x="40" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">C  accueil 01</tspan></text><text x="170" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="170" dy="0">34 m</tspan></text><text x="300" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="300" dy="0">Paire 1-2 inversée</tspan></text><text x="470" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="470" dy="0">—</tspan></text><text x="640" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="640" dy="0">—</tspan></text><text x="840" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="840" dy="0">ÉCHEC</tspan></text><text x="40" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">À savoir : limite du lien permanent = 90 m ; avec les 2 cordons de brassage (5 m chacun) : canal = 100 m.</tspan></text><rect x="40" y="310" width="920" height="54.25" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="52" y="332.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">B : 103 m &gt; 90 m : le câble est trop long, d'où l'atténuation hors limite. Remède : raccourcir le trajet, ou ajouter</tspan><tspan x="52" dy="18.1">un brassage intermédiaire (un switch) près du poste, ou passer en fibre.</tspan></text><rect x="40" y="375" width="920" height="54.25" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="52" y="397.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">C : une paire inversée (broches 1 et 2) se corrige en ré-sertissant / re-poinçonnant la prise. Le câble fait</tspan><tspan x="52" dy="18.1">pourtant passer le courant : seul un testeur de cartographie le voit.</tspan></text></svg>
