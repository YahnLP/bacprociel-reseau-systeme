<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img"><title>Fibre monomode et multimode</title><desc>En monomode le cœur de 9 µm ne laisse passer qu'un seul chemin à la lumière, ce qui permet de grandes distances. En multimode, le cœur de 50 µm laisse passer plusieurs chemins : distance limitée.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="520" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Fibre optique : monomode (OS2) ou multimode (OM3/OM4) ?</tspan></text><rect x="30" y="55" width="450" height="330" rx="14" fill="#fffde7" stroke="#b28704" stroke-width="3"/><text x="255" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#b28704" text-anchor="middle" font-weight="700"><tspan x="255" dy="0">MONOMODE (OS2) – gaine jaune</tspan></text><rect x="55" y="118" width="400" height="90" rx="4" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/><rect x="55" y="148.6" width="400" height="28.799999999999997" rx="2" fill="#b28704" stroke="#b28704" stroke-width="0" opacity="0.35"/><text x="255" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="255" dy="0">coupe d'une fibre : gaine de 125 µm (cadre), cœur coloré</tspan></text><path d="M60,163 L160,163 L260,163 L360,163 L450,163" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="60" dy="0">• cœur 9 µm</tspan></text><text x="60" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">• 1 seul chemin de lumière</tspan></text><text x="60" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">• laser 1310 / 1550 nm</tspan></text><text x="60" y="329" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">• de 2 km à plus de 10 km</tspan></text><text x="60" y="357" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">• ex. 1000BASE-LX, 10GBASE-LR</tspan></text><rect x="520" y="55" width="450" height="330" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="745" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16.5" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="745" dy="0">MULTIMODE (OM3/OM4) – gaine aqua</tspan></text><rect x="545" y="118" width="400" height="90" rx="4" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/><rect x="545" y="124.0" width="400" height="78.0" rx="2" fill="#00897b" stroke="#00897b" stroke-width="0" opacity="0.35"/><text x="745" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="745" dy="0">coupe d'une fibre : gaine de 125 µm (cadre), cœur coloré</tspan></text><path d="M550,144 L650,124 L750,163 L850,124 L940,144" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M550,163 L650,163 L750,163 L850,163 L940,163" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M550,182 L650,202 L750,163 L850,202 L940,182" fill="none" stroke="#c62828" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="550" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="550" dy="0">• cœur 50 µm</tspan></text><text x="550" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="550" dy="0">• plusieurs chemins de lumière</tspan></text><text x="550" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="550" dy="0">• VCSEL 850 nm</tspan></text><text x="550" y="329" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="550" dy="0">• jusqu'à 300 – 400 m en 10 G</tspan></text><text x="550" y="357" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="550" dy="0">• ex. 1000BASE-SX, 10GBASE-SR</tspan></text><rect x="30" y="400" width="940" height="100" rx="10" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/><text x="50" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Connecteurs usuels :  LC (petit, 2 fibres, le plus courant sur les SFP) · SC (carré, à clic) · ST (à baïonnette, anciens)</tspan></text><text x="50" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Jarretière duplex : une fibre pour émettre, une pour recevoir (attention à ne pas inverser Tx/Rx).</tspan></text><text x="50" y="482" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Propreté : on nettoie TOUJOURS les extrémités avant de brancher ; un grain de poussière peut couper la liaison.</tspan></text></svg>
