<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img"><title>Ce qui se passe quand on tape ssh</title><desc>Le client ouvre une connexion TCP vers le port 22 du serveur, vérifie l'empreinte du serveur, puis s'authentifie par mot de passe ou par clé, et obtient un terminal chiffré.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="560" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Se connecter en SSH : les 4 étapes</tspan></text><rect x="135" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="240" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="240" dy="0">Poste admin (client)</tspan></text><text x="240" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="240" dy="0">ssh eleve@192.168.20.100</tspan></text><line x1="240" y1="100" x2="240" y2="403" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="655" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="760" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="760" dy="0">Serveur Linux</tspan></text><text x="760" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="760" dy="0">openssh-server – port 22</tspan></text><line x1="760" y1="100" x2="760" y2="403" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="248" y1="145" x2="752" y2="145" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="500.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">① connexion TCP vers le port 22</tspan></text><text x="500.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">① connexion TCP vers le port 22</tspan></text><line x1="752" y1="207" x2="248" y2="207" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="500.0" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">② empreinte du serveur (clé d'hôte)</tspan></text><text x="500.0" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">② empreinte du serveur (clé d'hôte)</tspan></text><line x1="248" y1="269" x2="752" y2="269" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="500.0" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">③ identifiant + mot de passe (ou clé)</tspan></text><text x="500.0" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">③ identifiant + mot de passe (ou clé)</tspan></text><line x1="752" y1="331" x2="248" y2="331" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="500.0" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">④ accès accordé : terminal chiffré</tspan></text><text x="500.0" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">④ accès accordé : terminal chiffré</tspan></text><rect x="60" y="433" width="880" height="72.375" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="72" y="455.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="72" dy="0">1re connexion : le client demande « Are you sure you want to continue connecting (yes/no) ? » : il mémorise</tspan><tspan x="72" dy="18.1">l'empreinte dans known_hosts. Si elle change plus tard, SSH alerte : le serveur a été réinstallé… ou quelqu'un</tspan><tspan x="72" dy="18.1">se fait passer pour lui.</tspan></text></svg>
