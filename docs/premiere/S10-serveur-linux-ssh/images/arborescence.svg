<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>L'arborescence Linux</title><desc>Tout part de la racine /. Les dossiers importants pour l'administrateur : /etc pour la configuration, /var/log pour les journaux, /home pour les utilisateurs.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Linux : tout part de la racine « / »</tspan></text><rect x="430" y="55" width="140" height="46" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="500" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">/</tspan></text><line x1="500" y1="101" x2="120" y2="190" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/><rect x="40" y="190" width="160" height="150" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="120" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="120" dy="0">/etc</tspan></text><text x="120" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="120" dy="0">configuration</tspan></text><text x="120" y="308" font-family="Consolas, Menlo, monospace" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="120" dy="0">netplan/ ssh/ hostname</tspan></text><line x1="500" y1="101" x2="310" y2="190" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/><rect x="230" y="190" width="160" height="150" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="310" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="310" dy="0">/home</tspan></text><text x="310" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="310" dy="0">dossiers des</tspan><tspan x="310" dy="16.9">utilisateurs</tspan></text><text x="310" y="308" font-family="Consolas, Menlo, monospace" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="310" dy="0">eleve/ admin/</tspan></text><line x1="500" y1="101" x2="500" y2="190" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/><rect x="420" y="190" width="160" height="150" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="500" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">/var/log</tspan></text><text x="500" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">journaux</tspan></text><text x="500" y="308" font-family="Consolas, Menlo, monospace" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">auth.log syslog</tspan></text><line x1="500" y1="101" x2="690" y2="190" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/><rect x="610" y="190" width="160" height="150" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/><text x="690" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="690" dy="0">/usr/bin</tspan></text><text x="690" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="690" dy="0">programmes</tspan></text><text x="690" y="308" font-family="Consolas, Menlo, monospace" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="690" dy="0">ls cat ssh</tspan></text><line x1="500" y1="101" x2="880" y2="190" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/><rect x="800" y="190" width="160" height="150" rx="12" fill="#eceff1" stroke="#90a4ae" stroke-width="2.5"/><text x="880" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="880" dy="0">/tmp</tspan></text><text x="880" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="880" dy="0">fichiers</tspan><tspan x="880" dy="16.9">temporaires</tspan></text><text x="880" y="308" font-family="Consolas, Menlo, monospace" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="880" dy="0">effacé au redémarrage</tspan></text><rect x="40" y="375" width="920" height="54.25" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="52" y="397.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">Chemin absolu : il commence par « / » (ex. /etc/ssh/sshd_config). Chemin relatif : à partir de là où l'on est (pwd).</tspan><tspan x="52" dy="18.1">« ~ » = ton dossier personnel.</tspan></text></svg>
