<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 610" width="940" height="610" role="img"><title>TCP puis HTTP</title><desc>Poignée de main TCP en trois temps (SYN, SYN-ACK, ACK), puis requête HTTP GET, réponse 200 OK, puis fermeture.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="610" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Ouvrir une page web : la poignée de main TCP, puis HTTP</tspan></text><rect x="115" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="220" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="220" dy="0">PC (client)</tspan></text><text x="220" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="220" dy="0">192.168.1.10 : port 49499</tspan></text><line x1="220" y1="100" x2="220" y2="575" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="615" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="720" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="720" dy="0">Serveur web</tspan></text><text x="720" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="720" dy="0">198.51.100.80 : port 80</tspan></text><line x1="720" y1="100" x2="720" y2="575" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="228" y1="145" x2="712" y2="145" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="470.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">SYN « On se parle ? »</tspan></text><text x="470.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">SYN « On se parle ? »</tspan></text><line x1="712" y1="215" x2="228" y2="215" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="470.0" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">SYN-ACK « Oui, et toi ? »</tspan></text><text x="470.0" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">SYN-ACK « Oui, et toi ? »</tspan></text><line x1="228" y1="285" x2="712" y2="285" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="470.0" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">ACK « Oui » → connexion ouverte</tspan></text><text x="470.0" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">ACK « Oui » → connexion ouverte</tspan></text><line x1="228" y1="355" x2="712" y2="355" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="470.0" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">HTTP GET / « Donne-moi la page »</tspan></text><text x="470.0" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">HTTP GET / « Donne-moi la page »</tspan></text><line x1="712" y1="425" x2="228" y2="425" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="470.0" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">HTTP 200 OK + la page web</tspan></text><text x="470.0" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">HTTP 200 OK + la page web</tspan></text><line x1="712" y1="495" x2="228" y2="495" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="470.0" y="486" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">FIN « J'ai fini » (puis ACK du client)</tspan></text><text x="470.0" y="486" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">FIN « J'ai fini » (puis ACK du client)</tspan></text><rect x="40" y="555" width="860" height="38" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/><text x="470" y="580" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">Les 3 premiers messages = TCP (transport). GET et 200 OK = HTTP (application).</tspan></text></svg>
