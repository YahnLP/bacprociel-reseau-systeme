<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img"><title>DHCP : DORA</title><desc>Le client diffuse un Discover, le serveur propose une adresse (Offer), le client la demande (Request), le serveur confirme (ACK).</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="470" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">DHCP : les quatre messages « DORA »</tspan></text><rect x="115" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="220" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="220" dy="0">PC (client)</tspan></text><text x="220" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="220" dy="0">pas d'adresse : 0.0.0.0</tspan></text><line x1="220" y1="100" x2="220" y2="455" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="615" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="720" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="720" dy="0">Serveur DHCP (box)</tspan></text><text x="720" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="720" dy="0">192.168.1.1</tspan></text><line x1="720" y1="100" x2="720" y2="455" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="228" y1="145" x2="712" y2="145" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="470.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">1 DISCOVER : « Y a-t-il un serveur DHCP ? » (diffusion)</tspan></text><text x="470.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">1 DISCOVER : « Y a-t-il un serveur DHCP ? » (diffusion)</tspan></text><line x1="712" y1="220" x2="228" y2="220" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="470.0" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">2 OFFER : « Je te propose 192.168.1.10 »</tspan></text><text x="470.0" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">2 OFFER : « Je te propose 192.168.1.10 »</tspan></text><line x1="228" y1="295" x2="712" y2="295" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="470.0" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">3 REQUEST : « Je prends 192.168.1.10, merci »</tspan></text><text x="470.0" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">3 REQUEST : « Je prends 192.168.1.10, merci »</tspan></text><line x1="712" y1="370" x2="228" y2="370" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="470.0" y="361" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">4 ACK : « C'est à toi, pour 24 h » (+ masque, passerelle, DNS)</tspan></text><text x="470.0" y="361" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">4 ACK : « C'est à toi, pour 24 h » (+ masque, passerelle, DNS)</tspan></text><text x="470" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">Ports : le client écoute sur UDP 68, le serveur sur UDP 67. Messages en diffusion : le client n'a pas encore d'adresse.</tspan></text></svg>
