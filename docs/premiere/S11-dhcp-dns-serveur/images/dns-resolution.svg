<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"><title>Résolution d'un nom par le serveur DNS local</title><desc>Le poste demande l'adresse de intranet.mecapro.local à son serveur DNS ; le serveur répond avec l'adresse trouvée dans sa zone.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="420" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Le DNS : l'annuaire qui traduit un nom en adresse</tspan></text><rect x="100" y="130" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="105" y="135" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="130" y1="170" x2="130" y2="180" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="112" y="178" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="130" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">Poste</tspan></text><text x="130" y="222" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="130" dy="0">DHCP : 192.168.10.50</tspan></text><rect x="472" y="126" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="481" cy="135.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="492" y1="135.5" x2="520" y2="135.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="472" y="148" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="481" cy="157.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="492" y1="157.5" x2="520" y2="157.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="472" y="170" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="481" cy="179.5" r="3" fill="#f9a825" stroke="#3949ab" stroke-width="1"/><line x1="492" y1="179.5" x2="520" y2="179.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><text x="500" y="213" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">SRV1 – DNS</tspan></text><text x="500" y="230" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">192.168.10.2</tspan></text><rect x="740" y="70" width="230" height="175" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="2.5"/><text x="855" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="855" dy="0">Zone mecapro.local</tspan></text><text x="755" y="128" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="755" dy="0">srv        A  192.168.10.2</tspan></text><text x="755" y="160" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="755" dy="0">intranet   A  192.168.10.2</tspan></text><text x="755" y="192" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="755" dy="0">imprimante A  192.168.10.30</tspan></text><line x1="540" y1="160" x2="740" y2="160" stroke="#ef6c00" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="200" y1="120" x2="440" y2="120" stroke="#3949ab" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="320" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">« intranet.mecapro.local ? »</tspan></text><line x1="440" y1="200" x2="200" y2="200" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="320" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">« c'est 192.168.10.2 »</tspan></text><rect x="40" y="290" width="920" height="54.25" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="52" y="312.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">Le poste connaît l'adresse de son serveur DNS parce que le DHCP la lui a remise (④). Si ce DNS est faux : les</tspan><tspan x="52" dy="18.1">adresses IP marchent, mais PAS les noms.</tspan></text><text x="500" y="385" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Test : nslookup nom  →  la réponse doit donner la bonne adresse</tspan></text></svg>
