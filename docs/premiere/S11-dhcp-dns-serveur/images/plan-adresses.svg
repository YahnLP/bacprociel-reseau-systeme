<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"><title>Plan d'adresses du réseau 192.168.10.0/24</title><desc>La plage dynamique du DHCP (50 à 150) est séparée des adresses fixes (routeur, serveur, imprimante) pour éviter les doublons.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="440" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un plan d'adresses : fixes d'un côté, DHCP de l'autre</tspan></text><rect x="40.0" y="100" width="179.6875" height="90" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="129.84375" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="129.84375" dy="0">Adresses FIXES</tspan></text><text x="129.84375" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="129.84375" dy="0">.1 routeur · .2 serveur ·</tspan><tspan x="129.84375" dy="15.6">.30 imprimante</tspan></text><text x="129.84375" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="129.84375" dy="0">exclues du DHCP</tspan></text><rect x="219.6875" y="100" width="362.96875" height="90" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="401.171875" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="401.171875" dy="0">POOL DHCP</tspan></text><text x="401.171875" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="401.171875" dy="0">192.168.10.50 → .150</tspan></text><text x="401.171875" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="401.171875" dy="0">101 adresses distribuées</tspan></text><rect x="582.65625" y="100" width="373.75" height="90" rx="6" fill="#fffde7" stroke="#f9a825" stroke-width="3"/><text x="769.53125" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8a6d00" text-anchor="middle" font-weight="700"><tspan x="769.53125" dy="0">Libre / réserve</tspan></text><text x="769.53125" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="769.53125" dy="0">pour l'avenir</tspan></text><line x1="40.0" y1="190" x2="40.0" y2="200" stroke="#3a4270" stroke-width="2" stroke-linecap="round"/><text x="40.0" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="40.0" dy="0">.0</tspan></text><line x1="219.6875" y1="190" x2="219.6875" y2="200" stroke="#3a4270" stroke-width="2" stroke-linecap="round"/><text x="219.6875" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="219.6875" dy="0">.50</tspan></text><line x1="579.0625" y1="190" x2="579.0625" y2="200" stroke="#3a4270" stroke-width="2" stroke-linecap="round"/><text x="579.0625" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="579.0625" dy="0">.150</tspan></text><line x1="956.40625" y1="190" x2="956.40625" y2="200" stroke="#3a4270" stroke-width="2" stroke-linecap="round"/><text x="956.40625" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="956.40625" dy="0">.255</tspan></text><text x="500" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">dernier octet de l'adresse (0 à 255)</tspan></text><rect x="40" y="280" width="440" height="130" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="260" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="260" dy="0">Ce que le serveur DHCP remet au poste</tspan></text><text x="62" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="62" dy="0">① une adresse IP (dans le pool)</tspan></text><text x="62" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="62" dy="0">② le masque (255.255.255.0)</tspan></text><text x="62" y="376" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="62" dy="0">③ la passerelle (192.168.10.1)</tspan></text><text x="62" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="62" dy="0">④ le serveur DNS (192.168.10.2)</tspan></text><rect x="520" y="280" width="440" height="130" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="740" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="740" dy="0">Le bail (lease)</tspan></text><text x="540" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="540" dy="0">L'adresse est PRÊTÉE pour une durée (ex. 8 h).</tspan></text><text x="540" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="540" dy="0">À la moitié du bail, le poste demande à renouveler.</tspan></text><text x="540" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="540" dy="0">Poste éteint : l'adresse retourne dans le pool.</tspan></text></svg>
