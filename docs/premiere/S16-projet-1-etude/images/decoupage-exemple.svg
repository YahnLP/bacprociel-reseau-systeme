<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img"><title>Découper un /24 en blocs alignés</title><desc>Exemple d'un autre client : un réseau 192.168.100.0/24 découpé en trois blocs : 100 machines, 40 machines et 12 machines. Les blocs sont rangés du plus grand au plus petit, chacun commence à un multiple de sa taille.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="430" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Exemple (autre client) : ranger du plus grand au plus petit</tspan></text><text x="40" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">192.168.100.0/24 = 256 adresses (de .0 à .255)</tspan></text><rect x="40.0" y="100" width="457.0" height="90" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="270.0" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0">Bureaux</tspan></text><text x="270.0" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="270.0" dy="0">100 machines → /25</tspan></text><text x="270.0" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="270.0" dy="0">.0 à .127</tspan></text><rect x="500.0" y="100" width="227.0" height="90" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="615.0" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0">Atelier</tspan></text><text x="615.0" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="615.0" dy="0">40 machines → /26</tspan></text><text x="615.0" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="615.0" dy="0">.128 à .191</tspan></text><rect x="730.0" y="100" width="54.5" height="90" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><rect x="787.5" y="100" width="169.5" height="90" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="873.75" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="873.75" dy="0">Libre</tspan></text><text x="873.75" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="873.75" dy="0">réserve</tspan></text><text x="873.75" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="873.75" dy="0">.208 à .255</tspan></text><text x="758.75" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="758.75" dy="0">Accueil /28 : .192 à .207</tspan></text><line x1="758.75" y1="195" x2="758.75" y2="208" stroke="#ef6c00" stroke-width="2" stroke-linecap="round"/><rect x="40" y="245" width="920" height="160" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="60" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8a6d00" text-anchor="start" font-weight="700"><tspan x="60" dy="0">La méthode en 4 gestes</tspan></text><text x="60" y="303" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">1. Compter les machines de chaque service, avec une marge de croissance (≈ 30 %).</tspan></text><text x="60" y="329" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">2. Choisir la plus petite puissance de 2 qui contient (machines + 3) : réseau, diffusion, passerelle.</tspan></text><text x="60" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">3. Classer du plus grand au plus petit et placer chaque bloc à un multiple de sa taille.</tspan></text><text x="60" y="381" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">4. Noter dans le plan : réseau, masque, passerelle, plage DHCP, adresses fixes.</tspan></text></svg>
