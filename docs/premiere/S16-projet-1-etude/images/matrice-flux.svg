="#eceff1" stroke="#90a4ae" stroke-width="2.5"/><text x="667.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="667.0" dy="0">—</tspan></text><rect x="760" y="270" width="174" height="62" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="847.0" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="847.0" dy="0">web + DNS</tspan></text><rect x="40" y="345" width="920" height="90" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="60" y="375" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8a6d00" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Comment le réaliser ?</tspan></text><text x="60" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">• chaque service dans son propre VLAN et son propre sous-réseau ;</tspan></text><text x="60" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">• le routeur relie les services ; une ACL sur la patte « Invités » ne laisse passer que le web et le DNS vers le serveur.</tspan></text></svg>
