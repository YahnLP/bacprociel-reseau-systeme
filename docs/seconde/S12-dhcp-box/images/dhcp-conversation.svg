<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img"><title>La conversation DHCP</title><desc>Le PC demande une adresse, la box en propose une, le PC l'accepte, la box confirme et note le bail.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="470" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">DHCP : la box distribue les adresses, en 4 phrases</tspan></text><rect x="170" y="70" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="175" y="75" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="200" y1="110" x2="200" y2="120" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="182" y="118" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="200" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="200" dy="0">Nouveau PC</tspan></text><rect x="702" y="86" width="76" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><line x1="720" y1="86" x2="712" y2="70" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><line x1="760" y1="86" x2="768" y2="70" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="712" y="97" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="726" y="97" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="740" y="97" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="754" y="97" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><circle cx="770" cy="92" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="740" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="740" dy="0">Box (serveur DHCP)</tspan></text><line x1="200" y1="150" x2="200" y2="440" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="740" y1="150" x2="740" y2="440" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="210" y1="205" x2="730" y2="205" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="250" y="177" width="440" height="22" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="470" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">« Je suis nouveau : qui distribue des adresses ? »</tspan></text><circle cx="60" cy="205" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="60" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">1</tspan></text><text x="90" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="90" dy="0">demande</tspan></text><line x1="730" y1="267" x2="210" y2="267" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="250" y="239" width="440" height="22" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="470" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">« Moi ! Je te propose 192.168.1.10 pour 24 h. »</tspan></text><circle cx="60" cy="267" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="60" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">2</tspan></text><text x="90" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="90" dy="0">offre</tspan></text><line x1="210" y1="329" x2="730" y2="329" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="250" y="301" width="440" height="22" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="470" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">« Parfait, je prends 192.168.1.10. »</tspan></text><circle cx="60" cy="329" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="60" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">3</tspan></text><text x="90" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="90" dy="0">acceptation</tspan></text><line x1="730" y1="391" x2="210" y2="391" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="250" y="363" width="440" height="22" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text x="470" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">« C'est à toi (+ passerelle et DNS). »</tspan></text><circle cx="60" cy="391" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="60" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">4</tspan></text><text x="90" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="90" dy="0">confirmation</tspan></text></svg>
