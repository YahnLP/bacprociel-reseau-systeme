<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img"><title>La conversation DHCP</title><desc>Le PC demande une adresse, la box en propose une, le PC l'accepte, la box confirme et note le bail.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="520" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">DHCP : la box distribue les adresses, en 4 phrases</tspan></text><rect x="90" y="90" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="95" y="95" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="120" y1="130" x2="120" y2="140" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="102" y="138" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="120" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="120" dy="0">Nouveau PC</tspan></text><text x="120" y="182" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="120" dy="0">n'a pas d'adresse</tspan></text><rect x="782" y="106" width="76" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><line x1="800" y1="106" x2="792" y2="90" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><line x1="840" y1="106" x2="848" y2="90" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="792" y="117" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="806" y="117" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="820" y="117" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="834" y="117" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><circle cx="850" cy="112" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="820" y="153" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="820" dy="0">Box</tspan></text><text x="820" y="170" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">serveur DHCP</tspan></text><circle cx="60" cy="232" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="60" y="237" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">1</tspan></text><line x1="150" y1="232" x2="770" y2="232" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="200" y="192" width="540" height="30" rx="8" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><text x="470" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">« Je suis nouveau, y a-t-il quelqu'un qui distribue des adresses ? »</tspan></text><text x="470" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">demande (à tout le monde)</tspan></text><circle cx="880" cy="300" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="880" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="880" dy="0">2</tspan></text><line x1="770" y1="300" x2="150" y2="300" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="200" y="260" width="540" height="30" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/><text x="470" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">« Oui, moi ! Je te propose 192.168.1.10 pour 24 h. »</tspan></text><text x="470" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">offre</tspan></text><circle cx="60" cy="368" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="60" y="373" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">3</tspan></text><line x1="150" y1="368" x2="770" y2="368" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="200" y="328" width="540" height="30" rx="8" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><text x="470" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">« Parfait, je prends 192.168.1.10. »</tspan></text><text x="470" y="388" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">acceptation</tspan></text><circle cx="880" cy="436" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="880" y="441" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="880" dy="0">4</tspan></text><line x1="770" y1="436" x2="150" y2="436" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="200" y="396" width="540" height="30" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="2"/><text x="470" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">« C'est noté : l'adresse est à toi (+ passerelle et DNS). »</tspan></text><text x="470" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">confirmation</tspan></text></svg>
