<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img"><title>Le plan d'adresses d'une box</title><desc>Dans 192.168.1.0/24 : .1 la box, .2 à .9 réservées, .10 à .100 distribuées par le DHCP, .101 à .254 pour les équipements fixes.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="300" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Qui a quelle adresse ? Le plan d'adressage de la box</tspan></text><rect x="40" y="70" width="40" height="60" rx="4" fill="#eceff1" stroke="#5b6385" stroke-width="2.5"/><text x="60.0" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="60.0" dy="0">.0</tspan></text><rect x="80" y="70" width="40" height="60" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="100.0" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="100.0" dy="0">.1</tspan></text><rect x="120" y="70" width="90" height="60" rx="4" fill="#fffde7" stroke="#b28704" stroke-width="2.5"/><text x="165.0" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#b28704" text-anchor="middle" font-weight="700"><tspan x="165.0" dy="0">.2 – .9</tspan></text><rect x="210" y="70" width="330" height="60" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="375.0" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="375.0" dy="0">.10 – .100</tspan></text><rect x="540" y="70" width="300" height="60" rx="4" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="690.0" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="690.0" dy="0">.101 – .254</tspan></text><rect x="840" y="70" width="60" height="60" rx="4" fill="#eceff1" stroke="#5b6385" stroke-width="2.5"/><text x="870.0" y="107" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="870.0" dy="0">.255</tspan></text><text x="60" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">réseau</tspan></text><text x="100" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">box</tspan></text><text x="165" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="165" dy="0">postes fixes</tspan><tspan x="165" dy="15.6">spéciaux</tspan></text><text x="375" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="375" dy="0">DHCP : distribuées</tspan><tspan x="375" dy="15.6">automatiquement</tspan></text><text x="690" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="690" dy="0">serveurs, imprimantes,</tspan><tspan x="690" dy="15.6">adresses fixes</tspan></text><text x="870" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">diffusion</tspan></text><rect x="40" y="215" width="860" height="54.25" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="52" y="237.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">Règle d'or : une adresse fixe ne doit JAMAIS être dans la plage DHCP, sinon la box peut la donner à un autre</tspan><tspan x="52" dy="18.1">PC → doublon !</tspan></text></svg>
