<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img"><title>La passerelle par défaut</title><desc>Pour joindre une machine du même réseau, le PC l'atteint directement ; pour sortir du réseau, il envoie tout à la passerelle, la box.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="400" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">La passerelle = la porte de sortie du réseau</tspan></text><rect x="30" y="55" width="520" height="335" rx="16" fill="#e8eaf6" stroke="#3949ab" stroke-width="3" stroke-dasharray="8 6"/><text x="290" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="290" dy="0">Mon réseau local 192.168.1.0/24</tspan></text><rect x="80" y="140" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="85" y="145" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="110" y1="180" x2="110" y2="190" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="92" y="188" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="110" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="110" dy="0">PC1</tspan></text><text x="110" y="232" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="110" dy="0">192.168.1.10</tspan></text><rect x="80" y="280" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="85" y="285" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="110" y1="320" x2="110" y2="330" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="92" y="328" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="110" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="110" dy="0">PC2</tspan></text><text x="110" y="372" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="110" dy="0">192.168.1.11</tspan></text><rect x="392" y="206" width="76" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><line x1="410" y1="206" x2="402" y2="190" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="206" x2="458" y2="190" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="402" y="217" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="416" y="217" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="430" y="217" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="444" y="217" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><circle cx="460" cy="212" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="430" y="253" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="430" dy="0">Box</tspan></text><text x="430" y="270" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="430" dy="0">passerelle 192.168.1.1</tspan></text><line x1="200" y1="300" x2="200" y2="190" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="215" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="215" dy="0">même réseau : direct</tspan></text><line x1="170" y1="175" x2="375" y2="215" stroke="#ef6c00" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="270" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="270" dy="0">autre réseau : « à la passerelle »</tspan></text><path d="M720,234 a18,18 0 0 1 4,-35 a24,24 0 0 1 46,-6 a20,20 0 0 1 24,26 a14,14 0 0 1 -6,15 z" fill="#e8eaf6" stroke="#9fa8da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="760" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="760" dy="0">Internet</tspan></text><text x="760" y="272" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="760" dy="0">203.0.113.1, sites web…</tspan></text><line x1="480" y1="220" x2="685" y2="220" stroke="#3a4270" stroke-width="4" stroke-linecap="round"/><rect x="580" y="290" width="340" height="51.75" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="592" y="311.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="592" dy="0">Sans passerelle, un PC parle à son réseau…</tspan><tspan x="592" dy="16.9">mais jamais à Internet.</tspan></text></svg>
