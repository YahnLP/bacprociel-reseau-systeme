<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 220" width="940" height="220" role="img"><title>Le bail DHCP</title><desc>L'adresse est prêtée pour une durée limitée : le bail. Le poste la renouvelle avant la fin, sinon la box peut la reprendre.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="220" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Une adresse DHCP est PRÊTÉE (bail)</tspan></text><line x1="80" y1="130" x2="860" y2="130" stroke="#3a4270" stroke-width="6" stroke-linecap="round"/><circle cx="80" cy="130" r="13" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><text x="80" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="80" dy="0">obtenu</tspan><tspan x="80" dy="16.2">(08:00)</tspan></text><circle cx="470" cy="130" r="13" fill="#3949ab" stroke="#3949ab" stroke-width="2"/><text x="470" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">mi-bail :</tspan><tspan x="470" dy="16.2">le PC demande</tspan><tspan x="470" dy="16.2">à renouveler</tspan></text><circle cx="860" cy="130" r="13" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="860" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="860" dy="0">fin du bail</tspan><tspan x="860" dy="16.2">(le lendemain)</tspan></text><rect x="100" y="60" width="740" height="35.5" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="112" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="112" dy="0">ipconfig /release : je rends l'adresse - ipconfig /renew : j'en redemande une</tspan></text></svg>
