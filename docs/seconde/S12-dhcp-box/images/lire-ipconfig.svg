<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="940" height="440" role="img"><title>Lire ipconfig /all</title><desc>Chaque ligne de ipconfig /all : adresse IPv4, masque, passerelle par défaut, serveur DHCP, bail, serveur DNS.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="440" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Lire le résultat de « ipconfig /all »</tspan></text><rect x="30" y="55" width="520" height="360" rx="10" fill="#0b1220" stroke="#0b1220" stroke-width="1"/><text x="45" y="100" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#f9a825" text-anchor="start" font-weight="700"><tspan x="45" dy="0">DHCP activé . . . . . . . . : Oui</tspan></text><text x="45" y="142" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="45" dy="0">Adresse IPv4 . . . . . . . : 192.168.1.10</tspan></text><text x="45" y="184" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#9fa8da" text-anchor="start" font-weight="700"><tspan x="45" dy="0">Masque de sous-réseau . . : 255.255.255.0</tspan></text><text x="45" y="226" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="45" dy="0">Passerelle par défaut . . : 192.168.1.1</tspan></text><text x="45" y="268" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#f9a825" text-anchor="start" font-weight="700"><tspan x="45" dy="0">Serveur DHCP . . . . . . . : 192.168.1.1</tspan></text><text x="45" y="310" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#cfd8dc" text-anchor="start" font-weight="700"><tspan x="45" dy="0">Bail obtenu . . . . . . . . : 30 sept. 08:00</tspan></text><text x="45" y="352" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#cfd8dc" text-anchor="start" font-weight="700"><tspan x="45" dy="0">Bail expirant . . . . . . : 1er oct. 08:00</tspan></text><text x="45" y="394" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#80deea" text-anchor="start" font-weight="700"><tspan x="45" dy="0">Serveurs DNS . . . . . . . : 192.168.1.1</tspan></text><line x1="552" y1="95" x2="590" y2="95" stroke="#3a4270" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><text x="600" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="600" dy="0">Adresse donnée automatiquement ?</tspan></text><line x1="552" y1="137" x2="590" y2="137" stroke="#3a4270" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><text x="600" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="600" dy="0">MON adresse</tspan></text><line x1="552" y1="179" x2="590" y2="179" stroke="#3a4270" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><text x="600" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="600" dy="0">où coupe le réseau</tspan></text><line x1="552" y1="221" x2="590" y2="221" stroke="#3a4270" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><text x="600" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="600" dy="0">LA PORTE DE SORTIE</tspan></text><line x1="552" y1="263" x2="590" y2="263" stroke="#3a4270" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><text x="600" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="600" dy="0">qui m'a donné l'adresse</tspan></text><line x1="552" y1="305" x2="590" y2="305" stroke="#3a4270" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><text x="600" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="600" dy="0">début du prêt</tspan></text><line x1="552" y1="347" x2="590" y2="347" stroke="#3a4270" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><text x="600" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="600" dy="0">fin du prêt (il faut renouveler)</tspan></text><line x1="552" y1="389" x2="590" y2="389" stroke="#3a4270" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><text x="600" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="600" dy="0">qui traduit les noms (S13)</tspan></text></svg>
