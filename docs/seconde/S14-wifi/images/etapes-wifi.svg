<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="940" height="370" role="img"><title>Se connecter à un Wi-Fi</title><desc>Trois étapes : choisir le SSID, s'authentifier avec la clé, puis obtenir une adresse IP du DHCP.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="370" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Se connecter en Wi-Fi : 3 étapes</tspan></text><rect x="72" y="122" width="56" height="36" rx="4" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="77" y="127" width="46" height="26" rx="2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><polygon points="64,158 136,158 130,168 70,168" fill="#eceff1" stroke="#3949ab" stroke-width="2" stroke-linejoin="round"/><text x="100" y="187" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">Portable</tspan></text><rect x="440" y="132" width="60" height="14" rx="7" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><path d="M460,128 A10,10 0 0 1 480,128" fill="none" stroke="#00897b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M452,128 A18,18 0 0 1 488,128" fill="none" stroke="#00897b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M444,128 A26,26 0 0 1 496,128" fill="none" stroke="#00897b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="128" r="2.5" fill="#00897b" stroke="#00897b" stroke-width="1"/><text x="470" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">Borne Wi-Fi</tspan></text><text x="470" y="182" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">SSID : ATELIER-CIEL</tspan></text><rect x="792" y="136" width="76" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><line x1="810" y1="136" x2="802" y2="120" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><line x1="850" y1="136" x2="858" y2="120" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="802" y="147" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="816" y="147" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="830" y="147" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="844" y="147" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><circle cx="860" cy="142" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="830" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="830" dy="0">Box</tspan></text><text x="830" y="200" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">DHCP</tspan></text><rect x="40" y="215" width="260" height="70" rx="12" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><circle cx="58" cy="235" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="58" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="58" dy="0">1</tspan></text><text x="180" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">Je choisis le réseau</tspan></text><text x="180" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">(le SSID)</tspan></text><rect x="340" y="215" width="260" height="70" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><circle cx="358" cy="235" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="358" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="358" dy="0">2</tspan></text><text x="480" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="480" dy="0">Je donne la clé</tspan></text><text x="480" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="480" dy="0">(WPA2 / WPA3)</tspan></text><rect x="640" y="215" width="260" height="70" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="658" cy="235" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="658" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="658" dy="0">3</tspan></text><text x="780" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="780" dy="0">Je reçois une adresse</tspan></text><text x="780" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="780" dy="0">(DHCP, comme en S12)</tspan></text><line x1="155" y1="150" x2="410" y2="130" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="535" y1="130" x2="780" y2="150" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="40" y="305" width="860" height="35.5" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="52" y="327" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">Si l'étape 2 échoue (mauvaise clé), on n'a même PAS d'adresse IP : l'adressage vient après la connexion Wi-Fi.</tspan></text></svg>
