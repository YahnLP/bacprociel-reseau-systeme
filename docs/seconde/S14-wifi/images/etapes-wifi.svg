<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img"><title>Se connecter à un Wi-Fi</title><desc>Trois étapes : choisir le SSID annoncé par la borne, donner la clé, puis obtenir une adresse IP du DHCP de la box.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="520" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Se connecter en Wi-Fi : 3 étapes, dans l'ordre</tspan></text><rect x="65" y="50" width="170" height="54" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="150" y="73" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="150" dy="0">Portable</tspan></text><text x="150" y="94" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="150" dy="0"></tspan></text><line x1="150" y1="104" x2="150" y2="440" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="385" y="50" width="170" height="54" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="3"/><text x="470" y="73" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">Borne Wi-Fi</tspan></text><text x="470" y="94" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">SSID : ATELIER-CIEL</tspan></text><line x1="470" y1="104" x2="470" y2="440" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="705" y="50" width="170" height="54" rx="10" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="790" y="73" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="790" dy="0">Box (DHCP)</tspan></text><text x="790" y="94" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="790" dy="0">192.168.1.1</tspan></text><line x1="790" y1="104" x2="790" y2="440" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="462" y1="150" x2="158" y2="150" stroke="#00897b" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="310.0" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0">« Je suis le réseau ATELIER-CIEL »</tspan></text><text x="310.0" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0">« Je suis le réseau ATELIER-CIEL »</tspan></text><circle cx="40" cy="150" r="13" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="40" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">1</tspan></text><line x1="158" y1="210" x2="462" y2="210" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="310.0" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0">« Je veux me connecter, voici la clé »</tspan></text><text x="310.0" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0">« Je veux me connecter, voici la clé »</tspan></text><circle cx="40" cy="210" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="40" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">2</tspan></text><line x1="462" y1="270" x2="158" y2="270" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="310.0" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0">« Clé correcte : tu es connecté »</tspan></text><text x="310.0" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="310.0" dy="0">« Clé correcte : tu es connecté »</tspan></text><circle cx="40" cy="270" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="40" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">2</tspan></text><line x1="158" y1="330" x2="782" y2="330" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="470.0" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">« Quelle adresse pour moi ? » (via la borne)</tspan></text><text x="470.0" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">« Quelle adresse pour moi ? » (via la borne)</tspan></text><circle cx="40" cy="330" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="40" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">3</tspan></text><line x1="782" y1="390" x2="158" y2="390" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="470.0" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">« Prends 192.168.1.12 »</tspan></text><text x="470.0" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">« Prends 192.168.1.12 »</tspan></text><circle cx="40" cy="390" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="40" y="395" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">3</tspan></text><rect x="25" y="450" width="890" height="50" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="470" y="472" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">1 = je choisis le réseau (SSID) · 2 = je donne la clé · 3 = je reçois une adresse (DHCP, comme en S12)</tspan></text><text x="470" y="491" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">Si l'étape 2 échoue (mauvaise clé) : pas d'adresse IP, l'adressage vient après la connexion Wi-Fi.</tspan></text></svg>
