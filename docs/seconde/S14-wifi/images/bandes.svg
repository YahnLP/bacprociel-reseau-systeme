<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img"><title>Bandes 2,4 GHz et 5 GHz</title><desc>2,4 GHz porte plus loin mais est plus encombré et plus lent ; 5 GHz est plus rapide mais traverse moins bien les obstacles.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="340" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Deux bandes, deux compromis</tspan></text><rect x="30" y="60" width="420" height="210" rx="14" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><rect x="30" y="60" width="420" height="44" rx="14" fill="#ef6c00" stroke="#ef6c00" stroke-width="3"/><text x="240" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="240" dy="0">2,4 GHz</tspan></text><text x="48" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="48" dy="0">PORTÉE : longue (traverse mieux les murs)</tspan></text><text x="48" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="48" dy="0">DÉBIT : plus faible</tspan></text><text x="48" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="48" dy="0">ENCOMBREMENT : fort (voisins, micro-ondes, Bluetooth)</tspan></text><text x="48" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="48" dy="0">Canaux utiles : 1, 6, 11</tspan></text><rect x="490" y="60" width="420" height="210" rx="14" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><rect x="490" y="60" width="420" height="44" rx="14" fill="#3949ab" stroke="#3949ab" stroke-width="3"/><text x="700" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="700" dy="0">5 GHz</tspan></text><text x="508" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="508" dy="0">PORTÉE : plus courte</tspan></text><text x="508" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="508" dy="0">DÉBIT : plus élevé</tspan></text><text x="508" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="508" dy="0">ENCOMBREMENT : faible</tspan></text><text x="508" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="508" dy="0">Plus de canaux, moins de brouillage</tspan></text><rect x="30" y="285" width="880" height="36.125" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="42" y="307.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="42" dy="0">Pour un atelier : 5 GHz pour le travail (rapide) ; 2,4 GHz pour les objets connectés et les zones éloignées.</tspan></text></svg>
