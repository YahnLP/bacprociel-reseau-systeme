<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img"><title>Lire la force du signal</title><desc>Le signal se mesure en dBm : plus le nombre est proche de zéro, meilleur est le signal.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="300" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Force du signal (dBm) : plus c'est proche de 0, mieux c'est</tspan></text><rect x="30" y="70" width="172" height="120" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="116" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="116" dy="0">-30 à -50</tspan></text><text x="116" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="116" dy="0">Excellent</tspan></text><rect x="210" y="70" width="172" height="120" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="296" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="296" dy="0">-50 à -67</tspan></text><text x="296" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="296" dy="0">Très bon</tspan></text><rect x="390" y="70" width="172" height="120" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="3"/><text x="476" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#f9a825" text-anchor="middle" font-weight="700"><tspan x="476" dy="0">-67 à -70</tspan></text><text x="476" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="476" dy="0">Correct (limite)</tspan></text><rect x="570" y="70" width="172" height="120" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="656" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="656" dy="0">-70 à -80</tspan></text><text x="656" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="656" dy="0">Faible</tspan></text><rect x="750" y="70" width="172" height="120" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="836" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="836" dy="0">&lt; -80</tspan></text><text x="836" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="836" dy="0">Inutilisable</tspan></text><rect x="30" y="215" width="880" height="53.0" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="42" y="237" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="42" dy="0">Objectif en entreprise : au moins -67 dBm partout où l'on travaille. Les murs épais, le métal, l'eau et les miroirs</tspan><tspan x="42" dy="17.5">affaiblissent le signal.</tspan></text></svg>
