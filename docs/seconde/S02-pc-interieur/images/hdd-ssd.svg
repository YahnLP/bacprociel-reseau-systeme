<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img"><title>Disque dur (HDD) et SSD</title><desc>Comparaison HDD à plateaux mécaniques et SSD à mémoire flash.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="300" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Ranger les données : HDD ou SSD ?</tspan></text><rect x="30" y="60" width="400" height="220" rx="12" fill="#eceff1" stroke="#3a4270" stroke-width="3"/><circle cx="160" cy="165" r="80" fill="#ffffff" stroke="#3a4270" stroke-width="3"/><circle cx="160" cy="165" r="20" fill="#eceff1" stroke="#3a4270" stroke-width="3"/><path d="M160,165 L260,95" fill="none" stroke="#ef6c00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="95" r="8" fill="#ef6c00" stroke="#ef6c00" stroke-width="1"/><text x="330" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="330" dy="0">HDD</tspan></text><text x="330" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="330" dy="0">plateau qui tourne</tspan><tspan x="330" dy="17.5">+ tête de lecture</tspan></text><text x="330" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="330" dy="0">lent · fragile aux chocs</tspan><tspan x="330" dy="17.5">bruyant · pas cher au Go</tspan></text><rect x="470" y="60" width="400" height="220" rx="12" fill="#ede7f6" stroke="#5e35b1" stroke-width="3"/><rect x="500" y="100" width="180" height="120" rx="6" fill="#ffffff" stroke="#5e35b1" stroke-width="2.5"/><rect x="515" y="125" width="30" height="70" rx="3" fill="#b39ddb" stroke="#5e35b1" stroke-width="1.5"/><rect x="555" y="125" width="30" height="70" rx="3" fill="#b39ddb" stroke="#5e35b1" stroke-width="1.5"/><rect x="595" y="125" width="30" height="70" rx="3" fill="#b39ddb" stroke="#5e35b1" stroke-width="1.5"/><rect x="635" y="125" width="30" height="70" rx="3" fill="#b39ddb" stroke="#5e35b1" stroke-width="1.5"/><text x="780" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#5e35b1" text-anchor="middle" font-weight="700"><tspan x="780" dy="0">SSD</tspan></text><text x="780" y="145" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="780" dy="0">puces mémoire</tspan><tspan x="780" dy="17.5">(aucune pièce mobile)</tspan></text><text x="780" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="780" dy="0">rapide · silencieux</tspan><tspan x="780" dy="17.5">résiste aux chocs</tspan></text></svg>
