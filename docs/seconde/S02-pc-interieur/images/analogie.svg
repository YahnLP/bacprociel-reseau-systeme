<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"><title>Le PC par analogie</title><desc>Processeur = cerveau, RAM = bureau, stockage = armoire, alimentation = cœur, carte mère = système nerveux.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="330" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Un PC, c'est un peu comme toi</tspan></text><rect x="15" y="60" width="165" height="240" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="97" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="97" dy="0">Processeur</tspan></text><text x="97" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="97" dy="0">le CERVEAU</tspan></text><text x="97" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="97" dy="0">réfléchit, calcule</tspan></text><rect x="192" y="60" width="165" height="240" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="274" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="274" dy="0">RAM</tspan></text><text x="274" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="274" dy="0">le BUREAU</tspan></text><text x="274" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="274" dy="0">ce que j'utilise</tspan><tspan x="274" dy="17.5">maintenant</tspan><tspan x="274" dy="17.5">(vidé quand</tspan><tspan x="274" dy="17.5">j'éteins)</tspan></text><rect x="369" y="60" width="165" height="240" rx="14" fill="#ede7f6" stroke="#5e35b1" stroke-width="3"/><text x="451" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#5e35b1" text-anchor="middle" font-weight="700"><tspan x="451" dy="0">SSD / HDD</tspan></text><text x="451" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="451" dy="0">l'ARMOIRE</tspan></text><text x="451" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="451" dy="0">tout ce que</tspan><tspan x="451" dy="17.5">je garde</tspan><tspan x="451" dy="17.5">(même éteint)</tspan></text><rect x="546" y="60" width="165" height="240" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="628" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="628" dy="0">Alimentation</tspan></text><text x="628" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="628" dy="0">le CŒUR</tspan></text><text x="628" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="628" dy="0">distribue le</tspan><tspan x="628" dy="17.5">courant à tous</tspan><tspan x="628" dy="17.5">les organes</tspan></text><rect x="723" y="60" width="165" height="240" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="805" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="805" dy="0">Carte mère</tspan></text><text x="805" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="805" dy="0">le SYSTÈME</tspan><tspan x="805" dy="21.2">NERVEUX</tspan></text><text x="805" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="805" dy="0">relie tout</tspan><tspan x="805" dy="17.5">le monde</tspan></text></svg>
