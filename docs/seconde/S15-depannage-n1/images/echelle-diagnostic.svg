<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img"><title>L'échelle du diagnostic</title><desc>Cinq tests dans l'ordre : câble, adresse IP, ping de la passerelle, ping d'Internet par IP, ping d'un nom. Le premier test qui échoue indique la panne.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="980" height="640" fill="#ffffff" rx="10"/><text x="490.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0">L'échelle du diagnostic : on monte marche par marche</tspan></text><text x="215" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="215" dy="0">Je teste…</tspan></text><text x="560" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">Avec quoi ?</tspan></text><text x="840" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="840" dy="0">Si ça ÉCHOUE, la panne est…</tspan></text><rect x="40" y="82" width="350" height="86" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="72" cy="125.0" r="17" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="72" y="130.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="72" dy="0">1</tspan></text><text x="105" y="131.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="105" dy="0">Le câble, les voyants</tspan></text><rect x="410" y="82" width="300" height="86" rx="12" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><text x="560" y="131.0" font-family="Consolas, Menlo, monospace" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">regarder la prise et les LED</tspan></text><rect x="730" y="82" width="215" height="86" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="837" y="123.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="837" dy="0">le câble ou le port</tspan></text><line x1="215" y1="168" x2="215" y2="187" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="240" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="240" dy="0">OK ? → marche suivante</tspan></text><rect x="40" y="190" width="350" height="86" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="72" cy="233.0" r="17" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="72" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="72" dy="0">2</tspan></text><text x="105" y="239.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="105" dy="0">Mon adresse IP</tspan></text><rect x="410" y="190" width="300" height="86" rx="12" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><text x="560" y="239.0" font-family="Consolas, Menlo, monospace" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">ipconfig</tspan></text><rect x="730" y="190" width="215" height="86" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="837" y="231.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="837" dy="0">l'adresse (DHCP absent ?</tspan><tspan x="837" dy="17.5">IP fausse ?)</tspan></text><line x1="215" y1="276" x2="215" y2="295" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="240" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="240" dy="0">OK ? → marche suivante</tspan></text><rect x="40" y="298" width="350" height="86" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/><circle cx="72" cy="341.0" r="17" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="72" y="346.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="72" dy="0">3</tspan></text><text x="105" y="347.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="105" dy="0">La passerelle (la box)</tspan></text><rect x="410" y="298" width="300" height="86" rx="12" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><text x="560" y="347.0" font-family="Consolas, Menlo, monospace" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">ping 192.168.1.1</tspan></text><rect x="730" y="298" width="215" height="86" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="837" y="339.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="837" dy="0">la liaison locale ou la</tspan><tspan x="837" dy="17.5">passerelle</tspan></text><line x1="215" y1="384" x2="215" y2="403" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="240" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="240" dy="0">OK ? → marche suivante</tspan></text><rect x="40" y="406" width="350" height="86" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><circle cx="72" cy="449.0" r="17" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="72" y="454.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="72" dy="0">4</tspan></text><text x="105" y="455.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="105" dy="0">Internet, par une adresse</tspan></text><rect x="410" y="406" width="300" height="86" rx="12" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><text x="560" y="455.0" font-family="Consolas, Menlo, monospace" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">ping 203.0.113.1</tspan></text><rect x="730" y="406" width="215" height="86" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="837" y="447.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="837" dy="0">la route vers Internet</tspan></text><line x1="215" y1="492" x2="215" y2="511" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="240" y="508" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="240" dy="0">OK ? → marche suivante</tspan></text><rect x="40" y="514" width="350" height="86" rx="12" fill="#fffde7" stroke="#b28704" stroke-width="2.5"/><circle cx="72" cy="557.0" r="17" fill="#b28704" stroke="#ffffff" stroke-width="2"/><text x="72" y="562.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="72" dy="0">5</tspan></text><text x="105" y="563.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="105" dy="0">Internet, par un nom</tspan></text><rect x="410" y="514" width="300" height="86" rx="12" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><text x="560" y="563.0" font-family="Consolas, Menlo, monospace" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">ping www.exemple.fr</tspan></text><rect x="730" y="514" width="215" height="86" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="837" y="555.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="837" dy="0">le DNS</tspan></text></svg>
