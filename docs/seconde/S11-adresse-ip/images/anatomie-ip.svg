<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img"><title>Anatomie d'une adresse IPv4</title><desc>192.168.1.11 : quatre octets séparés par des points ; les trois premiers désignent le réseau, le dernier la machine, avec le masque 255.255.255.0.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="330" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Une adresse IPv4 : 4 nombres de 0 à 255</tspan></text><rect x="40" y="70" width="140" height="80" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3.5"/><text x="110" y="125" font-family="Consolas, Menlo, monospace" font-size="44" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="110" dy="0">192</tspan></text><circle cx="205" cy="138" r="6" fill="#1f2544" stroke="#1f2544" stroke-width="1"/><rect x="230" y="70" width="140" height="80" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3.5"/><text x="300" y="125" font-family="Consolas, Menlo, monospace" font-size="44" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="300" dy="0">168</tspan></text><circle cx="395" cy="138" r="6" fill="#1f2544" stroke="#1f2544" stroke-width="1"/><rect x="420" y="70" width="140" height="80" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3.5"/><text x="490" y="125" font-family="Consolas, Menlo, monospace" font-size="44" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490" dy="0">1</tspan></text><circle cx="585" cy="138" r="6" fill="#1f2544" stroke="#1f2544" stroke-width="1"/><rect x="610" y="70" width="140" height="80" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.5"/><text x="680" y="125" font-family="Consolas, Menlo, monospace" font-size="44" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="680" dy="0">11</tspan></text><line x1="40" y1="175" x2="565" y2="175" stroke="#3949ab" stroke-width="5" stroke-linecap="round"/><text x="302" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="302" dy="0">RÉSEAU : « le nom de la rue »</tspan></text><line x1="615" y1="175" x2="745" y2="175" stroke="#ef6c00" stroke-width="5" stroke-linecap="round"/><text x="680" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="680" dy="0">MACHINE : « le n° »</tspan></text><rect x="40" y="235" width="860" height="70" rx="10" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><text x="60" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Masque : </tspan></text><text x="155" y="262" font-family="Consolas, Menlo, monospace" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="155" dy="0">255.255.255.0</tspan></text><text x="60" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Il dit : « les 3 premiers nombres = le réseau, le dernier = la machine ». On l'écrit aussi /24 (24 interrupteurs allumés).</tspan></text></svg>
