<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 270" width="940" height="270" role="img"><title>Les adresses d'un réseau /24</title><desc>De 192.168.1.0 à 192.168.1.255 : .0 est l'adresse du réseau, .1 à .254 sont utilisables, .255 est l'adresse de diffusion.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="270" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">192.168.1.0 /24 : 256 adresses, dont 254 pour les machines</tspan></text><rect x="40" y="70" width="70" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="2.5"/><text x="75" y="107" font-family="Consolas, Menlo, monospace" font-size="24" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="75" dy="0">.0</tspan></text><rect x="110" y="70" width="720" height="60" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="470" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">.1 à .254 : adresses utilisables (254)</tspan></text><rect x="830" y="70" width="70" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="2.5"/><text x="865" y="107" font-family="Consolas, Menlo, monospace" font-size="22" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="865" dy="0">.255</tspan></text><text x="75" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="75" dy="0">adresse du</tspan><tspan x="75" dy="16.9">RÉSEAU</tspan></text><text x="865" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="865" dy="0">adresse de</tspan><tspan x="865" dy="16.9">DIFFUSION</tspan></text><text x="75" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="75" dy="0">le nom de la rue :</tspan><tspan x="75" dy="15.6">on ne l'attribue</tspan><tspan x="75" dy="15.6">jamais à une machine</tspan></text><text x="865" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="865" dy="0">le « haut-parleur » :</tspan><tspan x="865" dy="15.6">tout le monde l'entend</tspan><tspan x="865" dy="15.6">(jamais à une machine)</tspan></text><rect x="160" y="160" width="600" height="54.25" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><text x="172" y="182.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="172" dy="0">Habitude de technicien : .1 = la passerelle (box / routeur), .10 à .99 =</tspan><tspan x="172" dy="18.1">postes, .100 et + = serveurs et imprimantes. Il faut un plan d'adressage !</tspan></text></svg>
