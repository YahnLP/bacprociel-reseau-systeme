<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img"><title>Que dit le ping quand ça ne va pas ?</title><desc>Trois messages différents : échec général (mauvais réseau ou pas d'adresse), délai dépassé (pas de réponse), hôte inaccessible.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="340" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Le message de ping est un indice</tspan></text><rect x="15" y="60" width="296" height="255" rx="12" fill="#ffffff" stroke="#c62828" stroke-width="3"/><rect x="25" y="70" width="276" height="70" rx="6" fill="#1e1e2e" stroke="#1e1e2e" stroke-width="1"/><text x="33" y="98" font-family="Consolas, Menlo, monospace" font-size="1" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="33" dy="0"></tspan></text><text x="163" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#a6e3a1" text-anchor="middle" font-weight="700"><tspan x="163" dy="0">PING : échec général.</tspan></text><text x="163" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="163" dy="0">Ça veut dire :</tspan></text><text x="163" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="163" dy="0">Ma machine ne sait même pas où envoyer</tspan><tspan x="163" dy="16.2">le paquet.</tspan></text><text x="163" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="163" dy="0">Pistes :</tspan></text><text x="163" y="265" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="163" dy="0">Mon adresse est vide ou dans un autre</tspan><tspan x="163" dy="15.6">réseau (faute de frappe, mauvais</tspan><tspan x="163" dy="15.6">masque).</tspan></text><rect x="323" y="60" width="296" height="255" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><rect x="333" y="70" width="276" height="70" rx="6" fill="#1e1e2e" stroke="#1e1e2e" stroke-width="1"/><text x="341" y="98" font-family="Consolas, Menlo, monospace" font-size="1" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="341" dy="0"></tspan></text><text x="471" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#a6e3a1" text-anchor="middle" font-weight="700"><tspan x="471" dy="0">Délai d'attente de la demande</tspan><tspan x="471" dy="16.2">dépassé.</tspan></text><text x="471" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="471" dy="0">Ça veut dire :</tspan></text><text x="471" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="471" dy="0">Le paquet est parti, mais aucune</tspan><tspan x="471" dy="16.2">réponse ne revient.</tspan></text><text x="471" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="471" dy="0">Pistes :</tspan></text><text x="471" y="265" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="471" dy="0">L'autre machine est éteinte, a un</tspan><tspan x="471" dy="15.6">mauvais masque, ou son pare-feu bloque</tspan><tspan x="471" dy="15.6">le ping.</tspan></text><rect x="631" y="60" width="296" height="255" rx="12" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><rect x="641" y="70" width="276" height="70" rx="6" fill="#1e1e2e" stroke="#1e1e2e" stroke-width="1"/><text x="649" y="98" font-family="Consolas, Menlo, monospace" font-size="1" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="649" dy="0"></tspan></text><text x="779" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#a6e3a1" text-anchor="middle" font-weight="700"><tspan x="779" dy="0">Impossible de joindre l'hôte de</tspan><tspan x="779" dy="16.2">destination.</tspan></text><text x="779" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="779" dy="0">Ça veut dire :</tspan></text><text x="779" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="779" dy="0">Une machine (souvent la mienne ou une</tspan><tspan x="779" dy="16.2">passerelle) dit « je ne trouve personne</tspan><tspan x="779" dy="16.2">».</tspan></text><text x="779" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="779" dy="0">Pistes :</tspan></text><text x="779" y="265" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="779" dy="0">Adresse qui n'existe pas dans le réseau,</tspan><tspan x="779" dy="15.6">ou doublon d'adresse.</tspan></text></svg>
