<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img"><title>Adresses privées et publiques</title><desc>Les adresses 192.168.x.x, 10.x.x.x et 172.16 à 172.31 sont privées : utilisées dans les réseaux locaux, non routées sur Internet.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="300" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Adresses privées / publiques</tspan></text><rect x="30" y="60" width="560" height="200" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="310" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="310" dy="0">PRIVÉES : réseaux locaux</tspan></text><text x="60" y="130" font-family="Consolas, Menlo, monospace" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="60" dy="0">192.168.0.0  à  192.168.255.255</tspan></text><text x="60" y="168" font-family="Consolas, Menlo, monospace" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="60" dy="0">10.0.0.0  à  10.255.255.255</tspan></text><text x="60" y="206" font-family="Consolas, Menlo, monospace" font-size="17" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="60" dy="0">172.16.0.0  à  172.31.255.255</tspan></text><text x="310" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="310" dy="0">Utilisées chez toi, en classe, en entreprise. Réutilisables partout.</tspan></text><rect x="620" y="60" width="290" height="200" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="765" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="765" dy="0">PUBLIQUES</tspan></text><text x="765" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="765" dy="0">Toutes les autres.</tspan><tspan x="765" dy="18.1">Uniques au monde.</tspan><tspan x="765" dy="18.1">Attribuées par</tspan><tspan x="765" dy="18.1">l'opérateur (FAI).</tspan></text></svg>
