<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" role="img"><title>Réseau = rue, machine = numéro</title><desc>Analogie : toutes les maisons d'une même rue partagent le nom de la rue et ont un numéro différent.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="320" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">L'analogie de la rue</tspan></text><rect x="30" y="140" width="880" height="40" rx="6" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/><text x="470" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">RUE 192.168.1  (le réseau)</tspan></text><polygon points="70,120 110,70 150,120" fill="#ef6c00" stroke="#ef6c00" stroke-width="2" stroke-linejoin="round"/><rect x="78" y="120" width="64" height="20" rx="1" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="110" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="110" dy="0"></tspan></text><text x="110" y="215" font-family="Consolas, Menlo, monospace" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="110" dy="0">192.168.1.1</tspan></text><text x="110" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="110" dy="0">box (passerelle)</tspan></text><polygon points="240,120 280,70 320,120" fill="#3949ab" stroke="#3949ab" stroke-width="2" stroke-linejoin="round"/><rect x="248" y="120" width="64" height="20" rx="1" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="280" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="280" dy="0"></tspan></text><text x="280" y="215" font-family="Consolas, Menlo, monospace" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="280" dy="0">192.168.1.11</tspan></text><text x="280" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="280" dy="0">PC 1</tspan></text><polygon points="410,120 450,70 490,120" fill="#3949ab" stroke="#3949ab" stroke-width="2" stroke-linejoin="round"/><rect x="418" y="120" width="64" height="20" rx="1" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="450" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="450" dy="0"></tspan></text><text x="450" y="215" font-family="Consolas, Menlo, monospace" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450" dy="0">192.168.1.12</tspan></text><text x="450" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="450" dy="0">PC 2</tspan></text><polygon points="580,120 620,70 660,120" fill="#3949ab" stroke="#3949ab" stroke-width="2" stroke-linejoin="round"/><rect x="588" y="120" width="64" height="20" rx="1" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="620" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="620" dy="0"></tspan></text><text x="620" y="215" font-family="Consolas, Menlo, monospace" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="620" dy="0">192.168.1.13</tspan></text><text x="620" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="620" dy="0">PC 3</tspan></text><polygon points="750,120 790,70 830,120" fill="#3949ab" stroke="#3949ab" stroke-width="2" stroke-linejoin="round"/><rect x="758" y="120" width="64" height="20" rx="1" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="790" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="790" dy="0"></tspan></text><text x="790" y="215" font-family="Consolas, Menlo, monospace" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="790" dy="0">192.168.1.14</tspan></text><text x="790" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="790" dy="0">PC 4</tspan></text><rect x="30" y="262" width="880" height="55.5" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="42" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="42" dy="0">Même rue (même réseau) = on peut se parler directement. Une autre rue = il faut passer par la passerelle</tspan><tspan x="42" dy="18.8">(la box).</tspan></text></svg>
