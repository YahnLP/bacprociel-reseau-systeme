<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img"><title>Plan du local de l'atelier</title><desc>Pièce de 10 m sur 6 m : quatre postes le long du mur nord, une imprimante, un coin technique avec la box et le switch près de la porte.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="980" height="640" fill="#ffffff" rx="10"/><text x="490.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0">Plan du local (10 m × 6 m) – 1 carreau = 1 m</tspan></text><rect x="70" y="70" width="820" height="492" rx="4" fill="#fafbff" stroke="#3a4270" stroke-width="4"/><line x1="152" y1="70" x2="152" y2="562" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="234" y1="70" x2="234" y2="562" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="316" y1="70" x2="316" y2="562" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="398" y1="70" x2="398" y2="562" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="480" y1="70" x2="480" y2="562" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="562" y1="70" x2="562" y2="562" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="644" y1="70" x2="644" y2="562" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="726" y1="70" x2="726" y2="562" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="808" y1="70" x2="808" y2="562" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="70" y1="152" x2="890" y2="152" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="70" y1="234" x2="890" y2="234" stroke="#e3e6f3" stroke-width="1" stroke-linecap="round"/><line x1="70" y1="316" x2="890" y2="316" stroke="#e3e6f3"