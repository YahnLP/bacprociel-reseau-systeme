<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img"><title>Dossier partagé : qui a le droit de quoi</title><desc>Trois comptes : direction (modifier), atelier (lire), invité (aucun accès). Les droits les plus restrictifs l'emportent entre partage et sécurité.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="420" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Un dossier partagé, trois niveaux d'accès</tspan></text><rect x="330" y="70" width="280" height="80" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="470" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">Dossier « Commandes »</tspan></text><text x="470" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">sur le poste 1</tspan></text><rect x="40" y="250" width="240" height="120" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="160" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="160" dy="0">Compte « direction »</tspan></text><text x="160" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="160" dy="0">Modifier</tspan></text><text x="160" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="160" dy="0">lire, créer, supprimer</tspan></text><line x1="470" y1="150" x2="160" y2="248" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/><rect x="350" y="250" width="240" height="120" rx="12" fill="#fffde7" stroke="#b28704" stroke-width="3"/><text x="470" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">Compte « atelier »</tspan></text><text x="470" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#b28704" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">Lire seulement</tspan></text><text x="470" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="470" dy="0">ouvrir, copier</tspan></text><line x1="470" y1="150" x2="470" y2="248" stroke="#b28704" stroke-width="3" stroke-linecap="round"/><rect x="660" y="250" width="240" height="120" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="780" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="780" dy="0">Visiteur / invité</tspan></text><text x="780" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="780" dy="0">Aucun accès</tspan></text><text x="780" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="780" dy="0">dossier invisible</tspan></text><line x1="470" y1="150" x2="780" y2="248" stroke="#c62828" stroke-width="3" stroke-linecap="round"/></svg>
