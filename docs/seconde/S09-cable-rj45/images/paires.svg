, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="582" dy="0">Pourquoi torsader ? Les perturbations</tspan><tspan x="582" dy="18.1">(moteurs, néons, câbles voisins)</tspan><tspan x="582" dy="18.1">agissent des deux côtés de la paire :</tspan><tspan x="582" dy="18.1">elles s'annulent. Plus de torsades =</tspan><tspan x="582" dy="18.1">moins de parasites.</tspan></text><rect x="570" y="205" width="310" height="90.5" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><text x="582" y="227.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="582" dy="0">4 paires = 8 fils : orange, verte,</tspan><tspan x="582" dy="18.1">bleue, marron. Chaque paire = un fil</tspan><tspan x="582" dy="18.1">de couleur + un fil blanc rayé de</tspan><tspan x="582" dy="18.1">cette couleur.</tspan></text></svg>
