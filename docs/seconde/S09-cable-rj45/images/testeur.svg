<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img"><title>Résultats d'un testeur de câble</title><desc>Le testeur allume les voyants 1 à 8 en séquence : câble correct, coupure, inversion, court-circuit.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="340" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Lire les voyants du testeur</tspan></text><rect x="15" y="60" width="210" height="260" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><text x="120" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="120" dy="0">Câble OK</tspan></text><circle cx="40" cy="125" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><text x="40" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">1</tspan></text><circle cx="63" cy="125" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><text x="63" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="63" dy="0">2</tspan></text><circle cx="86" cy="125" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><text x="86" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="86" dy="0">3</tspan></text><circle cx="109" cy="125" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><text x="109" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="109" dy="0">4</tspan></text><circle cx="132" cy="125" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><text x="132" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="132" dy="0">5</tspan></text><circle cx="155" cy="125" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><text x="155" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="155" dy="0">6</tspan></text><circle cx="178" cy="125" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><text x="178" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="178" dy="0">7</tspan></text><circle cx="201" cy="125" r="9" fill="#2e7d32" stroke="#2e7d32" stroke-width="2"/><text x="201" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="201" dy="0">8</tspan></text><text x="120" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="120" dy="0">1 2 3 4 5 6 7 8 s'allument</tspan><tspan x="120" dy="16.9">dans l'ordre aux deux</tspan><tspan x="120" dy="16.9">bouts</tspan></text><text x="120" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="120" dy="0">→ on peut l'utiliser</tspan></text><rect x="237" y="60" width="210" height="260" rx="12" fill="#ffffff" stroke="#c62828" stroke-width="3"/><text x="342" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="342" dy="0">Coupure</tspan></text><circle cx="262" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="262" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="262" dy="0">1</tspan></text><circle cx="285" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="285" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="285" dy="0">2</tspan></text><circle cx="308" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="308" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="308" dy="0">3</tspan></text><circle cx="331" cy="125" r="9" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/><text x="331" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="331" dy="0">4</tspan></text><circle cx="354" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="354" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="354" dy="0">5</tspan></text><circle cx="377" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="377" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="377" dy="0">6</tspan></text><circle cx="400" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="400" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="400" dy="0">7</tspan></text><circle cx="423" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="423" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="423" dy="0">8</tspan></text><text x="342" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="342" dy="0">un voyant ne s'allume pas</tspan><tspan x="342" dy="16.9">(ex. : le 4)</tspan></text><text x="342" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="342" dy="0">→ on sertit à nouveau</tspan></text><rect x="459" y="60" width="210" height="260" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="564" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="564" dy="0">Inversion</tspan></text><circle cx="484" cy="125" r="9" fill="#ef6c00" stroke="#ef6c00" stroke-width="2"/><text x="484" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="484" dy="0">1</tspan></text><circle cx="507" cy="125" r="9" fill="#ef6c00" stroke="#ef6c00" stroke-width="2"/><text x="507" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="507" dy="0">2</tspan></text><circle cx="530" cy="125" r="9" fill="#ef6c00" stroke="#ef6c00" stroke-width="2"/><text x="530" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="530" dy="0">3</tspan></text><circle cx="553" cy="125" r="9" fill="#ef6c00" stroke="#ef6c00" stroke-width="2"/><text x="553" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="553" dy="0">4</tspan></text><circle cx="576" cy="125" r="9" fill="#ef6c00" stroke="#ef6c00" stroke-width="2"/><text x="576" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="576" dy="0">5</tspan></text><circle cx="599" cy="125" r="9" fill="#ef6c00" stroke="#ef6c00" stroke-width="2"/><text x="599" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="599" dy="0">6</tspan></text><circle cx="622" cy="125" r="9" fill="#ef6c00" stroke="#ef6c00" stroke-width="2"/><text x="622" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="622" dy="0">7</tspan></text><circle cx="645" cy="125" r="9" fill="#ef6c00" stroke="#ef6c00" stroke-width="2"/><text x="645" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="645" dy="0">8</tspan></text><text x="564" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="564" dy="0">les voyants s'allument</tspan><tspan x="564" dy="16.9">dans le désordre (ex. : 1</tspan><tspan x="564" dy="16.9">3 2 4…)</tspan></text><text x="564" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="564" dy="0">→ on sertit à nouveau</tspan></text><rect x="681" y="60" width="210" height="260" rx="12" fill="#ffffff" stroke="#c62828" stroke-width="3"/><text x="786" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="786" dy="0">Court-circuit</tspan></text><circle cx="706" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="706" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="706" dy="0">1</tspan></text><circle cx="729" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="729" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="729" dy="0">2</tspan></text><circle cx="752" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="752" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="752" dy="0">3</tspan></text><circle cx="775" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="775" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="775" dy="0">4</tspan></text><circle cx="798" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="798" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="798" dy="0">5</tspan></text><circle cx="821" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="821" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="821" dy="0">6</tspan></text><circle cx="844" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="844" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="844" dy="0">7</tspan></text><circle cx="867" cy="125" r="9" fill="#c62828" stroke="#c62828" stroke-width="2"/><text x="867" y="129" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="867" dy="0">8</tspan></text><text x="786" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="786" dy="0">deux voyants s'allument</tspan><tspan x="786" dy="16.9">en même temps</tspan></text><text x="786" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="786" dy="0">→ on sertit à nouveau</tspan></text></svg>
