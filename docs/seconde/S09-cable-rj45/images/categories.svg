<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img"><title>Catégories de câbles</title><desc>Cat5e, Cat6 et Cat6A : débit, fréquence, distance maximale de 100 mètres.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="310" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Catégories : de quoi parle-t-on ?</tspan></text><rect x="30" y="55" width="840" height="36" rx="4" fill="#3949ab" stroke="#3949ab" stroke-width="2"/><text x="40" y="79" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Catégorie</tspan></text><text x="220" y="79" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="220" dy="0">Débit usuel</tspan></text><text x="520" y="79" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="520" dy="0">Fréquence</tspan></text><text x="700" y="79" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="700" dy="0">Longueur max.</tspan></text><rect x="30" y="91" width="840" height="42" rx="0" fill="#e8eaf6" stroke="#90a4ae" stroke-width="1"/><text x="40" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Cat 5e</tspan></text><text x="220" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="220" dy="0">1 Gb/s</tspan></text><text x="520" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="520" dy="0">100 MHz</tspan></text><text x="700" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="700" dy="0">100 m</tspan></text><rect x="30" y="133" width="840" height="42" rx="0" fill="#ffffff" stroke="#90a4ae" stroke-width="1"/><text x="40" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Cat 6</tspan></text><text x="220" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="220" dy="0">1 Gb/s (10 Gb/s ≤ 55 m)</tspan></text><text x="520" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="520" dy="0">250 MHz</tspan></text><text x="700" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="700" dy="0">100 m</tspan></text><rect x="30" y="175" width="840" height="42" rx="0" fill="#e8eaf6" stroke="#90a4ae" stroke-width="1"/><text x="40" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Cat 6A</tspan></text><text x="220" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="220" dy="0">10 Gb/s</tspan></text><text x="520" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="520" dy="0">500 MHz</tspan></text><text x="700" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="700" dy="0">100 m</tspan></text><rect x="30" y="235" width="840" height="54.25" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="42" y="257.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="42" dy="0">Longueur maximale d'une liaison Ethernet sur cuivre : 100 m (90 m de câble dans le mur + 10 m de cordons).</tspan><tspan x="42" dy="18.1">Au-delà : un switch ou de la fibre.</tspan></text></svg>
