<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" width="940" height="300" role="img"><title>Sertir un RJ45 en 6 gestes</title><desc>Dénuder, démêler, ordonner et aplatir, couper droit, insérer, sertir.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="300" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Sertir un connecteur RJ45 : 6 gestes</tspan></text><rect x="12" y="60" width="145" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="84" cy="60" r="15" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="84" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="84" dy="0">1</tspan></text><text x="84" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="84" dy="0">Dénuder</tspan></text><text x="84" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="84" dy="0">enlever ~3 cm</tspan><tspan x="84" dy="16.2">de gaine</tspan><tspan x="84" dy="16.2">(sans entailler</tspan><tspan x="84" dy="16.2">les fils)</tspan></text><rect x="167" y="60" width="145" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="239" cy="60" r="15" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="239" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="239" dy="0">2</tspan></text><text x="239" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="239" dy="0">Démêler</tspan></text><text x="239" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="239" dy="0">séparer les</tspan><tspan x="239" dy="16.2">4 paires, les</tspan><tspan x="239" dy="16.2">détordre</tspan></text><rect x="322" y="60" width="145" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="394" cy="60" r="15" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="394" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="394" dy="0">3</tspan></text><text x="394" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="394" dy="0">Ordonner</tspan></text><text x="394" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="394" dy="0">mettre dans l'ordre</tspan><tspan x="394" dy="16.2">T568B, bien</tspan><tspan x="394" dy="16.2">aplatis, côte à côte</tspan></text><rect x="477" y="60" width="145" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="549" cy="60" r="15" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="549" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="549" dy="0">4</tspan></text><text x="549" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="549" dy="0">Couper</tspan></text><text x="549" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="549" dy="0">couper droit, il</tspan><tspan x="549" dy="16.2">reste ~1,2 cm</tspan><tspan x="549" dy="16.2">de fils</tspan></text><rect x="632" y="60" width="145" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="704" cy="60" r="15" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="704" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="704" dy="0">5</tspan></text><text x="704" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="704" dy="0">Insérer</tspan></text><text x="704" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="704" dy="0">pousser jusqu'au</tspan><tspan x="704" dy="16.2">fond : on voit le</tspan><tspan x="704" dy="16.2">cuivre au bout</tspan></text><rect x="787" y="60" width="145" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="859" cy="60" r="15" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="859" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="859" dy="0">6</tspan></text><text x="859" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="859" dy="0">Sertir</tspan></text><text x="859" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="859" dy="0">serrer la pince</tspan><tspan x="859" dy="16.2">à fond (clic)</tspan><tspan x="859" dy="16.2">puis tester</tspan></text><rect x="12" y="228" width="915" height="36.125" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="24" y="250.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="24" dy="0">Sécurité : on coupe loin du corps, on garde les doigts hors de la lame, on jette les chutes dans la poubelle.</tspan></text></svg>
