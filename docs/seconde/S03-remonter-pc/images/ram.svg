<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"><title>RAM : sens d'insertion</title><desc>Une barrette de RAM possède un ergot décalé qui empêche de l'inverser ; on la pousse jusqu'au clic des deux clips.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="330" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Insérer une barrette de RAM</tspan></text><rect x="60" y="190" width="400" height="30" rx="4" fill="#a5d6a7" stroke="#2e7d32" stroke-width="3"/><rect x="80" y="150" width="12" height="40" rx="2" fill="#eceff1" stroke="#3a4270" stroke-width="2"/><rect x="428" y="150" width="12" height="40" rx="2" fill="#eceff1" stroke="#3a4270" stroke-width="2"/><text x="260" y="247" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="260" dy="0">Slot de la carte mère</tspan></text><rect x="100" y="70" width="320" height="60" rx="4" fill="#b3e5fc" stroke="#3949ab" stroke-width="3"/><rect x="112" y="82" width="28" height="36" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="150" y="82" width="28" height="36" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="188" y="82" width="28" height="36" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="226" y="82" width="28" height="36" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="264" y="82" width="28" height="36" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="302" y="82" width="28" height="36" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="340" y="82" width="28" height="36" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="378" y="82" width="28" height="36" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><polygon points="250,130 270,130 270,140 250,140" fill="#ffffff" stroke="#3949ab" stroke-width="2" stroke-linejoin="round"/><text x="240" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="240" dy="0"></tspan></text><line x1="260" y1="135" x2="260" y2="185" stroke="#ef6c00" stroke-width="5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="500" y="80" width="360" height="90.5" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="512" y="102.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="512" dy="0">L'ergot (l'encoche) est décalé : la</tspan><tspan x="512" dy="18.1">barrette ne rentre que DANS UN SENS. Si ça</tspan><tspan x="512" dy="18.1">ne rentre pas, on ne force pas : on la</tspan><tspan x="512" dy="18.1">retourne.</tspan></text><rect x="500" y="175" width="360" height="54.25" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="512" y="197.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="512" dy="0">On pousse franchement jusqu'au CLIC : les</tspan><tspan x="512" dy="18.1">deux clips latéraux se verrouillent.</tspan></text><rect x="500" y="240" width="360" height="54.25" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="512" y="262.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="512" dy="0">Pas de clic = mal enclenchée = le PC ne</tspan><tspan x="512" dy="18.1">démarre pas (bips).</tspan></text></svg>
