<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img"><title>Diagnostic d'une panne au démarrage</title><desc>Arbre de décision : le PC ne démarre pas, que vérifier dans l'ordre.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="320" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Le PC ne démarre pas : on vérifie dans l'ordre</tspan></text><rect x="15" y="60" width="160" height="200" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="95" cy="60" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="95" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="95" dy="0">1</tspan></text><text x="95" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="95" dy="0">Alimentation</tspan></text><text x="95" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="95" dy="0">Câble secteur</tspan><tspan x="95" dy="16.9">branché ?</tspan><tspan x="95" dy="16.9">Interrupteur sur I ?</tspan></text><line x1="177" y1="160" x2="190" y2="160" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="192" y="60" width="160" height="200" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="272" cy="60" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="272" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="272" dy="0">2</tspan></text><text x="272" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="272" dy="0">Connecteurs</tspan></text><text x="272" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="272" dy="0">24 broches et</tspan><tspan x="272" dy="16.9">prise CPU bien</tspan><tspan x="272" dy="16.9">enfoncées ?</tspan></text><line x1="354" y1="160" x2="367" y2="160" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="369" y="60" width="160" height="200" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="449" cy="60" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="449" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="449" dy="0">3</tspan></text><text x="449" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="449" dy="0">RAM</tspan></text><text x="449" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="449" dy="0">Barrettes</tspan><tspan x="449" dy="16.9">clipsées ?</tspan><tspan x="449" dy="16.9">(bips au démarrage)</tspan></text><line x1="531" y1="160" x2="544" y2="160" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="546" y="60" width="160" height="200" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="626" cy="60" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="626" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="626" dy="0">4</tspan></text><text x="626" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="626" dy="0">Façade</tspan></text><text x="626" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="626" dy="0">Bouton power</tspan><tspan x="626" dy="16.9">branché sur la</tspan><tspan x="626" dy="16.9">carte mère ?</tspan></text><line x1="708" y1="160" x2="721" y2="160" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="723" y="60" width="160" height="200" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="803" cy="60" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="803" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="803" dy="0">5</tspan></text><text x="803" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="803" dy="0">Boot</tspan></text><text x="803" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="803" dy="0">Le bon support</tspan><tspan x="803" dy="16.9">est-il en</tspan><tspan x="803" dy="16.9">premier ?</tspan></text><text x="450" y="295" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="450" dy="0">On part du plus simple (le courant) vers le plus fin (le logiciel).</tspan></text></svg>
