<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img"><title>L'ordre de démarrage (boot order)</title><desc>Liste ordonnée des supports sur lesquels le PC cherche un système : clé USB, SSD, réseau.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="330" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">L'ordre de démarrage : le PC cherche un système dans cet ordre</tspan></text><rect x="40" y="60" width="380" height="230" rx="6" fill="#1a237e" stroke="#1a237e" stroke-width="2"/><text x="60" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="700"><tspan x="60" dy="0">BIOS / UEFI – Boot</tspan></text><rect x="55" y="108" width="350" height="34" rx="3" fill="#3949ab" stroke="#9fa8da" stroke-width="1.5"/><text x="70" y="131" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600"><tspan x="70" dy="0">1.  Clé USB</tspan></text><rect x="55" y="150" width="350" height="34" rx="3" fill="#5c6bc0" stroke="#9fa8da" stroke-width="1.5"/><text x="70" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600"><tspan x="70" dy="0">2.  SSD  (Windows Boot Manager)</tspan></text><rect x="55" y="192" width="350" height="34" rx="3" fill="#3949ab" stroke="#9fa8da" stroke-width="1.5"/><text x="70" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600"><tspan x="70" dy="0">3.  Démarrage réseau (PXE)</tspan></text><rect x="55" y="234" width="350" height="34" rx="3" fill="#3949ab" stroke="#9fa8da" stroke-width="1.5"/><text x="70" y="257" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600"><tspan x="70" dy="0">4.  DVD</tspan></text><rect x="450" y="70" width="410" height="55.5" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><text x="462" y="93" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="462" dy="0">Le PC essaie le n°1 ; s'il n'y trouve pas de</tspan><tspan x="462" dy="18.8">système, il passe au n°2, etc.</tspan></text><rect x="450" y="140" width="410" height="74.25" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/><text x="462" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="462" dy="0">Pour installer un système depuis une clé : la</tspan><tspan x="462" dy="18.8">clé doit passer AVANT le SSD (ou on utilise le</tspan><tspan x="462" dy="18.8">menu de démarrage, souvent F12).</tspan></text><rect x="450" y="225" width="410" height="55.5" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="462" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="462" dy="0">Après l'installation : on remet le SSD en</tspan><tspan x="462" dy="18.8">premier.</tspan></text></svg>
