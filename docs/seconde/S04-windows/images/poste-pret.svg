<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img"><title>Checklist d'un poste prêt à l'emploi</title><desc>Huit points à vérifier avant de rendre un poste : nom, compte, date et heure, mises à jour, pilotes, réseau, antivirus, logiciels.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="380" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">Un poste « prêt à l'emploi », c'est quoi ?</tspan></text><rect x="40" y="65" width="380" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><circle cx="66" cy="93" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="66" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="66" dy="0">1</tspan></text><text x="92" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="92" dy="0">Nom du poste clair (ex. : CIEL-PC01)</tspan></text><rect x="440" y="65" width="380" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><circle cx="466" cy="93" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="466" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="466" dy="0">2</tspan></text><text x="492" y="89" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="492" dy="0">Compte utilisateur créé, mot de</tspan><tspan x="492" dy="18.8">passe noté</tspan></text><rect x="40" y="137" width="380" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><circle cx="66" cy="165" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="66" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="66" dy="0">3</tspan></text><text x="92" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="92" dy="0">Date, heure et langue corrects</tspan></text><rect x="440" y="137" width="380" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><circle cx="466" cy="165" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="466" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="466" dy="0">4</tspan></text><text x="492" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="492" dy="0">Windows à jour (Windows Update)</tspan></text><rect x="40" y="209" width="380" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><circle cx="66" cy="237" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="66" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="66" dy="0">5</tspan></text><text x="92" y="233" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="92" dy="0">Aucun triangle jaune dans le</tspan><tspan x="92" dy="18.8">Gestionnaire de périphériques</tspan></text><rect x="440" y="209" width="380" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><circle cx="466" cy="237" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="466" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="466" dy="0">6</tspan></text><text x="492" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="492" dy="0">Réseau OK : une page web s'ouvre</tspan></text><rect x="40" y="281" width="380" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><circle cx="66" cy="309" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="66" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="66" dy="0">7</tspan></text><text x="92" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="92" dy="0">Antivirus actif (Sécurité Windows)</tspan></text><rect x="440" y="281" width="380" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><circle cx="466" cy="309" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="466" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="466" dy="0">8</tspan></text><text x="492" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="492" dy="0">Logiciels demandés installés et</tspan><tspan x="492" dy="18.8">testés</tspan></text></svg>
