<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Le principe de Ventoy</title><desc>Une clé Ventoy a deux partitions : une grande qui contient les fichiers ISO que l'on copie, une petite de démarrage. Au démarrage, Ventoy affiche un menu des ISO.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Ventoy : on prépare la clé UNE fois, ensuite on copie des ISO</tspan></text><text x="240" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="240" dy="0">① La clé après installation de Ventoy</tspan></text><rect x="70" y="95" width="340" height="56" rx="8" fill="#eceff1" stroke="#00897b" stroke-width="2.5"/><rect x="48" y="105" width="24" height="36" rx="3" fill="#90a4ae" stroke="#00897b" stroke-width="2"/><rect x="54" y="112" width="6" height="5" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1"/><rect x="54" y="129" width="6" height="5" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1"/><rect x="70" y="95" width="270" height="56" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/><text x="205" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="205" dy="0">Partition 1 : « Ventoy »</tspan></text><text x="205" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="205" dy="0">exFAT · presque toute la clé</tspan></text><rect x="340" y="95" width="70" height="56" rx="8" fill="#fffde7" stroke="#b28704" stroke-width="2.5"/><text x="375" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="375" dy="0">VTOYEFI</tspan></text><text x="375" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="375" dy="0">32 Mo</tspan></text><text x="240" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400" font-style="italic"><tspan x="240" dy="0">(la petite partition sert à démarrer, on n'y touche pas)</tspan></text><text x="240" y="225" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="240" dy="0">② Tu copies tes ISO comme des fichiers normaux</tspan></text><rect x="80" y="245" width="320" height="34" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><rect x="90" y="252" width="16" height="20" rx="2" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="116" y="267" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="116" dy="0">Windows11_25H2_fr.iso</tspan></text><text x="392" y="267" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="end" font-weight="400"><tspan x="392" dy="0">~ 7 Go</tspan></text><rect x="80" y="287" width="320" height="34" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><rect x="90" y="294" width="16" height="20" rx="2" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="116" y="309" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="116" dy="0">Windows10_22H2.iso</tspan></text><text x="392" y="309" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="end" font-weight="400"><tspan x="392" dy="0">~ 6 Go</tspan></text><rect x="80" y="329" width="320" height="34" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><rect x="90" y="336" width="16" height="20" rx="2" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="116" y="351" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="116" dy="0">ubuntu-24.04.iso</tspan></text><text x="392" y="351" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="end" font-weight="400"><tspan x="392" dy="0">~ 6 Go</tspan></text><rect x="80" y="371" width="320" height="34" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><rect x="90" y="378" width="16" height="20" rx="2" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/><text x="116" y="393" font-family="Consolas, Menlo, monospace" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="116" dy="0">hirens-bootcd.iso</tspan></text><text x="392" y="393" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="end" font-weight="400"><tspan x="392" dy="0">~ 3 Go</tspan></text><text x="240" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="240" dy="0">Aucun formatage : glisser-déposer.</tspan></text><line x1="440" y1="250" x2="540" y2="250" stroke="#00897b" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="490" y="228" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="490" dy="0">on démarre</tspan></text><text x="490" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="490" dy="0">dessus</tspan></text><text x="760" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="760" dy="0">③ Au démarrage : le menu Ventoy</tspan></text><rect x="560" y="95" width="400" height="300" rx="8" fill="#f3f4f8" stroke="#8a93b8" stroke-width="2"/><rect x="560" y="95" width="400" height="30" rx="8" fill="#e8eaf6" stroke="#8a93b8" stroke-width="2"/><text x="572" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="572" dy="0">Ventoy 1.1.18 – menu de démarrage</tspan></text><text x="944" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="944" dy="0">×</tspan></text><rect x="560" y="125" width="400" height="270" rx="8" fill="#0f1630" stroke="#8a93b8" stroke-width="2"/><text x="592" y="160" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e8eaf6" text-anchor="start" font-weight="400"><tspan x="592" dy="0">Windows10_22H2.iso</tspan></text><rect x="576" y="178" width="368" height="30" rx="4" fill="#e8eaf6" stroke="None" stroke-width="0"/><text x="592" y="198" font-family="Consolas, Menlo, monospace" font-size="15" fill="#0f1630" text-anchor="start" font-weight="400"><tspan x="592" dy="0">Windows11_25H2_fr.iso</tspan></text><text x="592" y="236" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e8eaf6" text-anchor="start" font-weight="400"><tspan x="592" dy="0">hirens-bootcd.iso</tspan></text><text x="592" y="274" font-family="Consolas, Menlo, monospace" font-size="15" fill="#e8eaf6" text-anchor="start" font-weight="400"><tspan x="592" dy="0">ubuntu-24.04.iso</tspan></text><text x="592" y="360" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#9fa8da" text-anchor="start" font-weight="400"><tspan x="592" dy="0">↑ ↓ choisir  ·  Entrée valider</tspan></text><text x="760" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="760" dy="0">Les ISO sont classées par ordre alphabétique.</tspan></text><text x="760" y="444" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="760" dy="0">Un seul fichier = un seul choix à faire à l'écran.</tspan></text></svg>
