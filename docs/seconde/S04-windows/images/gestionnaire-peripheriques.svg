<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img"><title>Le Gestionnaire de périphériques (schéma)</title><desc>Liste de familles de matériel ; un périphérique avec un triangle jaune n'a pas de pilote correct.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="360" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">Gestionnaire de périphériques : repérer le triangle jaune</tspan></text><rect x="40" y="55" width="520" height="285" rx="6" fill="#ffffff" stroke="#3a4270" stroke-width="2"/><rect x="40" y="55" width="520" height="28" rx="6" fill="#e8eaf6" stroke="#3a4270" stroke-width="2"/><text x="56" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="56" dy="0">Gestionnaire de périphériques</tspan></text><polygon points="58,100 58,112 65,106" fill="#90a4ae" stroke="#90a4ae" stroke-width="1" stroke-linejoin="round"/><text x="74" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="74" dy="0">Cartes graphiques</tspan></text><polygon points="58,127 58,139 65,133" fill="#90a4ae" stroke="#90a4ae" stroke-width="1" stroke-linejoin="round"/><text x="74" y="139" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="74" dy="0">Cartes son, vidéo et contrôleurs de jeu</tspan></text><polygon points="56,156 66,156 61,163" fill="#90a4ae" stroke="#90a4ae" stroke-width="1" stroke-linejoin="round"/><text x="74" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="74" dy="0">Autres périphériques</tspan></text><rect x="48" y="175" width="504" height="24" rx="4" fill="#fffde7" stroke="#f9a825" stroke-width="1.5"/><polygon points="80,178 90,196.0 70,196.0" fill="#f9a825" stroke="#b28704" stroke-width="2" stroke-linejoin="round"/><text x="80" y="193.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="80" dy="0">!</tspan></text><text x="100" y="193" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="100" dy="0">Contrôleur Ethernet</tspan></text><polygon points="58,208 58,220 65,214" fill="#90a4ae" stroke="#90a4ae" stroke-width="1" stroke-linejoin="round"/><text x="74" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="74" dy="0">Cartes réseau</tspan></text><polygon points="58,235 58,247 65,241" fill="#90a4ae" stroke="#90a4ae" stroke-width="1" stroke-linejoin="round"/><text x="74" y="247" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="74" dy="0">Claviers</tspan></text><polygon points="58,262 58,274 65,268" fill="#90a4ae" stroke="#90a4ae" stroke-width="1" stroke-linejoin="round"/><text x="74" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="74" dy="0">Disques</tspan></text><polygon points="58,289 58,301 65,295" fill="#90a4ae" stroke="#90a4ae" stroke-width="1" stroke-linejoin="round"/><text x="74" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="74" dy="0">Processeurs</tspan></text><polygon points="58,316 58,328 65,322" fill="#90a4ae" stroke="#90a4ae" stroke-width="1" stroke-linejoin="round"/><text x="74" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="74" dy="0">Souris</tspan></text><rect x="590" y="100" width="240" height="74.25" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="602" y="123" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="602" dy="0">Triangle jaune = Windows</tspan><tspan x="602" dy="18.8">voit un matériel mais n'a</tspan><tspan x="602" dy="18.8">pas son pilote.</tspan></text><rect x="590" y="200" width="240" height="111.75" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="602" y="223" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="602" dy="0">Que faire ?</tspan><tspan x="602" dy="18.8">1. Windows Update</tspan><tspan x="602" dy="18.8">2. Site du constructeur</tspan><tspan x="602" dy="18.8">3. Rien au hasard sur</tspan><tspan x="602" dy="18.8">Internet</tspan></text><text x="430" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400" font-style="italic"><tspan x="430" dy="0">Schéma simplifié : l'apparence réelle dépend de la version de Windows.</tspan></text></svg>
