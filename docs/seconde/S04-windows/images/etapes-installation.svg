<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img"><title>Les grandes étapes d'une installation de Windows</title><desc>Clé USB, démarrage depuis la clé, installateur, choix du disque, copie des fichiers, premier démarrage, bureau, mises à jour et pilotes.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="960" height="330" fill="#ffffff" rx="10"/><text x="480.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0">Installer Windows : le chemin en 7 étapes</tspan></text><rect x="18" y="90" width="122" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="79.0" cy="90" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="79.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="79.0" dy="0">1</tspan></text><text x="79.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="79.0" dy="0">Préparer</tspan></text><text x="79.0" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="79.0" dy="0">la clé USB</tspan><tspan x="79.0" dy="16.2">(l'installateur)</tspan></text><line x1="141" y1="165" x2="151" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="152" y="90" width="122" height="150" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><circle cx="213.0" cy="90" r="16" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="213.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="213.0" dy="0">2</tspan></text><text x="213.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="213.0" dy="0">Démarrer</tspan></text><text x="213.0" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="213.0" dy="0">sur la clé</tspan><tspan x="213.0" dy="16.2">(ordre de boot)</tspan></text><line x1="275" y1="165" x2="285" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="286" y="90" width="122" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="347.0" cy="90" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="347.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="347.0" dy="0">3</tspan></text><text x="347.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="347.0" dy="0">Choisir</tspan></text><text x="347.0" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="347.0" dy="0">langue, édition,</tspan><tspan x="347.0" dy="16.2">le disque</tspan></text><line x1="409" y1="165" x2="419" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="420" y="90" width="122" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="481.0" cy="90" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="481.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="481.0" dy="0">4</tspan></text><text x="481.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="481.0" dy="0">Copier</tspan></text><text x="481.0" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="481.0" dy="0">Windows copie</tspan><tspan x="481.0" dy="16.2">ses fichiers</tspan></text><line x1="543" y1="165" x2="553" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="554" y="90" width="122" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="615.0" cy="90" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="615.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0">5</tspan></text><text x="615.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="615.0" dy="0">Configurer</tspan></text><text x="615.0" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="615.0" dy="0">clavier, nom,</tspan><tspan x="615.0" dy="16.2">compte</tspan></text><line x1="677" y1="165" x2="687" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="688" y="90" width="122" height="150" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="749.0" cy="90" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="749.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="749.0" dy="0">6</tspan></text><text x="749.0" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="749.0" dy="0">Mettre</tspan><tspan x="749.0" dy="20.0">à jour</tspan></text><text x="749.0" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="749.0" dy="0">Windows Update</tspan><tspan x="749.0" dy="16.2">+ pilotes</tspan></text><line x1="811" y1="165" x2="821" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="822" y="90" width="122" height="150" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><circle cx="883.0" cy="90" r="16" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="883.0" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="883.0" dy="0">7</tspan></text><text x="883.0" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="883.0" dy="0">Livrer</tspan></text><text x="883.0" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="883.0" dy="0">checklist</tspan><tspan x="883.0" dy="16.2">poste prêt</tspan></text><text x="480" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ef6c00" text-anchor="middle" font-weight="600"><tspan x="480" dy="0">Étape 2 : si le PC redémarre sur son ancien Windows, c'est l'ordre de démarrage (BIOS/UEFI) à corriger.</tspan></text><text x="480" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#c62828" text-anchor="middle" font-weight="600"><tspan x="480" dy="0">Étape 3 : c'est ici qu'on EFFACE ce qui se trouve sur le disque. Toujours sauvegarder avant.</tspan></text></svg>
