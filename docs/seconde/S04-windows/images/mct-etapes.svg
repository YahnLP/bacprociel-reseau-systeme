<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>L'outil de création de média Microsoft</title><desc>Cinq étapes : télécharger l'outil, accepter, choisir langue et édition, choisir clé USB, attendre la création.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Outil Microsoft : cinq écrans, aucun réglage BIOS</tspan></text><rect x="30" y="70" width="170" height="190" rx="12" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><circle cx="54" cy="94" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="54" y="99" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="54" dy="0">1</tspan></text><text x="115" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="115" dy="0">Télécharger</tspan></text><text x="115" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="115" dy="0">« Créer un support</tspan><tspan x="115" dy="15.6">d'installation » sur</tspan><tspan x="115" dy="15.6">microsoft.com</tspan></text><line x1="202" y1="165" x2="220" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="222" y="70" width="170" height="190" rx="12" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><circle cx="246" cy="94" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="246" y="99" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="246" dy="0">2</tspan></text><text x="307" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="307" dy="0">Accepter</tspan></text><text x="307" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="307" dy="0">avis et conditions</tspan><tspan x="307" dy="15.6">de licence</tspan></text><line x1="394" y1="165" x2="412" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="414" y="70" width="170" height="190" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><circle cx="438" cy="94" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="438" y="99" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="438" dy="0">3</tspan></text><text x="499" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="499" dy="0">Langue + édition</tspan></text><text x="499" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="499" dy="0">décocher « options</tspan><tspan x="499" dy="15.6">recommandées »</tspan><tspan x="499" dy="15.6">si besoin</tspan></text><line x1="586" y1="165" x2="604" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="606" y="70" width="170" height="190" rx="12" fill="#ffffff" stroke="#c62828" stroke-width="3"/><circle cx="630" cy="94" r="13" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="630" y="99" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="630" dy="0">4</tspan></text><text x="691" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="691" dy="0">Lecteur flash</tspan><tspan x="691" dy="20.0">USB</tspan></text><text x="691" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="691" dy="0">≥ 8 Go, sera</tspan><tspan x="691" dy="15.6">entièrement effacé</tspan></text><line x1="778" y1="165" x2="796" y2="165" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="798" y="70" width="170" height="190" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="822" cy="94" r="13" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="822" y="99" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="822" dy="0">5</tspan></text><text x="883" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="883" dy="0">Attendre</tspan></text><text x="883" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="883" dy="0">téléchargement,</tspan><tspan x="883" dy="15.6">vérification, création</tspan><tspan x="883" dy="15.6">(20 à 60 min)</tspan></text><rect x="30" y="290" width="940" height="90" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="50" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="50" dy="0">À savoir avant de choisir cet outil</tspan></text><text x="50" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="50" dy="0">Toujours la dernière version de Windows 11 (pas de choix de version). La clé est préparée au format FAT32 pour démarrer en UEFI :</tspan></text><text x="50" y="366" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="50" dy="0">aucun choix de mode BIOS, aucun contournement des exigences TPM / Secure Boot de Windows 11.</tspan></text></svg>
