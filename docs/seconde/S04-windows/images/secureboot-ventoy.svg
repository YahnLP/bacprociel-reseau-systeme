<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Secure Boot et Ventoy</title><desc>Avec Secure Boot, le BIOS n'exécute que des programmes signés. Ventoy utilise un programme signé par Microsoft qui demande d'enregistrer la clé de Ventoy au premier démarrage.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Secure Boot : le vigile du BIOS ne laisse passer que les programmes signés</tspan></text><rect x="40" y="70" width="200" height="110" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="140" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="140" dy="0">BIOS / UEFI</tspan></text><text x="140" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="140" dy="0">contient la liste des</tspan><tspan x="140" dy="16.2">signatures acceptées</tspan></text><line x1="244" y1="125" x2="276" y2="125" stroke="#3949ab" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="280" y="70" width="200" height="110" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="380" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="380" dy="0">Programme signé</tspan></text><text x="380" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="380" dy="0">(« shim », signé</tspan><tspan x="380" dy="16.2">par Microsoft)</tspan></text><line x1="484" y1="125" x2="516" y2="125" stroke="#00897b" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="520" y="70" width="200" height="110" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="620" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="620" dy="0">Clé de Ventoy</tspan></text><text x="620" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="620" dy="0">à enregistrer UNE fois</tspan><tspan x="620" dy="16.2">(MokManager)</tspan></text><line x1="724" y1="125" x2="756" y2="125" stroke="#ef6c00" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="760" y="70" width="200" height="110" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="860" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="860" dy="0">Ventoy</tspan></text><text x="860" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="860" dy="0">puis ton ISO</tspan><tspan x="860" dy="16.2">Windows</tspan></text><rect x="30" y="210" width="440" height="230" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="250" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="250" dy="0">1er démarrage sur la clé Ventoy (écrans en anglais)</tspan></text><circle cx="56" cy="268" r="11" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="56" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="56" dy="0">1</tspan></text><text x="78" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="78" dy="0">Écran bleu « Perform MOK management »</tspan></text><circle cx="56" cy="306" r="11" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="56" y="311" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="56" dy="0">2</tspan></text><text x="78" y="311" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="78" dy="0">→ Enroll key from disk</tspan></text><circle cx="56" cy="344" r="11" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="56" y="349" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="56" dy="0">3</tspan></text><text x="78" y="349" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="78" dy="0">→ VTOYEFI → ENROLL_THIS_KEY_IN_MOKMANAGER.cer</tspan></text><circle cx="56" cy="382" r="11" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="56" y="387" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="56" dy="0">4</tspan></text><text x="78" y="387" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="78" dy="0">→ Continue → Yes → Reboot</tspan></text><text x="250" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="250" dy="0">Les démarrages suivants : plus d'écran bleu.</tspan></text><rect x="500" y="210" width="470" height="230" rx="12" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="735" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="735" dy="0">Que faire si ça bloque ?</tspan></text><text x="520" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="520" dy="0">« Security Violation » / clé refusée</tspan></text><text x="520" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="520" dy="0">→ l'enregistrement n'a pas été fait : recommencer</tspan></text><text x="520" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="520" dy="0">Certains PC ne l'acceptent pas</tspan></text><text x="520" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="520" dy="0">→ option BIOS « Allow Microsoft 3rd Party UEFI CA »</tspan></text><text x="520" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="520" dy="0">Pas de temps / PC de TP</tspan></text><text x="520" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="520" dy="0">→ prof : désactiver Secure Boot, ou utiliser Rufus</tspan></text><text x="500" y="462" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Désactiver Secure Boot est un dernier recours : Windows 11 le demande à l'usage. On le réactive après l'installation.</tspan></text></svg>
