<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img"><title>La fenêtre de Rufus</title><desc>Maquette de Rufus : périphérique, sélection de l'ISO, schéma de partition, système cible, système de fichiers, bouton DÉMARRER.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="640" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Rufus : six repères, chacun a une conséquence</tspan></text><rect x="30" y="60" width="500" height="560" rx="8" fill="#f3f4f8" stroke="#8a93b8" stroke-width="2"/><rect x="30" y="60" width="500" height="30" rx="8" fill="#e8eaf6" stroke="#8a93b8" stroke-width="2"/><text x="42" y="81" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="42" dy="0">Rufus 4.15</tspan></text><text x="514" y="81" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="514" dy="0">×</tspan></text><text x="46" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="46" dy="0">Propriétés du lecteur</tspan></text><text x="60" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Périphérique</tspan></text><rect x="196" y="124" width="318" height="28" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><text x="204" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="204" dy="0">SanDisk Ultra (E:) [29 Go]</tspan></text><polygon points="495,138 505,138 500,144" fill="#5b6385" stroke="#5b6385" stroke-width="1" stroke-linejoin="round"/><text x="60" y="179" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Type de démarrage</tspan></text><rect x="196" y="160" width="318" height="28" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><text x="204" y="179" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="204" dy="0">Image disque ou ISO</tspan></text><polygon points="495,174 505,174 500,180" fill="#5b6385" stroke="#5b6385" stroke-width="1" stroke-linejoin="round"/><rect x="414" y="160" width="100" height="28" rx="4" fill="#3949ab" stroke="#3949ab" stroke-width="1.5"/><text x="464" y="179" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="464" dy="0">SÉLECTIONNER</tspan></text><text x="60" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Option d'image</tspan></text><rect x="196" y="196" width="318" height="28" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><text x="204" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="204" dy="0">Installation Windows standard</tspan></text><polygon points="495,210 505,210 500,216" fill="#5b6385" stroke="#5b6385" stroke-width="1" stroke-linejoin="round"/><text x="60" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Schéma de partition</tspan></text><rect x="196" y="232" width="318" height="28" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><text x="204" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="204" dy="0">GPT</tspan></text><polygon points="495,246 505,246 500,252" fill="#5b6385" stroke="#5b6385" stroke-width="1" stroke-linejoin="round"/><text x="60" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Système cible</tspan></text><rect x="196" y="268" width="318" height="28" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><text x="204" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="204" dy="0">UEFI (non CSM)</tspan></text><polygon points="495,282 505,282 500,288" fill="#5b6385" stroke="#5b6385" stroke-width="1" stroke-linejoin="round"/><text x="46" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="46" dy="0">Options de formatage</tspan></text><text x="60" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Nom de volume</tspan></text><rect x="196" y="336" width="318" height="28" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><text x="204" y="355" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="204" dy="0">WIN11_25H2_FR</tspan></text><text x="60" y="391" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Système de fichiers</tspan></text><rect x="196" y="372" width="318" height="28" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><text x="204" y="391" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="204" dy="0">FAT32 (par défaut)</tspan></text><polygon points="495,386 505,386 500,392" fill="#5b6385" stroke="#5b6385" stroke-width="1" stroke-linejoin="round"/><text x="60" y="427" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Taille de cluster</tspan></text><rect x="196" y="408" width="318" height="28" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><text x="204" y="427" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="204" dy="0">16 kilo-octets (défaut)</tspan></text><polygon points="495,422 505,422 500,428" fill="#5b6385" stroke="#5b6385" stroke-width="1" stroke-linejoin="round"/><rect x="46" y="460" width="454" height="26" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/><text x="280" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="280" dy="0">PRÊT</tspan></text><rect x="150" y="510" width="130" height="44" rx="8" fill="#00897b" stroke="#00695c" stroke-width="2"/><text x="215" y="539" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="215" dy="0">DÉMARRER</tspan></text><rect x="300" y="510" width="130" height="44" rx="8" fill="#ffffff" stroke="#8a93b8" stroke-width="2"/><text x="365" y="539" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="365" dy="0">FERMER</tspan></text><circle cx="42" cy="138" r="11" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="42" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="42" dy="0">1</tspan></text><circle cx="42" cy="174" r="11" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="42" y="179" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="42" dy="0">2</tspan></text><circle cx="42" cy="246" r="11" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="42" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="42" dy="0">3</tspan></text><circle cx="42" cy="282" r="11" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="42" y="287" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="42" dy="0">4</tspan></text><circle cx="42" cy="386" r="11" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="42" y="391" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="42" dy="0">5</tspan></text><circle cx="134" cy="524" r="11" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="134" y="529" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="134" dy="0">6</tspan></text><rect x="560" y="70" width="410" height="93" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/><text x="574" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#00897b" text-anchor="start" font-weight="700"><tspan x="574" dy="0">1·2  La clé et l'ISO</tspan></text><text x="574" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="574" dy="0">Vérifier la taille de la clé. Sélectionner l'ISO</tspan><tspan x="574" dy="16.2">téléchargé sur le site Microsoft.</tspan></text><rect x="560" y="177" width="410" height="110" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="574" y="203" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="574" dy="0">3·4  Le mode BIOS</tspan></text><text x="574" y="227" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="574" dy="0">GPT + UEFI : PC récents, Secure Boot OK.</tspan><tspan x="574" dy="16.2">MBR + BIOS (ou UEFI-CSM) : vieux PC, pas</tspan><tspan x="574" dy="16.2">de Windows 11. Rufus propose le bon couple.</tspan></text><rect x="560" y="301" width="410" height="127" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="574" y="327" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="574" dy="0">5  Le système de fichiers</tspan></text><text x="574" y="351" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="574" dy="0">FAT32 : démarre partout, même avec Secure</tspan><tspan x="574" dy="16.2">Boot. NTFS : accepte les fichiers &gt; 4 Go,</tspan><tspan x="574" dy="16.2">mais ajoute une petite partition UEFI:NTFS</tspan><tspan x="574" dy="16.2">que Secure Boot peut refuser.</tspan></text><rect x="560" y="442" width="410" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="574" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="574" dy="0">6  DÉMARRER</tspan></text><text x="574" y="492" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="574" dy="0">Efface TOUTE la clé (message d'alerte).</tspan><tspan x="574" dy="16.2">Puis une fenêtre « Expérience utilisateur</tspan><tspan x="574" dy="16.2">Windows » propose des réglages : voir fiche.</tspan></text></svg>
