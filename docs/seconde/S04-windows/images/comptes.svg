<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"><title>Compte administrateur et compte standard</title><desc>Le compte administrateur peut tout modifier ; le compte standard utilise le poste mais ne peut pas installer ni changer le système.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="300" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">Deux types de comptes</tspan></text><rect x="40" y="60" width="370" height="200" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="225" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="225" dy="0">Administrateur</tspan></text><path d="M72.4,130 L76.8,134.8 L84.4,125.2" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="102" dy="0">installer des logiciels</tspan></text><path d="M72.4,158 L76.8,162.8 L84.4,153.2" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="102" dy="0">créer des comptes</tspan></text><path d="M72.4,186 L76.8,190.8 L84.4,181.2" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="102" y="191" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="102" dy="0">changer le système</tspan></text><line x1="73.2" y1="209.2" x2="82.8" y2="218.8" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="82.8" y1="209.2" x2="73.2" y2="218.8" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="102" y="219" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="102" dy="0">un virus peut tout casser</tspan></text><text x="225" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="225" dy="0">Le technicien</tspan></text><rect x="450" y="60" width="370" height="200" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="635" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="635" dy="0">Utilisateur standard</tspan></text><path d="M482.4,130 L486.8,134.8 L494.4,125.2" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="512" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="512" dy="0">utiliser ses logiciels</tspan></text><path d="M482.4,158 L486.8,162.8 L494.4,153.2" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="512" y="163" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="512" dy="0">ses propres fichiers</tspan></text><line x1="483.2" y1="181.2" x2="492.8" y2="190.8" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="492.8" y1="181.2" x2="483.2" y2="190.8" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="512" y="191" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="512" dy="0">pas d'installation</tspan></text><path d="M482.4,214 L486.8,218.8 L494.4,209.2" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="512" y="219" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="512" dy="0">plus sûr au quotidien</tspan></text><text x="635" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="635" dy="0">L'utilisateur au quotidien</tspan></text></svg>
