<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img"><title>Un disque découpé en partitions</title><desc>Un disque vierge (espace non alloué) est découpé automatiquement par Windows : partition système EFI, réservée, Windows (C:), récupération.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="330" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">Le disque : un grand placard qu'on découpe</tspan></text><text x="30" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="start" font-weight="700"><tspan x="30" dy="0">AVANT (disque neuf)</tspan></text><rect x="30" y="85" width="800" height="50" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/><text x="430" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#5b6385" text-anchor="middle" font-weight="600"><tspan x="430" dy="0">Espace non alloué  (256 Go)</tspan></text><line x1="430" y1="140" x2="430" y2="175" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="30" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="start" font-weight="700"><tspan x="30" dy="0">APRÈS (Windows a découpé tout seul)</tspan></text><rect x="30" y="205" width="70" height="60" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="65.0" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="65.0" dy="0">EFI</tspan></text><text x="65.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="65.0" dy="0">démarrage</tspan></text><rect x="100" y="205" width="40" height="60" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="2.5"/><text x="120.0" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="120.0" dy="0">MSR</tspan></text><rect x="140" y="205" width="560" height="60" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="420.0" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="420.0" dy="0">Windows (C:)</tspan></text><text x="420.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="420.0" dy="0">système + tes fichiers + programmes</tspan></text><rect x="700" y="205" width="130" height="60" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/><text x="765.0" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0">Récupération</tspan></text><text x="765.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="765.0" dy="0">réparation</tspan></text><text x="430" y="305" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="430" dy="0">En pratique : tu cliques sur « Espace non alloué » puis « Suivant ». Windows fait le reste.</tspan></text></svg>
