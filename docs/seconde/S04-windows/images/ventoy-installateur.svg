<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img"><title>La fenêtre Ventoy2Disk</title><desc>Maquette de la fenêtre Ventoy2Disk : choisir le périphérique, régler le menu Option (Secure Boot, style de partition), puis cliquer sur Install.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="560" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Ventoy2Disk.exe : trois gestes seulement</tspan></text><rect x="30" y="60" width="520" height="440" rx="8" fill="#f3f4f8" stroke="#8a93b8" stroke-width="2"/><rect x="30" y="60" width="520" height="30" rx="8" fill="#e8eaf6" stroke="#8a93b8" stroke-width="2"/><text x="42" y="81" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="42" dy="0">Ventoy2Disk</tspan></text><text x="534" y="81" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="534" dy="0">×</tspan></text><text x="50" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="50" dy="0">Périphérique</tspan></text><rect x="50" y="118" width="480" height="30" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><text x="60" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">[E:] SanDisk Ultra  28.7 GB</tspan></text><polygon points="507,132 517,132 512,138" fill="#5b6385" stroke="#5b6385" stroke-width="1" stroke-linejoin="round"/><rect x="50" y="168" width="230" height="90" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="165" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="600"><tspan x="165" dy="0">Ventoy dans le package</tspan></text><text x="165" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="165" dy="0">1.1.18</tspan></text><rect x="300" y="168" width="230" height="90" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="415" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="600"><tspan x="415" dy="0">Ventoy sur la clé</tspan></text><text x="415" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="415" dy="0">(vide)</tspan></text><rect x="50" y="276" width="480" height="30" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="1.5"/><text x="290" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="290" dy="0">Secure Boot activé · MBR</tspan></text><text x="60" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Menu « Option » (barre du haut)</tspan></text><rect x="50" y="340" width="250" height="112" rx="4" fill="#ffffff" stroke="#8a93b8" stroke-width="1.5"/><path d="M60.4,357 L64.8,361.8 L72.4,352.2" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="84" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="84" dy="0">Secure Boot Support</tspan></text><text x="84" y="387" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="84" dy="0">Partition Style  &gt;  MBR / GPT</tspan></text><text x="84" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="84" dy="0">Partition Configuration  &gt;</tspan></text><text x="84" y="437" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="84" dy="0">Clear Ventoy</tspan></text><rect x="330" y="372" width="130" height="56" rx="8" fill="#00897b" stroke="#00695c" stroke-width="2"/><text x="395" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="395" dy="0">Install</tspan></text><rect x="330" y="438" width="130" height="40" rx="8" fill="#ffffff" stroke="#8a93b8" stroke-width="2"/><text x="395" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="395" dy="0">Update</tspan></text><circle cx="40" cy="133" r="13" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="40" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">1</tspan></text><circle cx="40" cy="395" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="40" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="40" dy="0">2</tspan></text><circle cx="318" cy="400" r="13" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="318" y="405" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="318" dy="0">3</tspan></text><rect x="590" y="70" width="380" height="130" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/><circle cx="614" cy="94" r="13" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="614" y="99" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="614" dy="0">1</tspan></text><text x="636" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#00897b" text-anchor="start" font-weight="700"><tspan x="636" dy="0">Bon périphérique ?</tspan></text><text x="606" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="606" dy="0">Vérifier la lettre ET la taille :</tspan><tspan x="606" dy="16.9">le disque du PC n'est jamais</tspan><tspan x="606" dy="16.9">une clé de 28 Go.</tspan></text><rect x="590" y="214" width="380" height="150" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><circle cx="614" cy="238" r="13" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="614" y="243" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="614" dy="0">2</tspan></text><text x="636" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="636" dy="0">Deux réglages (menu Option)</tspan></text><text x="606" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="606" dy="0">Secure Boot Support : coché (laisser).</tspan><tspan x="606" dy="16.9">Partition Style : MBR par défaut</tspan><tspan x="606" dy="16.9">(démarre en UEFI et en Legacy).</tspan><tspan x="606" dy="16.9">GPT seulement si le prof le demande.</tspan></text><rect x="590" y="378" width="380" height="122" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><circle cx="614" cy="402" r="13" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="614" y="407" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="614" dy="0">3</tspan></text><text x="636" y="408" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="636" dy="0">Install = effacement</tspan></text><text x="606" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="606" dy="0">Ventoy demande deux confirmations :</tspan><tspan x="606" dy="16.9">tout ce qui est sur la clé disparaît.</tspan><tspan x="606" dy="16.9">Update, lui, garde tes ISO.</tspan></text><text x="500" y="536" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Résultat attendu : « Ventoy sur la clé » affiche 1.1.18, la clé se nomme « Ventoy » dans l'Explorateur.</tspan></text></svg>
