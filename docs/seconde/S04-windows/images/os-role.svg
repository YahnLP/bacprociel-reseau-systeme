<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img"><title>Rôle d'un système d'exploitation</title><desc>Trois couches : applications, système d'exploitation, matériel. Analogie avec un restaurant : client, serveur, cuisine.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="360" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">Le système d'exploitation : l'intermédiaire</tspan></text><rect x="40" y="70" width="200" height="130" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="140" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="140" dy="0">Les applications</tspan></text><text x="140" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="140" dy="0">Navigateur, Word,</tspan><tspan x="140" dy="18.8">jeux, Teams…</tspan></text><rect x="60" y="230" width="160" height="62" rx="31" fill="#ffffff" stroke="#3949ab" stroke-width="2" stroke-dasharray="6 5"/><text x="140" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="140" dy="0">Le client</tspan><tspan x="140" dy="18.8">qui commande</tspan></text><rect x="330" y="70" width="200" height="130" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="430" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="430" dy="0">Le système d'exploitation</tspan></text><text x="430" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="430" dy="0">Windows, Linux,</tspan><tspan x="430" dy="18.8">macOS, Android…</tspan></text><rect x="350" y="230" width="160" height="62" rx="31" fill="#ffffff" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6 5"/><text x="430" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="430" dy="0">Le serveur</tspan><tspan x="430" dy="18.8">qui fait le lien</tspan></text><rect x="620" y="70" width="200" height="130" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="720" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="720" dy="0">Le matériel</tspan></text><text x="720" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="720" dy="0">Processeur, mémoire,</tspan><tspan x="720" dy="18.8">disque, écran, réseau…</tspan></text><rect x="640" y="230" width="160" height="62" rx="31" fill="#ffffff" stroke="#00897b" stroke-width="2" stroke-dasharray="6 5"/><text x="720" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="720" dy="0">La cuisine</tspan><tspan x="720" dy="18.8">qui prépare</tspan></text><line x1="240" y1="135" x2="328" y2="135" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="328" y1="150" x2="240" y2="150" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="530" y1="135" x2="618" y2="135" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="618" y1="150" x2="530" y2="150" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="430" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="middle" font-weight="600" font-style="italic"><tspan x="430" dy="0">Une application ne parle jamais directement au matériel : elle passe par le système.</tspan></text></svg>
