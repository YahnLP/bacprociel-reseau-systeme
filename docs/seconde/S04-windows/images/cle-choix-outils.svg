<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img"><title>Choisir son outil</title><desc>Comparaison de Ventoy, Rufus et de l'outil de création de média Microsoft : plusieurs ISO, hors-ligne, réglages, effort.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="500" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Trois outils, trois façons de faire une clé d'installation</tspan></text><rect x="30" y="60" width="294" height="410" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="177" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="177" dy="0">Ventoy</tspan></text><text x="177" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="177" dy="0">★ l'outil prioritaire</tspan></text><line x1="44" y1="136" x2="310" y2="136" stroke="#00897b" stroke-width="2" stroke-linecap="round"/><text x="46" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="46" dy="0">Plusieurs systèmes sur</tspan><tspan x="46" dy="17.5">la même clé</tspan></text><path d="M284.3,174 L290.35,180.6 L300.8,167.4" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="46" dy="0">On remplace l'ISO sans</tspan><tspan x="46" dy="17.5">reformater la clé</tspan></text><path d="M284.3,232 L290.35,238