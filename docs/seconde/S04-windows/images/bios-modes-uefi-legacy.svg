<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580" role="img"><title>UEFI ou Legacy : deux chemins</title><desc>Selon que la clé est démarrée en mode UEFI ou en mode Legacy/CSM, Windows crée un disque GPT ou MBR, ce qui détermine Secure Boot et Windows 11.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="580" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Le mode dans lequel on démarre la clé décide de TOUT le reste</tspan></text><rect x="30" y="60" width="940" height="70" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="50" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="50" dy="0">Dans le menu de démarrage (F12…), la même clé apparaît en double :</tspan></text><text x="50" y="114" font-family="Consolas, Menlo, monospace" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="50" dy="0">« UEFI : SanDisk Ultra »    et    « SanDisk Ultra »  (sans UEFI = mode Legacy)</tspan></text><rect x="30" y="160" width="940" height="175" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="46" y="174" width="230" height="70" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="2.5"/><text x="161" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="161" dy="0">Tu choisis « UEFI : … »</tspan></text><line x1="278" y1="210" x2="332" y2="210" stroke="#00897b" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="336" y="174" width="270" height="70" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="2.5"/><text x="471" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="600"><tspan x="471" dy="0">Windows crée sur le PC :</tspan></text><text x="471" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="471" dy="0">Disque GPT + partition EFI</tspan></text><line x1="608" y1="210" x2="662" y2="210" stroke="#00897b" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="666" y="174" width="288" height="148" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="2.5"/><text x="810" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="810" dy="0">Conséquences</tspan></text><path d="M683.7,224 L688.65,229.4 L697.2,218.6" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="708" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="708" dy="0">Secure Boot possible</tspan></text><path d="M683.7,256 L688.65,261.4 L697.2,250.6" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="708" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="708" dy="0">Windows 11 accepté</tspan></text><path d="M683.7,288 L688.65,293.4 L697.2,282.6" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="708" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="708" dy="0">Disques &gt; 2 To utilisables</tspan></text><rect x="46" y="264" width="60" height="48" rx="4" fill="#fffde7" stroke="#00897b" stroke-width="1.5"/><text x="76.0" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="76.0" dy="0">EFI</tspan><tspan x="76.0" dy="14.4">100 Mo</tspan></text><rect x="110" y="264" width="46" height="48" rx="4" fill="#eceff1" stroke="#00897b" stroke-width="1.5"/><text x="133.0" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="133.0" dy="0">MSR</tspan><tspan x="133.0" dy="14.4">16 Mo</tspan></text><rect x="160" y="264" width="150" height="48" rx="4" fill="#e8eaf6" stroke="#00897b" stroke-width="1.5"/><text x="235.0" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0">C: (Windows)</tspan></text><rect x="314" y="264" width="56" height="48" rx="4" fill="#eceff1" stroke="#00897b" stroke-width="1.5"/><text x="342.0" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="342.0" dy="0">Récup.</tspan></text><rect x="30" y="355" width="940" height="175" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="3"/><rect x="46" y="369" width="230" height="70" rx="10" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/><text x="161" y="399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="161" dy="0">Tu choisis l'entrée</tspan><tspan x="161" dy="18.8">sans « UEFI »</tspan></text><line x1="278" y1="405" x2="332" y2="405" stroke="#c62828" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="336" y="369" width="270" height="70" rx="10" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/><text x="471" y="395" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="600"><tspan x="471" dy="0">Windows crée sur le PC :</tspan></text><text x="471" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="471" dy="0">Disque MBR (ancien format)</tspan></text><line x1="608" y1="405" x2="662" y2="405" stroke="#c62828" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="666" y="369" width="288" height="148" rx="10" fill="#ffffff" stroke="#c62828" stroke-width="2.5"/><text x="810" y="395" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="810" dy="0">Conséquences</tspan></text><line x1="684.6" y1="413.6" x2="695.4" y2="424.4" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="695.4" y1="413.6" x2="684.6" y2="424.4" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="708" y="425" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="708" dy="0">Secure Boot impossible</tspan></text><line x1="684.6" y1="445.6" x2="695.4" y2="456.4" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="695.4" y1="445.6" x2="684.6" y2="456.4" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="708" y="457" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="708" dy="0">Windows 11 refuse d'installer</tspan></text><line x1="684.6" y1="477.6" x2="695.4" y2="488.4" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="695.4" y1="477.6" x2="684.6" y2="488.4" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="708" y="489" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="708" dy="0">Disque limité à 2 To</tspan></text><rect x="46" y="459" width="80" height="48" rx="4" fill="#fffde7" stroke="#c62828" stroke-width="1.5"/><text x="86.0" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="86.0" dy="0">Réservé</tspan><tspan x="86.0" dy="14.4">500 Mo</tspan></text><rect x="130" y="459" width="240" height="48" rx="4" fill="#e8eaf6" stroke="#c62828" stroke-width="1.5"/><text x="250.0" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0">C: (Windows)</tspan></text><text x="500" y="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Changer de mode après coup ≠ simple réglage : il faut convertir le disque ou tout réinstaller. Donc : on choisit bien au départ.</tspan></text></svg>
