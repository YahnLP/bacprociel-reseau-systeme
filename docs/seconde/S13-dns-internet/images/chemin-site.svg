<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img"><title>Du nom à la page web</title><desc>PC, box, DNS du FAI et serveur web : le PC demande l'adresse au DNS via la box, puis demande la page au serveur.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="520" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Comment mon PC atteint un site web</tspan></text><rect x="30" y="50" width="160" height="50" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="110" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="110" dy="0">Mon PC</tspan></text><text x="110" y="92" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="110" dy="0">192.168.1.10</tspan></text><line x1="110" y1="100" x2="110" y2="500" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="270" y="50" width="160" height="50" rx="10" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="350" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="350" dy="0">Box</tspan></text><text x="350" y="92" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="350" dy="0">192.168.1.1</tspan></text><line x1="350" y1="100" x2="350" y2="500" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="510" y="50" width="160" height="50" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="3"/><text x="590" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">DNS du FAI</tspan></text><text x="590" y="92" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="590" dy="0">198.51.100.53</tspan></text><line x1="590" y1="100" x2="590" y2="500" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="750" y="50" width="160" height="50" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="830" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="830" dy="0">www.exemple.fr</tspan></text><text x="830" y="92" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">198.51.100.80</tspan></text><line x1="830" y1="100" x2="830" y2="500" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="118" y1="145" x2="342" y2="145" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="230.0" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0">1 « Adresse de ce nom ? »</tspan></text><text x="230.0" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0">1 « Adresse de ce nom ? »</tspan></text><line x1="358" y1="203" x2="582" y2="203" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="470.0" y="193" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">2 la box interroge le DNS</tspan></text><text x="470.0" y="193" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">2 la box interroge le DNS</tspan></text><line x1="582" y1="261" x2="358" y2="261" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="470.0" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">3 « c'est 198.51.100.80 »</tspan></text><text x="470.0" y="251" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">3 « c'est 198.51.100.80 »</tspan></text><line x1="342" y1="319" x2="118" y2="319" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="230.0" y="309" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0">4 « c'est 198.51.100.80 »</tspan></text><text x="230.0" y="309" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="230.0" dy="0">4 « c'est 198.51.100.80 »</tspan></text><line x1="118" y1="377" x2="822" y2="377" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="470.0" y="367" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">5 « Donne-moi la page ! » (via la passerelle)</tspan></text><text x="470.0" y="367" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">5 « Donne-moi la page ! » (via la passerelle)</tspan></text><line x1="822" y1="435" x2="118" y2="435" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="470.0" y="425" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">6 la page web revient</tspan></text><text x="470.0" y="425" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">6 la page web revient</tspan></text><rect x="40" y="468" width="860" height="40" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/><text x="470" y="494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">Étapes 1 à 4 = le DNS (traduire). Étapes 5 et 6 = le web (aller chercher la page).</tspan></text></svg>
