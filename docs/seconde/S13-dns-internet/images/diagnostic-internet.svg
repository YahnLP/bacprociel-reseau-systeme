<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img"><title>J'ai un réseau mais pas Internet : par où commencer ?</title><desc>Ping de la box, ping d'une adresse sur Internet, ping d'un nom : trois tests dans l'ordre pour trouver la panne.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="400" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">« Je n'ai pas Internet » : 3 pings, dans l'ordre</tspan></text><circle cx="60" cy="105" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">1</tspan></text><rect x="95" y="65" width="330" height="85" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="2.5"/><text x="110" y="100" font-family="Consolas, Menlo, monospace" font-size="17" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="110" dy="0">ping 192.168.1.1</tspan></text><text x="110" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="110" dy="0">(la box)</tspan></text><rect x="450" y="65" width="460" height="85" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="465" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="465" dy="0">ÉCHEC → problème de câble, d'adresse ou de DHCP</tspan><tspan x="465" dy="16.9">(S10, S11, S12)</tspan></text><text x="260" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="260" dy="0">OK ↓</tspan></text><circle cx="60" cy="210" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="60" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">2</tspan></text><rect x="95" y="170" width="330" height="85" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="2.5"/><text x="110" y="205" font-family="Consolas, Menlo, monospace" font-size="17" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="110" dy="0">ping 203.0.113.1</tspan></text><text x="110" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="110" dy="0">(une adresse sur Internet)</tspan></text><rect x="450" y="170" width="460" height="85" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="465" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="465" dy="0">ÉCHEC → passerelle absente ou box sans accès</tspan><tspan x="465" dy="16.9">au FAI (S12)</tspan></text><text x="260" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="260" dy="0">OK ↓</tspan></text><circle cx="60" cy="315" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="60" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">3</tspan></text><rect x="95" y="275" width="330" height="85" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="2.5"/><text x="110" y="310" font-family="Consolas, Menlo, monospace" font-size="17" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="110" dy="0">ping www.exemple.fr</tspan></text><text x="110" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="110" dy="0">(un nom)</tspan></text><rect x="450" y="275" width="460" height="85" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="465" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="465" dy="0">ÉCHEC alors que le 2 marche → panne DNS</tspan><tspan x="465" dy="16.9">(vérifier le serveur DNS : ipconfig /all)</tspan></text></svg>
