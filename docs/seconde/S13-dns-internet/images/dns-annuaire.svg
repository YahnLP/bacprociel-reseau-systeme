<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 365" width="940" height="365" role="img"><title>Le DNS, l'annuaire d'Internet</title><desc>Le DNS transforme un nom facile à retenir comme www.exemple.fr en adresse IP utilisable par les machines.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="365" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">Le DNS : l'annuaire d'Internet</tspan></text><rect x="40" y="70" width="380" height="200" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="230" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="230" dy="0">Ce que TU tapes</tspan></text><text x="230" y="160" font-family="Consolas, Menlo, monospace" font-size="22" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="230" dy="0">www.exemple.fr</tspan></text><text x="230" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="230" dy="0">facile à retenir, mais</tspan><tspan x="230" dy="17.5">les machines ne comprennent pas</tspan></text><rect x="520" y="70" width="380" height="200" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="710" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="710" dy="0">Ce que la machine utilise</tspan></text><text x="710" y="160" font-family="Consolas, Menlo, monospace" font-size="24" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="710" dy="0">198.51.100.80</tspan></text><text x="710" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="710" dy="0">une adresse IP</tspan></text><line x1="425" y1="150" x2="515" y2="150" stroke="#2e7d32" stroke-width="5" stroke-linecap="round" marker-end="url(#ar)"/><text x="470" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">DNS</tspan></text><text x="470" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">traduit</tspan></text><rect x="40" y="285" width="860" height="54.25" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="52" y="307.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="52" dy="0">Comme dans ton téléphone : tu cherches « Maman », le répertoire trouve le numéro. Le DNS fait pareil pour</tspan><tspan x="52" dy="18.1">les sites.</tspan></text></svg>
