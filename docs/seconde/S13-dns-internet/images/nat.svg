<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img"><title>Le NAT en une image</title><desc>Trois PC en adresses privées sortent sur Internet avec la même adresse publique, celle de la box.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="940" height="470" fill="#ffffff" rx="10"/><text x="470.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0">NAT : toute la maison sort avec UNE adresse publique</tspan></text><rect x="30" y="55" width="330" height="400" rx="16" fill="#e8eaf6" stroke="#3949ab" stroke-width="3" stroke-dasharray="8 6"/><text x="195" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="195" dy="0">Réseau privé (chez toi)</tspan></text><rect x="70" y="90" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="75" y="95" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="100" y1="130" x2="100" y2="140" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="82" y="138" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="100" y="165" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">PC1</tspan></text><text x="100" y="182" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="100" dy="0">192.168.1.10</tspan></text><rect x="70" y="202" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="75" y="207" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" str