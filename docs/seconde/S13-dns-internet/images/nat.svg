t="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><circle cx="470" cy="212" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="440" y="253" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="440" dy="0">Box</tspan></text><text x="440" y="270" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="440" dy="0">fait le NAT</tspan></text><path d="M770,234 a18,18 0 0 1 4,-35 a24,24 0 0 1 46,-6 a20,20 0 0 1 24,26 a14,14 0 0 1 -6,15 z" fill="#e8eaf6" stroke="#9fa8da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="810" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="810" dy="0">Internet</tspan></text><line x1="150" y1="120" x2="395" y2="215" stroke="#3949ab" stroke-width="2.5" stroke-linecap="round"/><line x1="150" y1="232" x2="395" y2="215" stroke="#3949ab" stroke-width="2.5" stroke-linecap="round"/><line x1="150" y1="344" x2="395" y2="215" stroke="#3949ab" stroke-width="2.5" stroke-linecap="round"/><line x1="485" y1="220" x2="750" y2="220" stroke="#ef6c00" stroke-width="4" stroke-linecap="round"/><rect x="540" y="130" width="190" height="60" rx="10" fill="#ffffff" stroke="#ef6c00" stroke-width="2.5"/><text x="635" y="155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="635" dy="0">Pour Internet :</tspan></text><text x="635" y="178" font-family="Consolas, Menlo, monospace" font-size="16" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="635" dy="0">203.0.113.2</tspan></text><rect x="520" y="265" width="400" height="68.625" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="532" y="286.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="532" dy="0">La box note : « PC1 a demandé » → elle remplace son</tspan><tspan x="532" dy="16.9">adresse privée par la sienne et, au retour, remet la</tspan><tspan x="532" dy="16.9">réponse au bon PC.</tspan></text></svg>
