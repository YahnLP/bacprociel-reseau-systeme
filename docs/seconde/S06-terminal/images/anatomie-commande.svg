<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img"><title>Le terminal : dialoguer avec l'ordinateur par le texte</title><desc>Une commande, un résultat. Anatomie d'une commande : commande, option, argument.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="330" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">Anatomie d'une commande</tspan></text><rect x="40" y="60" width="780" height="80" rx="10" fill="#1e1e2e" stroke="#1e1e2e" stroke-width="2"/><text x="70" y="108" font-family="Consolas, Menlo, monospace" font-size="28" fill="#a6e3a1" text-anchor="start" font-weight="700"><tspan x="70" dy="0">ping  -n 4  192.168.1.1</tspan></text><line x1="115.0" y1="118" x2="115.0" y2="160" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><text x="115.0" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="115.0" dy="0">commande</tspan></text><line x1="225.0" y1="118" x2="225.0" y2="160" stroke="#00897b" stroke-width="3" stroke-linecap="round"/><text x="225.0" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0">option</tspan></text><line x1="385.0" y1="118" x2="385.0" y2="160" stroke="#3949ab" stroke-width="3" stroke-linecap="round"/><text x="385.0" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="385.0" dy="0">argument</tspan></text><text x="70" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="70" dy="0">commande : ce qu'on demande de faire</tspan></text><text x="70" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="70" dy="0">option   : comment le faire (ici : 4 fois seulement)</tspan></text><text x="70" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="70" dy="0">argument : sur quoi le faire (ici : la machine 192.168.1.1)</tspan></text></svg>
