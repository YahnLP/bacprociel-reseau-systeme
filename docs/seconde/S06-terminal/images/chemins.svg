<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img"><title>Chemins absolu et relatif</title><desc>Un arbre de dossiers : chemin absolu depuis la racine, chemin relatif depuis le dossier courant.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="360" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">Où suis-je ? (chemin absolu / relatif)</tspan></text><rect x="360" y="50" width="140" height="36" rx="8" fill="#3949ab" stroke="#3949ab" stroke-width="2"/><text x="430" y="74" font-family="Consolas, Menlo, monospace" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="430" dy="0">/home/eleve</tspan></text><line x1="430" y1="86" x2="190" y2="130" stroke="#90a4ae" stroke-width="2" stroke-linecap="round"/><rect x="130" y="130" width="120" height="36" rx="8" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="190" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="190" dy="0">Documents</tspan></text><line x1="430" y1="86" x2="440" y2="130" stroke="#90a4ae" stroke-width="2" stroke-linecap="round"/><rect x="380" y="130" width="120" height="36" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="3"/><text x="440" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="440" dy="0">Images</tspan></text><line x1="430" y1="86" x2="690" y2="130" stroke="#90a4ae" stroke-width="2" stroke-linecap="round"/><rect x="630" y="130" width="120" height="36" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="3"/><text x="690" y="154" font-fam