<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img"><title>Règles de sécurité du plateau technique</title><desc>Quatre règles : électricité, décharges électrostatiques, rangement, charte.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="300" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">4 règles pour travailler en sécurité</tspan></text><rect x="20" y="60" width="205" height="200" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="3"/><circle cx="122" cy="60" r="16" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="122" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="122" dy="0">1</tspan></text><text x="122" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="122" dy="0">Électricité</tspan></text><text x="122" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="122" dy="0">Je débranche le PC</tspan><tspan x="122" dy="17.5">(secteur) AVANT d'ouvrir.</tspan><tspan x="122" dy="17.5">Jamais les mains mouillées.</tspan></text><rect x="240" y="60" width="205" height="200" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><circle cx="342" cy="60" r="16" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="342" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="342" dy="0">2</tspan></text><text x="342" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="342" dy="0">Décharges (ESD)</tspan></text><text x="342" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="342" dy="0">Je touche le boîtier</tspan><tspan x="342" dy="17.5">métallique ou je mets</tspan><tspan x="342" dy="17.5">le bracelet antistatique.</tspan></text><rect x="460" y="60" width="205" height="200" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><circle cx="562" cy="60" r="16" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="562" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="562" dy="0">3</tspan></text><text x="562" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="562" dy="0">Rangement</tspan></text><text x="562" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="562" dy="0">Une zone de travail</tspan><tspan x="562" dy="17.5">rangée : pas de câble</tspan><tspan x="562" dy="17.5">qui traîne, pas de sac.</tspan></text><rect x="680" y="60" width="205" height="200" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="782" cy="60" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="782" y="65" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="782" dy="0">4</tspan></text><text x="782" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="782" dy="0">Charte informatique</tspan></text><text x="782" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="782" dy="0">Je n'installe rien sans</tspan><tspan x="782" dy="17.5">accord, je protège mon</tspan><tspan x="782" dy="17.5">mot de passe.</tspan></text></svg>
