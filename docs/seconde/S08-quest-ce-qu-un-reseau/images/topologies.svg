<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img"><title>Les quatre topologies</title><desc>Bus, anneau, étoile et maillé : quatre façons de relier des machines. L'étoile est celle utilisée aujourd'hui.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="980" height="330" fill="#ffffff" rx="10"/><text x="490.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0">Quatre façons de relier les machines</tspan></text><rect x="18" y="58" width="224" height="236" rx="12" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/><text x="130" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">Bus</tspan></text><text x="130" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="130" dy="0">un seul câble partagé</tspan></text><rect x="258" y="58" width="224" height="236" rx="12" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/><text x="370" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="370" dy="0">Anneau</tspan></text><text x="370" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="370" dy="0">chacun relié à deux voisins</tspan></text><rect x="498" y="58" width="224" height="236" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="610" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="610" dy="0">Étoile</tspan></text><text 