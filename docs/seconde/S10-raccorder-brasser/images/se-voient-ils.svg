<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img"><title>Deux PC reliés à un switch : se voient-ils ?</title><desc>Deux PC reliés à un switch non administrable, sans adresse IP configurée.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="300" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Branchés… mais se voient-ils ?</tspan></text><line x1="450" y1="120" x2="235" y2="195" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><line x1="450" y1="120" x2="665" y2="195" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><rect x="408" y="88" width="84" height="26" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="415.0" y="96" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="424.0" y="96" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="433.0" y="96" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="442.0" y="96" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="451.0" y="96" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="460.0" y="96" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="469.0" y="96" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="478.0" y="96" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="412" cy="92" r="2" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="450" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="450" dy="0">Switch</tspan></text><text x="450" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="450" dy="0">Switch</tspan></text><text x="450" y="150" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="400"><tspan x="450" dy="0">non administrable</tspan></text><text x="450" y="150" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="450" dy="0">non administrable</tspan></text><rect x="190" y="175" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="195" y="180" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="220" y1="215" x2="220" y2="225" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="202" y="223" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="220" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="220" dy="0">PC-1</tspan></text><rect x="650" y="175" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="655" y="180" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="680" y1="215" x2="680" y2="225" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="662" y="223" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="680" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="680" dy="0">PC-2</tspan></text><text x="450" y="285" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="450" dy="0">Les voyants sont verts : le « lien » est là. Mais « lien » ne veut pas dire « conversation ».</tspan></text></svg>
