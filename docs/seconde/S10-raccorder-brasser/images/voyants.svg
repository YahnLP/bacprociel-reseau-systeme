<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img"><title>Voyants d'un port réseau</title><desc>Voyant fixe : lien établi ; clignotant : activité ; éteint : pas de lien. La couleur indique souvent la vitesse.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="300" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Lire les voyants d'un port</tspan></text><rect x="15" y="60" width="210" height="215" rx="12" fill="#ffffff" stroke="#90a4ae" stroke-width="3"/><circle cx="120" cy="105" r="18" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="120" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="120" dy="0">Éteint</tspan></text><text x="120" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="120" dy="0">Pas de lien</tspan></text><text x="120" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="120" dy="0">câble absent / défectueux,</tspan><tspan x="120" dy="16.2">équipement éteint</tspan></text><rect x="237" y="60" width="210" height="215" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="342" cy="105" r="18" fill="#2e7d32" stroke="#2e7d32" stroke-width="3"/><text x="342" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="342" dy="0">Fixe</tspan></text><text x="342" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="342" dy="0">Lien établi</tspan></text><text x="342" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="342" dy="0">câble OK, les deux bouts se</tspan><tspan x="342" dy="16.2">voient</tspan></text><rect x="459" y="60" width="210" height="215" rx="12" fill="#ffffff" stroke="#f9a825" stroke-width="3"/><circle cx="564" cy="105" r="18" fill="#f9a825" stroke="#f9a825" stroke-width="3"/><text x="564" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#f9a825" text-anchor="middle" font-weight="700"><tspan x="564" dy="0">Clignote</tspan></text><text x="564" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="564" dy="0">Activité</tspan></text><text x="564" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="564" dy="0">des données circulent</tspan></text><rect x="681" y="60" width="210" height="215" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><circle cx="786" cy="105" r="18" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="786" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="786" dy="0">Couleur différente</tspan></text><text x="786" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="600"><tspan x="786" dy="0">Vitesse</tspan></text><text x="786" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="786" dy="0">ex. vert : 1000 Mb/s,</tspan><tspan x="786" dy="16.2">orange : 100 Mb/s (selon le</tspan><tspan x="786" dy="16.2">modèle)</tspan></text></svg>
