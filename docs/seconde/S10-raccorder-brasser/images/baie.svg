<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img"><title>Une baie de brassage</title><desc>Panneau de brassage au-dessus d'un switch, relié par des cordons courts ; prises murales numérotées.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="900" height="360" fill="#ffffff" rx="10"/><text x="450.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0">Brasser : relier une prise à un port du switch</tspan></text><rect x="40" y="55" width="460" height="285" rx="8" fill="#37474f" stroke="#263238" stroke-width="3"/><text x="60" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cfd8dc" text-anchor="start" font-weight="600"><tspan x="60" dy="0">Baie 19" (vue de face)</tspan></text><rect x="60" y="95" width="420" height="54" rx="3" fill="#eceff1" stroke="#455a64" stroke-width="2"/><rect x="72" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="84" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="84" dy="0">1</tspan></text><rect x="105" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="117" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="117" dy="0">2</tspan></text><rect x="138" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="150" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="150" dy="0">3</tspan></text><rect x="171" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="183" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="183" dy="0">4</tspan></text><rect x="204" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="216" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="216" dy="0">5</tspan></text><rect x="237" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="249" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="249" dy="0">6</tspan></text><rect x="270" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="282" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="282" dy="0">7</tspan></text><rect x="303" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="315" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="315" dy="0">8</tspan></text><rect x="336" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="348" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="348" dy="0">9</tspan></text><rect x="369" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="381" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="381" dy="0">10</tspan></text><rect x="402" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="414" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="414" dy="0">11</tspan></text><rect x="435" y="118" width="24" height="22" rx="2" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/><text x="447" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="447" dy="0">12</tspan></text><text x="70" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="70" dy="0"></tspan></text><rect x="60" y="250" width="420" height="62" rx="3" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/><rect x="72" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="84" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="84" dy="0">1</tspan></text><rect x="105" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="117" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="117" dy="0">2</tspan></text><rect x="138" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="150" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="150" dy="0">3</tspan></text><rect x="171" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="183" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="183" dy="0">4</tspan></text><rect x="204" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="216" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="216" dy="0">5</tspan></text><rect x="237" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="249" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="249" dy="0">6</tspan></text><rect x="270" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="282" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="282" dy="0">7</tspan></text><rect x="303" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="315" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="315" dy="0">8</tspan></text><rect x="336" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="348" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="348" dy="0">9</tspan></text><rect x="369" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="381" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="381" dy="0">10</tspan></text><rect x="402" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="414" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="414" dy="0">11</tspan></text><rect x="435" y="275" width="24" height="22" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><text x="447" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="447" dy="0">12</tspan></text><path d="M117,140 C117,190 150,200 150,275" fill="none" stroke="#e53935" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M216,140 C216,190 249,200 249,275" fill="none" stroke="#1e88e5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M315,140 C315,190 348,200 348,275" fill="none" stroke="#43a047" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#cfd8dc" text-anchor="end" font-weight="600"><tspan x="470" dy="0">cordons de brassage</tspan></text><text x="470" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#cfd8dc" text-anchor="end" font-weight="600"><tspan x="470" dy="0">switch</tspan></text><text x="470" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#cfd8dc" text-anchor="end" font-weight="600"><tspan x="470" dy="0">panneau de brassage</tspan></text><rect x="530" y="70" width="340" height="90.5" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="2"/><text x="542" y="92.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="542" dy="0">Panneau de brassage : l'arrière reçoit</tspan><tspan x="542" dy="18.1">les câbles des prises murales ; l'avant</tspan><tspan x="542" dy="18.1">offre des ports RJ45 propres et</tspan><tspan x="542" dy="18.1">numérotés.</tspan></text><rect x="530" y="170" width="340" height="72.375" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="542" y="192.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="542" dy="0">Un cordon relie le port du panneau au</tspan><tspan x="542" dy="18.1">port du switch. Changer de port = changer</tspan><tspan x="542" dy="18.1">de cordon, sans toucher au câble du mur.</tspan></text><rect x="530" y="265" width="340" height="72.375" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="542" y="287.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="542" dy="0">Étiqueter : « P12 » sur la prise murale =</tspan><tspan x="542" dy="18.1">« 12 » sur le panneau. Sans étiquette,</tspan><tspan x="542" dy="18.1">c'est la panne assurée.</tspan></text></svg>
