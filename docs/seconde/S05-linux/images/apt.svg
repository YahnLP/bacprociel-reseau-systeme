<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img"><title>apt : le magasin d'applications en ligne de commande</title><desc>Le gestionnaire de paquets apt télécharge les logiciels depuis un dépôt officiel et les installe.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="300" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">apt : un magasin d'applications officiel</tspan></text><rect x="40" y="70" width="200" height="110" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="140" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="140" dy="0">Dépôt officiel</tspan></text><text x="140" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="140" dy="0">(serveurs Debian/Ubuntu)</tspan><tspan x="140" dy="17.5">logiciels vérifiés</tspan></text><rect x="330" y="70" width="200" height="110" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="430" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="430" dy="0">apt</tspan></text><text x="430" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="430" dy="0">télécharge, installe,</tspan><tspan x="430" dy="17.5">met à jour</tspan></text><rect x="620" y="70" width="200" height="110" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="720" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="720" dy="0">Ton PC</tspan></text><text x="720" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="720" dy="0">logiciel installé</tspan><tspan x="720" dy="17.5">et à jour</tspan></text><line x1="242" y1="125" x2="328" y2="125" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="532" y1="125" x2="618" y2="125" stroke="#3a4270" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="40" y="225" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">sudo apt update      : « quoi de neuf dans le catalogue ? »</tspan></text><text x="40" y="252" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">sudo apt install vlc : installer un logiciel (ici VLC)</tspan></text><text x="40" y="279" font-family="Consolas, Menlo, monospace" font-size="15" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="40" dy="0">sudo apt upgrade     : mettre à jour ce qui est installé</tspan></text></svg>
