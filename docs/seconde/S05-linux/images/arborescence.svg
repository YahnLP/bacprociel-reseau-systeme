<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img"><title>L'arborescence Linux</title><desc>Tout part de la racine /. Dossiers principaux : home, etc, var, usr, bin, tmp.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="420" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">Linux : tout part de la racine  /</tspan></text><rect x="370" y="55" width="120" height="44" rx="10" fill="#3949ab" stroke="#3949ab" stroke-width="2"/><text x="430" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="430" dy="0">/  (racine)</tspan></text><line x1="430" y1="99" x2="80" y2="150" stroke="#90a4ae" stroke-width="2" stroke-linecap="round"/><rect x="25" y="150" width="110" height="40" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="3"/><text x="80" y="176" font-family="Consolas, Menlo, monospace" font-size="16" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="80" dy="0">/home</tspan></text><text x="80" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="80" dy="0">les dossiers</tspan><tspan x="80" dy="16.2">personnels</tspan></text><line x1="430" y1="99" x2="218" y2="150" stroke="#90a4ae" stroke-width="2" stroke-linecap="round"/><rect x="163" y="150" width="110" height="40" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="218" y="176" font-family="Consolas, Menlo, monospace" font-size="16" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="218" dy="0">/etc</tspan></text><text x="218" y="210" font-family="Segoe UI, Hel