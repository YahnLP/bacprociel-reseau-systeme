<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="860" height="390" role="img"><title>Le noyau Linux et ses distributions</title><desc>Un noyau commun, plusieurs distributions (Debian, Ubuntu, Mint, Kali...) et des appareils très variés.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="860" height="390" fill="#ffffff" rx="10"/><text x="430.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430.0" dy="0">Linux : un noyau, plein de « distributions »</tspan></text><line x1="430" y1="210" x2="130" y2="120" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="430" y1="210" x2="130" y2="300" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="430" y1="210" x2="730" y2="120" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="430" y1="210" x2="730" y2="300" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="430" y1="210" x2="430" y2="90" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><line x1="430" y1="210" x2="430" y2="340" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><circle cx="430" cy="210" r="62" fill="#fff3e0" stroke="#ef6c00" stroke-width="4"/><text x="430" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="430" dy="0">Noyau</tspan><tspan x="430" dy="23.8">Linux</tspan></text><rect x="45" y="92" width="170" height="56" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="130" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">Debian</tspan></text><text x="130" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="130" dy="0">stable, serveurs</tspan></text><rect x="45" y="272" width="170" height="56" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="130" y="297" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">Ubuntu</tspan></text><text x="130" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="130" dy="0">grand public</tspan></text><rect x="645" y="92" width="170" height="56" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="730" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="730" dy="0">Linux Mint</tspan></text><text x="730" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="730" dy="0">proche de Windows</tspan></text><rect x="645" y="272" width="170" height="56" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="730" y="297" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="730" dy="0">Kali Linux</tspan></text><text x="730" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="730" dy="0">cybersécurité</tspan></text><rect x="345" y="62" width="170" height="56" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="430" y="87" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="430" dy="0">