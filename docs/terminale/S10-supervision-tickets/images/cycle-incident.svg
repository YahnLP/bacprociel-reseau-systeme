<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"><title>De l'alerte à la clôture du ticket</title><desc>Un équipement tombe en panne, l'outil de supervision détecte et alerte, un ticket est ouvert, le technicien diagnostique, répare et clôture en notant la cause et l'action.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="440" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Du capteur au ticket : le cycle d'un incident</tspan></text><rect x="25" y="75" width="300" height="140" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><circle cx="59" cy="111" r="16" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="59" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="59" dy="0">1</tspan></text><text x="195" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="195" dy="0">Détecter</tspan></text><text x="175" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="175" dy="0">Le switch ne répond</tspan></text><text x="175" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="175" dy="0">plus (SNMP / ping)</tspan></text><rect x="345" y="75" width="300" height="140" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="379" cy="111" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="379" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="379" dy="0">2</tspan></text><text x="515" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="515" dy="0">Alerter</tspan></text><text x="495" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="495" dy="0">L'outil prévient :</tspan></text><text x="495" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="495" dy="0">e-mail, tableau de bord</tspan></text><rect x="665" y="75" width="300" height="140" rx="14" fill="#fffde7" stroke="#b28704" stroke-width="3"/><circle cx="699" cy="111" r="16" fill="#b28704" stroke="#ffffff" stroke-width="2"/><text x="699" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="699" dy="0">3</tspan></text><text x="835" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="835" dy="0">Ouvrir</tspan></text><text x="815" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="815" dy="0">un ticket :</tspan></text><text x="815" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="815" dy="0">symptôme, heure, lieu</tspan></text><rect x="25" y="240" width="300" height="140" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><circle cx="59" cy="276" r="16" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="59" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="59" dy="0">4</tspan></text><text x="195" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="195" dy="0">Diagnostiquer</tspan></text><text x="175" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="175" dy="0">hypothèses, tests,</tspan></text><text x="175" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="175" dy="0">cause trouvée</tspan></text><rect x="345" y="240" width="300" height="140" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="3"/><circle cx="379" cy="276" r="16" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="379" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="379" dy="0">5</tspan></text><text x="515" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="515" dy="0">Réparer</tspan></text><text x="495" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="495" dy="0">action menée,</tspan></text><text x="495" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="495" dy="0">retour à la normale</tspan></text><rect x="665" y="240" width="300" height="140" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><circle cx="699" cy="276" r="16" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="699" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="699" dy="0">6</tspan></text><text x="835" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="835" dy="0">Clôturer</tspan></text><text x="815" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="815" dy="0">ticket complété,</tspan></text><text x="815" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="815" dy="0">client prévenu</tspan></text><rect x="25" y="400" width="950" height="30" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/><text x="500" y="421" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Un ticket bien rempli = symptôme + cause + action : c'est la mémoire de l'entreprise.</tspan></text></svg>
