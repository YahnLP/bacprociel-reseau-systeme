<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"><title>Un chantier de 3 heures : répartir son temps</title><desc>Barre de temps de 3 heures : étudier 20 minutes, préparer 20, installer 40, configurer 50, tester et corriger 30, documenter et rédiger la recette 20.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="380" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">3 heures de chantier : le temps se prépare</tspan></text><rect x="30" y="90" width="100.44444444444444" height="110" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="80.22222222222223" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="80.22222222222223" dy="0">Étudier</tspan></text><text x="80.22222222222223" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="80.22222222222223" dy="0">20 min</tspan></text><text x="80.22222222222223" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="80.22222222222223" dy="0">dossier, besoins</tspan></text><rect x="134.44444444444446" y="90" width="100.44444444444444" height="110" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="184.66666666666669" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="184.66666666666669" dy="0">Préparer</tspan></text><text x="184.66666666666669" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="184.66666666666669" dy="0">20 min</tspan></text><text x="184.66666666666669" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="184.66666666666669" dy="0">matériel, plan</tspan></text><rect x="238.8888888888889" y="90" width="204.88888888888889" height="110" rx="10" fill="#fffde7" stroke="#b28704" stroke-width="3"/><text x="341.33333333333337" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="341.33333333333337" dy="0">Installer</tspan></text><text x="341.33333333333337" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#b28704" text-anchor="middle" font-weight="700"><tspan x="341.33333333333337" dy="0">40 min</tspan></text><text x="341.33333333333337" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="341.33333333333337" dy="0">câbles, étiquettes</tspan></text><rect x="447.7777777777778" y="90" width="257.1111111111111" height="110" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="576.3333333333334" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="576.3333333333334" dy="0">Configurer</tspan></text><text x="576.3333333333334" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="576.3333333333334" dy="0">50 min</tspan></text><text x="576.3333333333334" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="576.3333333333334" dy="0">VLAN, routage, Wi-Fi</tspan></text><rect x="708.8888888888889" y="90" width="152.66666666666666" height="110" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="785.2222222222223" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="785.2222222222223" dy="0">Tester</tspan></text><text x="785.2222222222223" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="785.2222222222223" dy="0">30 min</tspan></text><text x="785.2222222222223" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="785.2222222222223" dy="0">corriger</tspan></text><rect x="865.5555555555555" y="90" width="100.44444444444444" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="915.7777777777777" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="915.7777777777777" dy="0">Recette</tspan></text><text x="915.7777777777777" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="915.7777777777777" dy="0">20 min</tspan></text><text x="915.7777777777777" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="915.7777777777777" dy="0">documenter</tspan></text><text x="500" y="245" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Si une étape déborde, je le note et je passe à la suite : un chantier à 80 % documenté vaut mieux qu'un chantier à 100 % sans trace.</tspan></text><rect x="30" y="280" width="940" height="70" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">À chaque étape, je me demande : qu'est-ce que je dois PROUVER à l'évaluateur ?</tspan></text><text x="500" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Une capture d'écran, une commande de vérification, une ligne dans mon compte rendu.</tspan></text></svg>
