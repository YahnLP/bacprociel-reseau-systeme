<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Les six risques d'un chantier réseau</title><desc>Six cartes : électrique, hauteur, laser de la fibre optique, électricité statique, manutention et amiante ; pour chacune, le réflexe à avoir.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Six risques, six réflexes</tspan></text><rect x="30" y="75" width="300" height="170" rx="14" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="180" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">Électrique</tspan></text><text x="180" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">Je ne travaille pas</tspan></text><text x="180" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">sous tension. Je coupe,</tspan></text><text x="180" y="209" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">je vérifie, je signale.</tspan></text><rect x="350" y="75" width="300" height="170" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="500" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Hauteur</tspan></text><text x="500" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Escabeau en bon état,</tspan></text><text x="500" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">3 points d'appui,</tspan></text><text x="500" y="209" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">jamais seul sur un faux-plafond.</tspan></text><rect x="670" y="75" width="300" height="170" rx="14" fill="#fffde7" stroke="#b28704" stroke-width="3"/><text x="820" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#b28704" text-anchor="middle" font-weight="700"><tspan x="820" dy="0">Laser fibre</tspan></text><text x="820" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">Invisible mais dangereux :</tspan></text><text x="820" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">je ne regarde jamais</tspan></text><text x="820" y="209" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">un bout de fibre.</tspan></text><rect x="30" y="265" width="300" height="170" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="180" y="303" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">Statique (ESD)</tspan></text><text x="180" y="347" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">Bracelet antistatique,</tspan></text><text x="180" y="373" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">composants tenus</tspan></text><text x="180" y="399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">par les bords.</tspan></text><rect x="350" y="265" width="300" height="170" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="500" y="303" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Manutention</tspan></text><text x="500" y="347" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Charge lourde : je plie</tspan></text><text x="500" y="373" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">les genoux, je demande</tspan></text><text x="500" y="399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">de l'aide (UPS, baie).</tspan></text><rect x="670" y="265" width="300" height="170" rx="14" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="820" y="303" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="820" dy="0">Amiante</tspan></text><text x="820" y="347" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">Bâtiment ancien : pas de</tspan></text><text x="820" y="373" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">perçage sans diagnostic</tspan></text><text x="820" y="399" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">ni accord du client.</tspan></text></svg>
