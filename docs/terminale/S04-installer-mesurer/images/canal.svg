<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"><title>Le canal de transmission en cuivre</title><desc>Un canal complet va du poste au switch : cordon de brassage côté poste, liaison permanente jusqu'au panneau, cordon de brassage côté switch. Limite : 100 m au total dont 90 m de liaison permanente.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="380" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Canal = cordons + liaison permanente (100 m maximum)</tspan></text><rect x="20" y="110" width="110" height="70" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="75" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="75" dy="0">Poste</tspan></text><rect x="265" y="110" width="110" height="70" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="3"/><text x="320" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">Prise</tspan></text><rect x="625" y="110" width="110" height="70" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="3"/><text x="680" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="680" dy="0">Panneau</tspan></text><rect x="870" y="110" width="110" height="70" rx="10" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="925" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="925" dy="0">Switch</tspan></text><line x1="130" y1="145" x2="265" y2="145" stroke="#3a4270" stroke-width="4" stroke-linecap="round"/><text x="197.5" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="197.5" dy="0">cordon ≤ 5 m</tspan></text><line x1="375" y1="145" x2="625" y2="145" stroke="#00897b" stroke-width="6" stroke-linecap="round"/><text x="500.0" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">liaison permanente ≤ 90 m</tspan></text><line x1="735" y1="145" x2="870" y2="145" stroke="#3a4270" stroke-width="4" stroke-linecap="round"/><text x="802.5" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="802.5" dy="0">cordon ≤ 5 m</tspan></text><rect x="320" y="215" width="360" height="12" rx="6" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="500" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Liaison permanente : on la certifie (cartographie, longueur, atténuation, diaphonie)</tspan></text><rect x="75" y="215" width="245" height="12" rx="6" fill="#9fa8da" stroke="#9fa8da" stroke-width="0"/><rect x="680" y="215" width="245" height="12" rx="6" fill="#9fa8da" stroke="#9fa8da" stroke-width="0"/><rect x="40" y="285" width="920" height="70" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="60" y="313" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8a6d00" text-anchor="start" font-weight="700"><tspan x="60" dy="0">À retenir</tspan></text><text x="60" y="337" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Les cordons de brassage s'achètent ; la liaison permanente se pose et se mesure. Un défaut vient souvent du cordon, pas du câble posé.</tspan></text></svg>
