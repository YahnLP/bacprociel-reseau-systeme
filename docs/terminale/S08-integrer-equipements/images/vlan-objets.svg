<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img"><title>Un VLAN pour les objets connectés</title><desc>Les postes sont dans le VLAN 10. L'imprimante, le NAS, la caméra IP et la carte ESP32 sont dans un VLAN 40 dédié, relié au switch cœur qui route et peut filtrer.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="500" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Les objets connectés ont leur propre VLAN</tspan></text><rect x="458" y="218" width="84" height="26" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="465.0" y="226" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="474.0" y="226" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="483.0" y="226" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="492.0" y="226" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="501.0" y="226" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="510.0" y="226" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="519.0" y="226" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="528.0" y="226" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="462" cy="222" r="2" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="500" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">CORE (niveau 3)</tspan></text><text x="500" y="280" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">routage + passerelles</tspan></text><rect x="40" y="70" width="230" height="170" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="155" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="155" dy="0">VLAN 10 – POSTES</tspan></text><rect x="70" y="130" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="75" y="135" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="100" y1="170" x2="100" y2="180" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="82" y="178" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="100" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">PC-1</tspan></text><text x="100" y="222" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="100" dy="0">DHCP .50+</tspan></text><rect x="185" y="130" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="190" y="135" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="215" y1="170" x2="215" y2="180" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="197" y="178" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="215" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="215" dy="0">PC-2</tspan></text><text x="215" y="222" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="215" dy="0">DHCP .50+</tspan></text><rect x="330" y="320" width="640" height="150" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="650" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="650" dy="0">VLAN 40 – OBJETS  (adresses fixes, hors plage DHCP)</tspan></text><rect x="396" y="368" width="48" height="14" rx="2" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><rect x="388" y="380" width="64" height="26" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="400" y="396" width="40" height="16" rx="2" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><line x1="406" y1="402" x2="434" y2="402" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><circle cx="444" cy="388" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="420" y="431" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="420" dy="0">Imprimante</tspan></text><text x="420" y="448" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="420" dy="0">.20</tspan></text><rect x="562" y="358" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="571" cy="367.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="582" y1="367.5" x2="610" y2="367.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="562" y="380" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="571" cy="389.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="582" y1="389.5" x2="610" y2="389.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="562" y="402" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="571" cy="411.5" r="3" fill="#f9a825" stroke="#3949ab" stroke-width="1"/><line x1="582" y1="411.5" x2="610" y2="411.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><text x="590" y="445" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">NAS</tspan></text><text x="590" y="462" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="590" dy="0">.30</tspan></text><rect x="746" y="364" width="28" height="52" rx="6" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="750" y="370" width="20" height="36" rx="2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><circle cx="760" cy="411" r="2.5" fill="#ffffff" stroke="#3949ab" stroke-width="1.5"/><text x="760" y="435" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="760" dy="0">Caméra IP</tspan></text><text x="760" y="452" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="760" dy="0">.31 (PoE)</tspan></text><rect x="862" y="378" width="76" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><line x1="880" y1="378" x2="872" y2="362" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><line x1="920" y1="378" x2="928" y2="362" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="872" y="389" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="886" y="389" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="900" y="389" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="914" y="389" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><circle cx="930" cy="384" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="900" y="425" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="900" dy="0">ESP32</tspan></text><text x="900" y="442" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="900" dy="0">.40</tspan></text><line x1="270" y1="170" x2="450" y2="235" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><line x1="500" y1="292" x2="500" y2="320" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><rect x="740" y="80" width="230" height="150" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="752" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="752" dy="0">Pourquoi un VLAN à part ?</tspan></text><text x="752" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="752" dy="0">• on les filtre facilement</tspan></text><text x="752" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="752" dy="0">• une panne ou une attaque</tspan></text><text x="752" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="752" dy="0">ne gagne pas les postes</tspan></text><text x="752" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="752" dy="0">• adresses faciles à retenir</tspan></text></svg>
