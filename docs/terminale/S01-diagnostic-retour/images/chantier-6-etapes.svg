<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Un chantier en six étapes</title><desc>Du dossier à la recette : étudier, préparer, installer, configurer, tester et dépanner, rendre compte. Chaque étape laisse une trace écrite.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un chantier = six étapes, six traces écrites</tspan></text><rect x="30" y="80" width="146" height="180" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="103" cy="108" r="17" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="103" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="103" dy="0">1</tspan></text><text x="103" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="103" dy="0">Étudier</tspan></text><text x="103" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="103" dy="0">dossier, plans,</tspan></text><text x="103" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="103" dy="0">cahier des charges</tspan></text><rect x="73" y="222" width="60" height="26" rx="13" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="103" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="103" dy="0">C06</tspan></text><line x1="178" y1="170" x2="188" y2="170" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="188" y="80" width="146" height="180" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="261" cy="108" r="17" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="261" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="261" dy="0">2</tspan></text><text x="261" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="261" dy="0">Préparer</tspan></text><text x="261" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="261" dy="0">matériel, outillage,</tspan></text><text x="261" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="261" dy="0">sécurité, planning</tspan></text><rect x="231" y="222" width="60" height="26" rx="13" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="261" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="261" dy="0">C06</tspan></text><line x1="336" y1="170" x2="346" y2="170" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="346" y="80" width="146" height="180" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><circle cx="419" cy="108" r="17" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="419" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="419" dy="0">3</tspan></text><text x="419" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="419" dy="0">Installer</tspan></text><text x="419" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="419" dy="0">câbles, baie,</tspan></text><text x="419" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="419" dy="0">équipements</tspan></text><rect x="389" y="222" width="60" height="26" rx="13" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="419" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="419" dy="0">C09</tspan></text><line x1="494" y1="170" x2="504" y2="170" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="504" y="80" width="146" height="180" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><circle cx="577" cy="108" r="17" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="577" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="577" dy="0">4</tspan></text><text x="577" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="577" dy="0">Configurer</tspan></text><text x="577" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="577" dy="0">VLAN, routage,</tspan></text><text x="577" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="577" dy="0">services, Wi-Fi</tspan></text><rect x="547" y="222" width="60" height="26" rx="13" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="577" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="577" dy="0">C09</tspan></text><line x1="652" y1="170" x2="662" y2="170" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="662" y="80" width="146" height="180" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><circle cx="735" cy="108" r="17" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="735" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="735" dy="0">5</tspan></text><text x="735" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="735" dy="0">Tester</tspan></text><text x="735" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="735" dy="0">recette, dépannage,</tspan></text><text x="735" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="735" dy="0">sauvegardes</tspan></text><rect x="705" y="222" width="60" height="26" rx="13" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><text x="735" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="735" dy="0">C10</tspan></text><line x1="810" y1="170" x2="820" y2="170" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="820" y="80" width="146" height="180" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><circle cx="893" cy="108" r="17" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="893" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="893" dy="0">6</tspan></text><text x="893" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="893" dy="0">Rendre compte</tspan></text><text x="893" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="893" dy="0">compte rendu,</tspan></text><text x="893" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="893" dy="0">dossier, client</tspan></text><rect x="863" y="222" width="60" height="26" rx="13" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><text x="893" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="893" dy="0">C10</tspan></text><text x="500" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">À l'épreuve E31, tu es évalué sur ces trois compétences : C06 (préparer), C09 (installer, configurer), C10 (tester, dépanner).</tspan></text><text x="500" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">La grille nationale regarde ce que tu fais, ce que tu écris et comment tu le justifies.</tspan></text></svg>
