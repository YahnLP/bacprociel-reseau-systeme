<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img"><title>Le routeur sur un tronc : un seul câble, deux VLAN</title><desc>Le poste de la compta (VLAN 10) joint le serveur (VLAN 30). La trame monte vers le routeur étiquetée VLAN 10, le routeur la route et la renvoie sur le même câble étiquetée VLAN 30.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="480" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un seul câble entre le switch et le routeur : le trunk</tspan></text><rect x="462" y="96" width="76" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><line x1="480" y1="96" x2="472" y2="80" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><line x1="520" y1="96" x2="528" y2="80" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="472" y="107" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="486" y="107" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="500" y="107" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="514" y="107" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><circle cx="530" cy="102" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="500" y="143" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">R1</tspan></text><text x="500" y="160" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Gi0/0.10  192.168.10.1  /  Gi0/0.30  192.168.30.1</tspan></text><rect x="458" y="318" width="84" height="26" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="465.0" y="326" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="474.0" y="326" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="483.0" y="326" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="492.0" y="326" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="501.0" y="326" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="510.0" y="326" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="519.0" y="326" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="528.0" y="326" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="462" cy="322" r="2" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="500" y="363" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">SW1</tspan></text><text x="500" y="380" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">VLAN 10 et VLAN 30</tspan></text><rect x="100" y="300" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="105" y="305" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="130" y1="340" x2="130" y2="350" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="112" y="348" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="130" y="375" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">PC-CPT</tspan></text><text x="130" y="392" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="130" dy="0">VLAN 10 – 192.168.10.11</tspan></text><rect x="842" y="296" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="851" cy="305.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="862" y1="305.5" x2="890" y2="305.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="842" y="318" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="851" cy="327.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="862" y1="327.5" x2="890" y2="327.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="842" y="340" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="851" cy="349.5" r="3" fill="#f9a825" stroke="#3949ab" stroke-width="1"/><line x1="862" y1="349.5" x2="890" y2="349.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><text x="870" y="383" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">SRV</tspan></text><text x="870" y="400" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="870" dy="0">VLAN 30 – 192.168.30.10</tspan></text><rect x="470" y="175" width="60" height="120" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/><text x="500" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">trunk 802.1Q</tspan></text><line x1="485" y1="285" x2="485" y2="190" stroke="#3949ab" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="515" y1="190" x2="515" y2="285" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="455" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#3949ab" text-anchor="end" font-weight="700"><tspan x="455" dy="0">②</tspan></text><text x="545" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="545" dy="0">③</tspan></text><text x="440" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#3949ab" text-anchor="end" font-weight="700"><tspan x="440" dy="0">trame étiquetée</tspan></text><text x="440" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#3949ab" text-anchor="end" font-weight="700"><tspan x="440" dy="0">VLAN 10</tspan></text><text x="560" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="560" dy="0">trame étiquetée</tspan></text><text x="560" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="560" dy="0">VLAN 30</tspan></text><line x1="190" y1="345" x2="440" y2="345" stroke="#3949ab" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="315" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#3949ab" text-anchor="middle" font-weight="400"><tspan x="315" dy="0">① envoi (sans étiquette)</tspan></text><line x1="560" y1="345" x2="810" y2="345" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><text x="685" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="400"><tspan x="685" dy="0">④ arrivée</tspan></text><rect x="40" y="410" width="920" height="55" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/><text x="60" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Le routeur reçoit sur Gi0/0.10 (sous-interface du VLAN 10), décide, et renvoie par Gi0/0.30 : un seul port physique.</tspan></text><text x="60" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">Si le trunk tombe, ou si un VLAN n'est pas autorisé dessus, plus aucune communication entre VLAN.</tspan></text></svg>
