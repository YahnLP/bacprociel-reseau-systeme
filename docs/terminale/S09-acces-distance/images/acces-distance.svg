<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Trois façons d'entrer dans un réseau à distance</title><desc>Le SSH chiffre l'administration ; la redirection de port expose un service sur Internet ; le VPN crée un tunnel chiffré vers le réseau interne.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Trois façons d'accéder à distance, trois niveaux de risque</tspan></text><rect x="30" y="75" width="300" height="280" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="180" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">SSH</tspan></text><text x="180" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">Je me connecte à UN équipement</tspan></text><text x="180" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">(administration)</tspan></text><rect x="50" y="205" width="260" height="3" rx="1" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="180" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">Chiffré. Compte nominatif.</tspan></text><text x="180" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">Telnet = en clair : à bannir.</tspan></text><text x="180" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">Niveau de sécurité</tspan></text><rect x="120" y="335" width="34" height="10" rx="3" fill="#00897b" stroke="#00897b" stroke-width="1"/><rect x="160" y="335" width="34" height="10" rx="3" fill="#00897b" stroke="#00897b" stroke-width="1"/><rect x="200" y="335" width="34" height="10" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/><rect x="352" y="75" width="300" height="280" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="502" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="502" dy="0">Redirection de port</tspan></text><text x="502" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="502" dy="0">J'expose UN service sur Internet</tspan></text><text x="502" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="502" dy="0">(ex. site web port 8080)</tspan></text><rect x="372" y="205" width="260" height="3" rx="1" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><text x="502" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="502" dy="0">Visible de tout le monde.</tspan></text><text x="502" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="502" dy="0">Chaque port ouvert = un risque.</tspan></text><text x="502" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="502" dy="0">Niveau de sécurité</tspan></text><rect x="442" y="335" width="34" height="10" rx="3" fill="#ef6c00" stroke="#ef6c00" stroke-width="1"/><rect x="482" y="335" width="34" height="10" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/><rect x="522" y="335" width="34" height="10" rx="3" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/><rect x="674" y="75" width="300" height="280" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="824" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="824" dy="0">VPN</tspan></text><text x="824" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="824" dy="0">J'entre DANS le réseau interne</tspan></text><text x="824" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="824" dy="0">(tunnel chiffré)</tspan></text><rect x="694" y="205" width="260" height="3" rx="1" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="824" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="824" dy="0">Comme si j'étais au bureau.</tspan></text><text x="824" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="824" dy="0">Le plus sûr pour la télémaintenance.</tspan></text><text x="824" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="824" dy="0">Niveau de sécurité</tspan></text><rect x="764" y="335" width="34" height="10" rx="3" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="804" y="335" width="34" height="10" rx="3" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="844" y="335" width="34" height="10" rx="3" fill="#3949ab" stroke="#3949ab" stroke-width="1"/><rect x="30" y="385" width="940" height="62" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Règle de télémaintenance : un compte par technicien, une autorisation écrite du client,</tspan></text><text x="500" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">un accès limité dans le temps et une trace dans le journal.</tspan></text></svg>
