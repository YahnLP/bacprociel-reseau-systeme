<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"><title>Deux SSID, deux VLAN, un routeur qui filtre</title><desc>Le portable du personnel se connecte à GARCIA-PERSONNEL (VLAN 20), le portable invité à GARCIA-INVITES (VLAN 30). Le routeur relie les VLAN et l'ACL interdit aux invités d'aller vers le réseau interne.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="440" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un SSID = un VLAN = un réseau IP</tspan></text><rect x="62" y="102" width="56" height="36" rx="4" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="67" y="107" width="46" height="26" rx="2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><polygon points="54,138 126,138 120,148 60,148" fill="#eceff1" stroke="#3949ab" stroke-width="2" stroke-linejoin="round"/><text x="90" y="167" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="90" dy="0">Personnel</tspan></text><text x="90" y="184" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="90" dy="0">GARCIA-PERSONNEL</tspan></text><rect x="62" y="302" width="56" height="36" rx="4" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="67" y="307" width="46" height="26" rx="2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><polygon points="54,338 126,338 120,348 60,348" fill="#eceff1" stroke="#3949ab" stroke-width="2" stroke-linejoin="round"/><text x="90" y="367" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="