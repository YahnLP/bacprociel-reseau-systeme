<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img"><title>L'échelle des tests : du poste vers le serveur</title><desc>Six tests dans l'ordre : sa propre carte, son adresse, la passerelle, une adresse au-delà du routeur, le serveur, puis le nom. Le premier test qui échoue désigne la zone en cause.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="480" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">L'échelle des tests : on monte marche par marche</tspan></text><rect x="40" y="70" width="560" height="56" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/><circle cx="66" cy="98" r="14" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="66" y="103" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="66" dy="0">1</tspan></text><text x="92" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="92" dy="0">Mon câble / ma carte</tspan></text><text x="92" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="92" dy="0">voyant, ipconfig : lien actif ?</tspan></text><text x="615" y="103" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="615" dy="0">si KO : câble, port, carte</tspan></text><rect x="70" y="136" width="560" height="56" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/><circle cx="96" cy="164" r="14" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="96" y="169" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="96" dy="0">2</tspan></text><text x="122" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="122" dy="0">Mon adresse</tspan></text><text x="122" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="122" dy="0">ipconfig : 169.254 ? bon réseau ?</tspan></text><text x="645" y="169" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="645" dy="0">si KO : DHCP, VLAN, IP fixe</tspan></text><rect x="100" y="202" width="560" height="56" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="126" cy="230" r="14" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="126" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="126" dy="0">3</tspan></text><text x="152" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="152" dy="0">Ma passerelle</tspan></text><text x="152" y="246" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="152" dy="0">ping de la passerelle</tspan></text><text x="675" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="675" dy="0">si KO : VLAN, masque, passerelle</tspan></text><rect x="130" y="268" width="560" height="56" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="156" cy="296" r="14" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="156" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="156" dy="0">4</tspan></text><text x="182" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="182" dy="0">Un autre réseau</tspan></text><text x="182" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="182" dy="0">ping d'une adresse derrière le routeur</tspan></text><text x="705" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="705" dy="0">si KO : routage, sous-interface</tspan></text><rect x="160" y="334" width="560" height="56" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><circle cx="186" cy="362" r="14" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="186" y="367" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="186" dy="0">5</tspan></text><text x="212" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="212" dy="0">Le serveur (adresse)</tspan></text><text x="212" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="212" dy="0">ping + page par adresse IP</tspan></text><text x="735" y="367" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="735" dy="0">si KO : ACL, serveur</tspan></text><rect x="190" y="400" width="560" height="56" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><circle cx="216" cy="428" r="14" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="216" y="433" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="216" dy="0">6</tspan></text><text x="242" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="242" dy="0">Le serveur (nom)</tspan></text><text x="242" y="444" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="242" dy="0">page par son nom</tspan></text><text x="765" y="433" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="765" dy="0">si KO : DNS</tspan></text></svg>
