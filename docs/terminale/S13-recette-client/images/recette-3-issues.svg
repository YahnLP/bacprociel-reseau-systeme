<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Une recette : trois issues possibles</title><desc>Pour chaque test, le résultat obtenu est comparé à l'attendu. Conforme : le test est validé. Écart mineur : réserve avec date de levée. Écart bloquant : la réception est refusée tant qu'il n'est pas corrigé.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Recette : le résultat obtenu est comparé à l'attendu</tspan></text><rect x="30" y="70" width="250" height="110" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="155" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="155" dy="0">Test n° 7</tspan></text><text x="155" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="155" dy="0">Attendu : « les invités ne</tspan></text><text x="155" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="155" dy="0">joignent pas le serveur »</tspan></text><line x1="285" y1="125" x2="345" y2="125" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="315" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="315" dy="0">obtenu ?</tspan></text><rect x="360" y="70" width="610" height="95" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="385" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="385" dy="0">Conforme</tspan></text><text x="385" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="385" dy="0">obtenu = attendu</tspan></text><text x="385" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="385" dy="0">Test validé</tspan></text><rect x="360" y="175" width="610" height="95" rx="12" fill="#fffde7" stroke="#b28704" stroke-width="3"/><text x="385" y="211" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#b28704" text-anchor="start" font-weight="700"><tspan x="385" dy="0">Réserve</tspan></text><text x="385" y="237" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="385" dy="0">écart mineur, le client peut</tspan></text><text x="385" y="257" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="385" dy="0">utiliser l'installation</tspan></text><rect x="360" y="280" width="610" height="95" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="385" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="385" dy="0">Non conforme</tspan></text><text x="385" y="342" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="385" dy="0">écart bloquant : on ne</tspan></text><text x="385" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="385" dy="0">reçoit pas l'installation</tspan></text><text x="760" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="760" dy="0">→ on le note, on passe au suivant</tspan></text><text x="760" y="215" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="760" dy="0">→ réserve écrite, avec une date de levée</tspan></text><text x="760" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="760" dy="0">→ correction puis nouveau test</tspan></text><rect x="30" y="400" width="940" height="50" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="1.5"/><text x="500" y="431" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Le procès-verbal de réception liste les tests, les réserves et est signé par le client ET le prestataire.</tspan></text></svg>
