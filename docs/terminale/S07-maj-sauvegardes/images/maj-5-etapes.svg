<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img"><title>Mettre à jour sans risque : cinq étapes</title><desc>Sauvegarder, vérifier la compatibilité, mettre à jour, tester, puis garder le plan de retour arrière. La sauvegarde vient toujours avant la mise à jour.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="330" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Mettre à jour sans risque : toujours cinq étapes</tspan></text><rect x="30" y="75" width="175" height="160" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><circle cx="117" cy="103" r="16" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="117" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="117" dy="0">1</tspan></text><text x="117" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="117" dy="0">Sauvegarder</tspan></text><text x="117" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="117" dy="0">la configuration</tspan></text><text x="117" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="117" dy="0">et noter la version</tspan></text><line x1="207" y1="155" x2="220" y2="155" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="220" y="75" width="175" height="160" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><circle cx="307" cy="103" r="16" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="307" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="307" dy="0">2</tspan></text><text x="307" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="307" dy="0">Vérifier</tspan></text><text x="307" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="307" dy="0">la notice de la</tspan></text><text x="307" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="307" dy="0">nouvelle version</tspan></text><line x1="397" y1="155" x2="410" y2="155" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="410" y="75" width="175" height="160" rx="14" fill="#fffde7" stroke="#b28704" stroke-width="3"/><circle cx="497" cy="103" r="16" fill="#b28704" stroke="#ffffff" stroke-width="2"/><text x="497" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="497" dy="0">3</tspan></text><text x="497" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="497" dy="0">Prévenir</tspan></text><text x="497" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="497" dy="0">le client, choisir</tspan></text><text x="497" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="497" dy="0">un créneau calme</tspan></text><line x1="587" y1="155" x2="600" y2="155" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="600" y="75" width="175" height="160" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><circle cx="687" cy="103" r="16" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="687" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="687" dy="0">4</tspan></text><text x="687" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="687" dy="0">Mettre à jour</tspan></text><text x="687" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="687" dy="0">l'appareil et</tspan></text><text x="687" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="687" dy="0">le redémarrer</tspan></text><line x1="777" y1="155" x2="790" y2="155" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="790" y="75" width="175" height="160" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><circle cx="877" cy="103" r="16" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="877" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="877" dy="0">5</tspan></text><text x="877" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="877" dy="0">Tester</tspan></text><text x="877" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="877" dy="0">ou revenir en</tspan></text><text x="877" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="877" dy="0">arrière</tspan></text><rect x="30" y="262" width="940" height="44" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="500" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Règle d'or : si la sauvegarde n'est pas faite ET vérifiée, on ne met rien à jour.</tspan></text></svg>
