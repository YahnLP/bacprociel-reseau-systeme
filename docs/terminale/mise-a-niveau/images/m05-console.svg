<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"><title>La connexion console</title><desc>Un PC portable relié par un câble console USB vers RJ45 au port console du switch, avec les réglages du terminal.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="380" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Première configuration : par le câble console</tspan></text><rect x="102" y="182" width="56" height="36" rx="4" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="107" y="187" width="46" height="26" rx="2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><polygon points="94,218 166,218 160,228 100,228" fill="#eceff1" stroke="#3949ab" stroke-width="2" stroke-linejoin="round"/><text x="130" y="247" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">PC portable</tspan></text><text x="130" y="264" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="130" dy="0">terminal série</tspan></text><rect x="678" y="188" width="84" height="26" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="685.0" y="196" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="694.0" y="196" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="703.0" y="196" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="712.0" y="196" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="721.0" y="196" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="730.0" y="196" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="739.0" y="196" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="748.0" y="196" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="682" cy="192" r="2" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="720" y="233" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="720" dy="0">OmniSwitch</tspan></text><rect x="770" y="96" width="90" height="34" rx="4" fill="#eceff1" stroke="#455a64" stroke-width="2"/><text x="815" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#455a64" text-anchor="middle" font-weight="700"><tspan x="815" dy="0">CONSOLE</tspan></text><path d="M165,225 C300,300 640,300 780,134" fill="none" stroke="#00acc1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M165,225 C300,300 640,300 780,134" fill="none" stroke="#e0f7fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00838f" text-anchor="middle" font-weight="700"><tspan x="430" dy="0">câble console (USB → RJ45)</tspan></text><rect x="70" y="70" width="330" height="90" rx="8" fill="#1e1e1e" stroke="#37474f" stroke-width="3"/><text x="86" y="98" font-family="Consolas, Menlo, monospace" font-size="13" fill="#80cbc4" text-anchor="start" font-weight="700"><tspan x="86" dy="0">Terminal série (PuTTY…)</tspan></text><text x="86" y="120" font-family="Consolas, Menlo, monospace" font-size="13" fill="#fff59d" text-anchor="start" font-weight="400"><tspan x="86" dy="0">Vitesse : 9600 bauds</tspan></text><text x="86" y="140" font-family="Consolas, Menlo, monospace" font-size="13" fill="#fff59d" text-anchor="start" font-weight="400"><tspan x="86" dy="0">8 bits · pas de parité · 1 arrêt</tspan></text><rect x="440" y="70" width="300" height="90" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="590" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">Pourquoi la console ?</tspan></text><text x="590" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="590" dy="0">Elle marche même sans réseau</tspan></text><text x="590" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="590" dy="0">ni adresse IP : accès de secours.</tspan></text></svg>
