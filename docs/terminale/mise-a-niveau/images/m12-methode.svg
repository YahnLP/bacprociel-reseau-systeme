<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img"><title>La méthode de dépannage en huit étapes</title><desc>Huit étapes enchaînées : constater, délimiter, hypothèses, tester, corriger, vérifier, prévenir, consigner.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="430" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Dépanner : huit étapes, dans l'ordre</tspan></text><rect x="30" y="70" width="224" height="150" rx="14" fill="#ffffff" stroke="#3949ab" stroke-width="3.5"/><circle cx="60" cy="100" r="17" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="60" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">1</tspan></text><text x="155" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="155" dy="0">Constater</tspan></text><text x="142" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="142" dy="0">symptôme exact,</tspan></text><text x="142" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="142" dy="0">qui est touché ?</tspan></text><line x1="256" y1="145" x2="266" y2="145" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="268" y="70" width="224" height="150" rx="14" fill="#ffffff" stroke="#3949ab" stroke-width="3.5"/><circle cx="298" cy="100" r="17" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="298" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="298" dy="0">2</tspan></text><text x="393" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="393" dy="0">Délimiter</tspan></text><text x="380" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="380" dy="0">ce qui marche</tspan></text><text x="380" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="380" dy="0">encore</tspan></text><line x1="494" y1="145" x2="504" y2="145" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="506" y="70" width="224" height="150" rx="14" fill="#ffffff" stroke="#00897b" stroke-width="3.5"/><circle cx="536" cy="100" r="17" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="536" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="536" dy="0">3</tspan></text><text x="631" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="631" dy="0">Hypothèses</tspan></text><text x="618" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="618" dy="0">causes possibles,</tspan></text><text x="618" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="618" dy="0">ordonnées</tspan></text><line x1="732" y1="145" x2="742" y2="145" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="744" y="70" width="224" height="150" rx="14" fill="#ffffff" stroke="#00897b" stroke-width="3.5"/><circle cx="774" cy="100" r="17" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="774" y="105" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="774" dy="0">4</tspan></text><text x="869" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="869" dy="0">Tester</tspan></text><text x="856" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="856" dy="0">un test</tspan></text><text x="856" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="856" dy="0">par hypothèse</tspan></text><rect x="30" y="240" width="224" height="150" rx="14" fill="#ffffff" stroke="#ef6c00" stroke-width="3.5"/><circle cx="60" cy="270" r="17" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="60" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">5</tspan></text><text x="155" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="155" dy="0">Corriger</tspan></text><text x="142" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="142" dy="0">UNE seule</tspan></text><text x="142" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="142" dy="0">modification</tspan></text><line x1="256" y1="315" x2="266" y2="315" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="268" y="240" width="224" height="150" rx="14" fill="#ffffff" stroke="#ef6c00" stroke-width="3.5"/><circle cx="298" cy="270" r="17" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="298" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="298" dy="0">6</tspan></text><text x="393" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="393" dy="0">Vérifier</tspan></text><text x="380" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="380" dy="0">la panne a-t-elle</tspan></text><text x="380" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="380" dy="0">disparu ?</tspan></text><line x1="494" y1="315" x2="504" y2="315" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="506" y="240" width="224" height="150" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="3.5"/><circle cx="536" cy="270" r="17" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="536" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="536" dy="0">7</tspan></text><text x="631" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="631" dy="0">Prévenir</tspan></text><text x="618" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="618" dy="0">pour que ça</tspan></text><text x="618" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="618" dy="0">ne revienne pas</tspan></text><line x1="732" y1="315" x2="742" y2="315" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="744" y="240" width="224" height="150" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="3.5"/><circle cx="774" cy="270" r="17" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="774" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="774" dy="0">8</tspan></text><text x="869" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="869" dy="0">Consigner</tspan></text><text x="856" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="856" dy="0">fiche, journal,</tspan></text><text x="856" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="856" dy="0">compte rendu</tspan></text><path d="M940,222 C960,250 40,250 36,300" fill="none" stroke="#90a4ae" stroke-width="0.1" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">On s'arrête à l'étape 4 tant qu'on n'a pas de cause prouvée : on ne « corrige » pas au hasard.</tspan></text></svg>
