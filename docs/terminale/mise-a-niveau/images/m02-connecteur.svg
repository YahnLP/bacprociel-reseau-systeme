<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Le connecteur RJ45 vu de face</title><desc>Un connecteur RJ45, ergot vers le bas, contacts vers l'observateur : la broche 1 est à gauche, la broche 8 à droite.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Sens de lecture d'un connecteur RJ45</tspan></text><rect x="330" y="80" width="340" height="190" rx="10" fill="#e3f2fd" stroke="#37474f" stroke-width="4"/><rect x="350" y="100" width="300" height="70" rx="4" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/><rect x="360" y="108" width="22" height="56" rx="2" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/><circle cx="371" cy="200" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="371" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="371" dy="0">1</tspan></text><rect x="396" y="108" width="22" height="56" rx="2" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/><circle cx="407" cy="200" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="407" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="407" dy="0">2</tspan></text><rect x="432" y="108" width="22" height="56" rx="2" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/><circle cx="443" cy="200" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="443" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="443" dy="0">3</tspan></text><rect x="468" y="108" width="22" height="56" rx="2" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/><circle cx="479" cy="200" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="479" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="479" dy="0">4</tspan></text><rect x="504" y="108" width="22" height="56" rx="2" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/><circle cx="515" cy="200" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="515" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="515" dy="0">5</tspan></text><rect x="540" y="108" width="22" height="56" rx="2" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/><circle cx="551" cy="200" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="551" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="551" dy="0">6</tspan></text><rect x="576" y="108" width="22" height="56" rx="2" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/><circle cx="587" cy="200" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="587" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="587" dy="0">7</tspan></text><rect x="612" y="108" width="22" height="56" rx="2" fill="#ffd54f" stroke="#b8860b" stroke-width="1.5"/><circle cx="623" cy="200" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="623" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="623" dy="0">8</tspan></text><rect x="440" y="262" width="120" height="26" rx="4" fill="#e3f2fd" stroke="#37474f" stroke-width="3"/><text x="500" y="281" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">ergot</tspan></text><line x1="250" y1="135" x2="330" y2="135" stroke="#c62828" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="230" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="end" font-weight="700"><tspan x="230" dy="0">broche 1</tspan></text><text x="230" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="end" font-weight="400"><tspan x="230" dy="0">(à gauche)</tspan></text><line x1="750" y1="135" x2="672" y2="135" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="770" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="770" dy="0">broche 8</tspan></text><text x="770" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="start" font-weight="400"><tspan x="770" dy="0">(à droite)</tspan></text><text x="500" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Tiens le connecteur avec les contacts dorés tournés vers toi et l'ergot vers le bas.</tspan></text><text x="500" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Câble : le fil 1 (blanc/orange) va dans la fente de gauche.</tspan></text></svg>
