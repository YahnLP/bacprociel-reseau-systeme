<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"><title>Les niveaux de sécurité du Wi-Fi</title><desc>Un escalier de sécurité : ouvert, WEP, WPA2-Personnel, WPA3, WPA2 ou WPA3 Entreprise, avec un verdict pour chacun.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="420" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">La sécurité du Wi-Fi : de « à bannir » à « entreprise »</tspan></text><rect x="30" y="60" width="940" height="56" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="3"/><rect x="30" y="60" width="190" height="56" rx="10" fill="#c62828" stroke="#c62828" stroke-width="0"/><rect x="200" y="60" width="20" height="56" rx="0" fill="#c62828" stroke="#c62828" stroke-width="0"/><text x="125" y="94" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="125" dy="0">Ouvert</tspan></text><text x="240" y="85" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="240" dy="0">aucun chiffrement</tspan></text><text x="240" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="240" dy="0">Verdict : à éviter</tspan></text><rect x="60" y="126" width="910" height="56" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="3"/><rect x="60" y="126" width="190" height="56" rx="10" fill="#c62828" stroke="#c62828" stroke-width="0"/><rect x="230" y="126" width="20" height="56" rx="0" fill="#c62828" stroke="#c62828" stroke-width="0"/><text x="155" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="155" dy="0">WEP</tspan></text><text x="270" y="151" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="270" dy="0">cassé depuis 20 ans</tspan></text><text x="270" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="270" dy="0">Verdict : jamais</tspan></text><rect x="90" y="192" width="880" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><rect x="90" y="192" width="190" height="56" rx="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><rect x="260" y="192" width="20" height="56" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="185" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="185" dy="0">WPA2-Personnel</tspan></text><text x="300" y="217" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="300" dy="0">chiffrement AES, une clé partagée (PSK)</tspan></text><text x="300" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="300" dy="0">Verdict : bon pour un petit cabinet</tspan></text><rect x="120" y="258" width="850" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><rect x="120" y="258" width="190" height="56" rx="10" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><rect x="290" y="258" width="20" height="56" rx="0" fill="#2e7d32" stroke="#2e7d32" stroke-width="0"/><text x="215" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="215" dy="0">WPA3-Personnel</tspan></text><text x="330" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="330" dy="0">plus récent, plus robuste</tspan></text><text x="330" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="330" dy="0">Verdict : si les appareils le gèrent</tspan></text><rect x="150" y="324" width="820" height="56" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><rect x="150" y="324" width="190" height="56" rx="10" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><rect x="320" y="324" width="20" height="56" rx="0" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="245" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="245" dy="0">WPA2/3-Entreprise</tspan></text><text x="360" y="349" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="360" dy="0">un compte par utilisateur (RADIUS)</tspan></text><text x="360" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="360" dy="0">Verdict : pour les grandes structures</tspan></text><text x="500" y="405" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Une clé WPA2 doit être longue (12 caractères et plus) et changée quand une personne quitte le cabinet.</tspan></text></svg>
