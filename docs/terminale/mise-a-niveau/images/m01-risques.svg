:</tspan></text><text x="772" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="772" dy="0">ne pas les lire</tspan></text><text x="500" y="385" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Règle d'or : on réfléchit, on prévient, puis on intervient.</tspan></text></svg>
