<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Six risques d'un chantier réseau</title><desc>Six cartes : risque électrique, coupure, chute de hauteur, câbles au sol, coupure de service et données du client.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Avant de toucher au matériel : six risques à connaître</tspan></text><rect x="30" y="62" width="304" height="136" rx="12" fill="#ffffff" stroke="#c62828" stroke-width="3"/><rect x="30" y="62" width="92" height="136" rx="12" fill="#c62828" stroke="#c62828" stroke-width="0"/><rect x="110" y="62" width="12" height="136" rx="0" fill="#c62828" stroke="#c62828" stroke-width="0"/><polygon points="82,100 62,134 75,134 68,160 92,122 78,122" fill="#f9a825" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><text x="136" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="136" dy="0">Électrique</tspan></text><text x="136" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="136" dy="0">câble abîmé,</tspan></text><text x="136" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="136" dy="0">multiprise surchargée</tspan></text><rect x="348" y="62" width="304" height="136" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><rect x="348" y="62" width="92" height="136" rx="12" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><rect x="428" y="62