<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"><title>L'emballage des données</title><desc>Les données sont enveloppées par un en-tête de transport, puis un en-tête IP, puis un en-tête Ethernet avec adresses MAC.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="420" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Chaque couche ajoute son enveloppe (encapsulation)</tspan></text><rect x="330" y="70" width="340" height="56" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="500" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">DONNÉES (ex. : demande de page web)</tspan></text><rect x="230" y="150" width="540" height="56" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="230" y="150" width="100" height="56" rx="8" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="280" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="280" dy="0">port 443</tspan></text><text x="550" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="550" dy="0">DONNÉES</tspan></text><rect x="130" y="230" width="740" height="56" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><rect x="130" y="230" width="200" height="56" rx="8" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><text x="230" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="230" dy="0">IP source 192.168.10.25</tspan></text><text x="230" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="230" dy="0">IP dest. 203.0.113.10</tspan></text><text x="600" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="600" dy="0">port + DONNÉES</tspan></text><rect x="30" y="310" width="940" height="56" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3"/><rect x="30" y="310" width="260" height="56" rx="8" fill="#8e24aa" stroke="#8e24aa" stroke-width="0"/><text x="160" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="160" dy="0">MAC source : 00:D0:95:12:34:56</tspan></text><text x="160" y="353" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="160" dy="0">MAC dest. : (la passerelle)</tspan></text><text x="630" y="344" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#8e24aa" text-anchor="middle" font-weight="700"><tspan x="630" dy="0">IP + port + DONNÉES</tspan></text><text x="320" y="103" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="320" dy="0"></tspan></text><text x="220" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="220" dy="0"></tspan></text><text x="120" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="120" dy="0"></tspan></text><text x="120" y="343" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="120" dy="0"></tspan></text><text x="30" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="30" dy="0">Application</tspan></text><text x="30" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00897b" text-anchor="start" font-weight="700"><tspan x="30" dy="0">Transport</tspan></text><text x="30" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ef6c00" text-anchor="start" font-weight="700"><tspan x="30" dy="0">Réseau</tspan></text><text x="500" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">L'ensemble est une « trame » : ce qui circule réellement sur le câble. Chaque équipement lit la couche qui le concerne.</tspan></text></svg>
