<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"><title>Préparer avant d'intervenir</title><desc>Quatre étapes de préparation : comprendre, lister, planifier, prévoir, qui produisent reformulation, matériel, planning, risques et plan de tests.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="380" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Avant de toucher au matériel : quatre étapes de préparation</tspan></text><rect x="30" y="70" width="224" height="230" rx="14" fill="#ffffff" stroke="#3949ab" stroke-width="3.5"/><rect x="30" y="70" width="224" height="44" rx="14" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><rect x="30" y="96" width="224" height="18" rx="0" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="142" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="142" dy="0">1  Comprendre</tspan></text><text x="142" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="142" dy="0">Que veut le client ?</tspan></text><text x="142" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="142" dy="0">Quelles contraintes ?</tspan></text><rect x="44" y="206" width="196" height="76" rx="10" fill="#3949ab" stroke="#3949ab" stroke-width="0" opacity="0.12"/><text x="142" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="142" dy="0">→ reformulation</tspan></text><text x="142" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="142" dy="0">→ exigences</tspan></text><line x1="256" y1="185" x2="266" y2="185" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="268" y="70" width="224" height="230" rx="14" fill="#ffffff" stroke="#00897b" stroke-width="3.5"/><rect x="268" y="70" width="224" height="44" rx="14" fill="#00897b" stroke="#00897b" stroke-width="0"/><rect x="268" y="96" width="224" height="18" rx="0" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="380" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="380" dy="0">2  Lister</tspan></text><text x="380" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="380" dy="0">De quoi ai-je besoin ?</tspan></text><rect x="282" y="206" width="196" height="76" rx="10" fill="#00897b" stroke="#00897b" stroke-width="0" opacity="0.12"/><text x="380" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="380" dy="0">→ matériel, outillage</tspan></text><text x="380" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="380" dy="0">→ longueur de câble</tspan></text><line x1="494" y1="185" x2="504" y2="185" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="506" y="70" width="224" height="230" rx="14" fill="#ffffff" stroke="#ef6c00" stroke-width="3.5"/><rect x="506" y="70" width="224" height="44" rx="14" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><rect x="506" y="96" width="224" height="18" rx="0" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><text x="618" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="618" dy="0">3  Planifier</tspan></text><text x="618" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="618" dy="0">Dans quel ordre ?</tspan></text><text x="618" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="618" dy="0">Combien de temps ?</tspan></text><rect x="520" y="206" width="196" height="76" rx="10" fill="#ef6c00" stroke="#ef6c00" stroke-width="0" opacity="0.12"/><text x="618" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="618" dy="0">→ planning</tspan></text><text x="618" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="618" dy="0">de tâches</tspan></text><line x1="732" y1="185" x2="742" y2="185" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="744" y="70" width="224" height="230" rx="14" fill="#ffffff" stroke="#8e24aa" stroke-width="3.5"/><rect x="744" y="70" width="224" height="44" rx="14" fill="#8e24aa" stroke="#8e24aa" stroke-width="0"/><rect x="744" y="96" width="224" height="18" rx="0" fill="#8e24aa" stroke="#8e24aa" stroke-width="0"/><text x="856" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="856" dy="0">4  Prévoir</tspan></text><text x="856" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="856" dy="0">Qu'est-ce qui peut</tspan></text><text x="856" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="856" dy="0">mal tourner ?</tspan></text><rect x="758" y="206" width="196" height="76" rx="10" fill="#8e24aa" stroke="#8e24aa" stroke-width="0" opacity="0.12"/><text x="856" y="234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8e24aa" text-anchor="middle" font-weight="700"><tspan x="856" dy="0">→ risques</tspan></text><text x="856" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8e24aa" text-anchor="middle" font-weight="700"><tspan x="856" dy="0">→ plan de tests</tspan></text><rect x="30" y="322" width="940" height="40" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="347" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Ordre logique d'une intervention : câbler → tester la liaison → brasser → configurer → tester → sauvegarder → consigner.</tspan></text></svg>
