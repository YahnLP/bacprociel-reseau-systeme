<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"><title>Isoler le Wi-Fi des patients</title><desc>Un patient en VLAN 20 peut accéder à Internet via la box mais le filtrage du switch bloque l'accès au réseau interne 192.168.10.0/24 : serveur, imprimante, postes.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="440" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Ce que le patient peut faire, et ce qui est bloqué</tspan></text><rect x="96" y="192" width="28" height="52" rx="6" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="100" y="198" width="20" height="36" rx="2" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><circle cx="110" cy="239" r="2.5" fill="#ffffff" stroke="#3949ab" stroke-width="1.5"/><text x="110" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="110" dy="0">Patient</tspan></text><text x="110" y="280" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="110" dy="0">VLAN 20</tspan></text><rect x="330" y="150" width="160" height="150" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="4"/><text x="410" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="410" dy="0">SWITCH</tspan></text><text x="410" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="410" dy="0">règle de filtrage</tspan></text><text x="410" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="410" dy="0">VLAN 20 → 192.168.10.0/24</tspan></text><text x="410" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="410" dy="0">= REFUSER</tspan></text><line x1="150" y1="220" x2="328" y2="220" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><rect x="630" y="80" width="340" height="120" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><rect x="662" y="126" width="76" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><line x1="680" y1="126" x2="672" y2="110" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><line x1="720" y1="126" x2="728" y2="110" stroke="#ef6c00" stroke-width="3" stroke-linecap="round"/><rect x="672" y="137" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="686" y="137" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="700" y="137" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><rect x="714" y="137" width="10" height="9" rx="1" fill="#ffffff" stroke="#ef6c00" stroke-width="1.5"/><circle cx="730" cy="132" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="700" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="700" dy="0">Box</tspan></text><path d="M840,154 a18,18 0 0 1 4,-35 a24,24 0 0 1 46,-6 a20,20 0 0 1 24,26 a14,14 0 0 1 -6,15 z" fill="#e8eaf6" stroke="#9fa8da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="880" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="880" dy="0">Internet</tspan></text><line x1="738" y1="140" x2="830" y2="140" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><line x1="490" y1="190" x2="630" y2="150" stroke="#2e7d32" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><path d="M552.3,145 L558.35,151.6 L568.8,138.4" fill="none" stroke="#2e7d32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">AUTORISÉ</tspan></text><rect x="630" y="240" width="340" height="160" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3"/><text x="800" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">Réseau interne 192.168.10.0/24</tspan></text><rect x="672" y="286" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="681" cy="295.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="692" y1="295.5" x2="720" y2="295.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="672" y="308" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="681" cy="317.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="692" y1="317.5" x2="720" y2="317.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="672" y="330" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="681" cy="339.5" r="3" fill="#f9a825" stroke="#3949ab" stroke-width="1"/><line x1="692" y1="339.5" x2="720" y2="339.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><text x="700" y="373" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="700" dy="0">Serveur</tspan></text><rect x="776" y="296" width="48" height="14" rx="2" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><rect x="768" y="308" width="64" height="26" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="780" y="324" width="40" height="16" rx="2" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><line x1="786" y1="330" x2="814" y2="330" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><circle cx="824" cy="316" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="800" y="359" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="800" dy="0">Imprimante</tspan></text><rect x="870" y="290" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="875" y="295" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="900" y1="330" x2="900" y2="340" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="882" y="338" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="900" y="365" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="900" dy="0">Postes</tspan></text><line x1="490" y1="260" x2="630" y2="300" stroke="#c62828" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="553.4" y1="273.4" x2="566.6" y2="286.6" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><line x1="566.6" y1="273.4" x2="553.4" y2="286.6" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><text x="560" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">BLOQUÉ</tspan></text><rect x="40" y="395" width="940" height="36" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Deux tests prouvent la sécurité : Internet OK (test positif) ET réseau interne refusé (test négatif).</tspan></text></svg>
