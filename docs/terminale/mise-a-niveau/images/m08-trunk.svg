<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Le trunk 802.1Q</title><desc>Un câble unique entre le switch et la borne Wi-Fi, qui transporte deux VLAN grâce à une étiquette 802.1Q dans chaque trame, et la structure d'une trame étiquetée.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Le trunk : plusieurs VLAN sur un seul câble</tspan></text><rect x="108" y="148" width="84" height="26" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="115.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="124.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="133.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="142.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="151.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="160.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="169.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="178.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="112" cy="152" r="2" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="150" y="193" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="150" dy="0">Switch</tspan></text><text x="150" y="210" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="150" dy="0">port 1/9</tspan></text><rect x="820" y="162" width="60" height="14" rx="7" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><path d="M840,158 A10,10 0 0 1 860,158" fill="none" stroke="#00897b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M832,158 A18,18 0 0 1 868,158" fill="none" stroke="#00897b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M824,158 A26,26 0 0 1 876,158" fill="none" stroke="#00897b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="850" cy="158" r="2.5" fill="#00897b" stroke="#00897b" stroke-width="1"/><text x="850" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="850" dy="0">Borne Wi-Fi</tspan></text><line x1="195" y1="160" x2="805" y2="160" stroke="#3a4270" stroke-width="8" stroke-linecap="round"/><rect x="260" y="128" width="120" height="28" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="320" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">VLAN 10</tspan></text><rect x="430" y="128" width="150" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="505" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="505" dy="0">VLAN 20 · étiq. 20</tspan></text><rect x="620" y="128" width="120" height="28" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/><text x="680" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="680" dy="0">VLAN 20</tspan></text><text x="500" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">un seul câble, deux réseaux : chaque trame du VLAN 20 porte une étiquette avec son numéro</tspan></text><text x="500" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Une trame Ethernet ÉTIQUETÉE (802.1Q)</tspan></text><rect x="50" y="268" width="146" height="70" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="2.5"/><text x="123.0" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="123.0" dy="0">MAC</tspan></text><text x="123.0" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="123.0" dy="0">destination</tspan></text><rect x="200" y="268" width="146" height="70" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="2.5"/><text x="273.0" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="273.0" dy="0">MAC</tspan></text><text x="273.0" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="273.0" dy="0">source</tspan></text><rect x="350" y="268" width="216" height="70" rx="6" fill="#ef6c00" stroke="#ef6c00" stroke-width="2.5"/><text x="458.0" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0">ÉTIQUETTE 802.1Q</tspan></text><text x="458.0" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="458.0" dy="0">VLAN = 20</tspan></text><rect x="570" y="268" width="76" height="70" rx="6" fill="#eceff1" stroke="#90a4ae" stroke-width="2.5"/><text x="608.0" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="608.0" dy="0">type</tspan></text><rect x="650" y="268" width="216" height="70" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><text x="758.0" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="758.0" dy="0">données</tspan></text><rect x="60" y="370" width="880" height="76" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Port d'accès (non étiqueté) : un seul VLAN, l'équipement ignore les VLAN.</tspan></text><text x="500" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Port trunk (étiqueté) : plusieurs VLAN, chacun marqué de son numéro.</tspan></text><text x="500" y="438" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Un VLAN peut rester non étiqueté sur un trunk : on l'appelle le VLAN natif (ici le VLAN 10).</tspan></text></svg>
