<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Avec et sans VLAN : la diffusion</title><desc>À gauche sans VLAN la diffusion d'un poste atteint tous les ports. À droite avec deux VLAN elle reste dans son VLAN.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">La diffusion (broadcast) : avant et après les VLAN</tspan></text><rect x="30" y="56" width="450" height="330" rx="14" fill="#ffffff" stroke="#90a4ae" stroke-width="3"/><text x="255" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="255" dy="0">SANS VLAN : tout le monde reçoit</tspan></text><rect x="190" y="150" width="130" height="50" rx="8" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="255" y="181" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="255" dy="0">switch</tspan></text><line x1="255" y1="150" x2="112" y2="120" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/><line x1="255" y1="200" x2="112" y2="270" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/><line x1="255" y1="150" x2="398" y2="120" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/><line x1="255" y1="200" x2="398" y2="270" stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round"/><rect x="60" y="90" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="65" y="95" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="90" y1="130" x2="90" y2="140"