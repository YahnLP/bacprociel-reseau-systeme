<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Working et certified</title><desc>Les commandes modifient la configuration en cours en mémoire vive ; write memory l'écrit dans working ; copy working certified la certifie, et elle est relue au démarrage.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Où va ce que tu tapes ? Trois niveaux</tspan></text><rect x="40" y="80" width="260" height="200" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3.5"/><text x="170" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="170" dy="0">Configuration</tspan><tspan x="170" dy="22.5">en cours</tspan></text><text x="170" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="170" dy="0">en mémoire vive</tspan></text><text x="170" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="170" dy="0">perdue si le switch</tspan><tspan x="170" dy="16.9">redémarre</tspan></text><rect x="370" y="80" width="260" height="200" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3.5"/><text x="500" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">répertoire</tspan><tspan x="500" dy="22.5">working</tspan></text><text x="500" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">enregistré sur le switch</tspan></text><text x="500" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">ta version de travail</tspan></text><rect x="700" y="80" width="260" height="200" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3.5"/><text x="830" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="830" dy="0">répertoire</tspan><tspan x="830" dy="22.5">certified</tspan></text><text x="830" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="830" dy="0">enregistré, certifié</tspan></text><text x="830" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">relu au démarrage</tspan></text><line x1="305" y1="180" x2="365" y2="180" stroke="#3a4270" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><line x1="635" y1="180" x2="695" y2="180" stroke="#3a4270" stroke-width="4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="290" y="118" width="100" height="28" rx="6" fill="#ffffff" stroke="#3a4270" stroke-width="1.5"/><text x="340" y="138" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="340" dy="0">write memory</tspan></text><rect x="570" y="118" width="150" height="28" rx="6" fill="#ffffff" stroke="#3a4270" stroke-width="1.5"/><text x="645" y="138" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="645" dy="0">copy working certified</tspan></text><rect x="40" y="310" width="920" height="70" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><polygon points="76,329 92,357.8 60,357.8" fill="#f9a825" stroke="#b28704" stroke-width="2" stroke-linejoin="round"/><text x="76" y="353.8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="76" dy="0">!</tspan></text><text x="520" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="520" dy="0">Si tu oublies d'enregistrer, une coupure de courant efface tout ton travail.</tspan></text><text x="520" y="360" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="520" dy="0">Enregistrer et certifier fait partie de l'intervention, pas d'un « plus ».</tspan></text></svg>
