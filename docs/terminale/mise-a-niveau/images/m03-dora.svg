<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img"><title>Le dialogue DHCP : DORA</title><desc>Quatre messages entre un poste et le serveur DHCP : Discover, Offer, Request, Acknowledge.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="520" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Obtenir une adresse automatiquement : DORA</tspan></text><rect x="75" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="180" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">Poste (PC)</tspan></text><text x="180" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="180" dy="0">n'a pas d'adresse</tspan></text><line x1="180" y1="100" x2="180" y2="403" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="715" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="3"/><text x="820" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="820" dy="0">Serveur DHCP</tspan></text><text x="820" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="820" dy="0">192.168.10.5</tspan></text><line x1="820" y1="100" x2="820" y2="403" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="188" y1="145" x2="812" y2="145" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="500.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">① DISCOVER : « Y a-t-il un serveur DHCP ? »</tspan></text><text x="500.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">① DISCOVER : « Y a-t-il un serveur DHCP ? »</tspan></text><line x1="812" y1="207" x2="188" y2="207" stroke="#00897b" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="500.0" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">② OFFER : « Je te propose 192.168.10.101 »</tspan></text><text x="500.0" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">② OFFER : « Je te propose 192.168.10.101 »</tspan></text><line x1="188" y1="269" x2="812" y2="269" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="500.0" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">③ REQUEST : « D'accord, je prends cette adresse »</tspan></text><text x="500.0" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">③ REQUEST : « D'accord, je prends cette adresse »</tspan></text><line x1="812" y1="331" x2="188" y2="331" stroke="#00897b" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="500.0" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">④ ACK : « Confirmé pour 8 heures, passerelle .1, DNS .1 »</tspan></text><text x="500.0" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">④ ACK : « Confirmé pour 8 heures, passerelle .1, DNS .1 »</tspan></text><rect x="40" y="440" width="920" height="60" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="464" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Discover / Offer / Request / Acknowledge. Si personne ne répond, Windows prend une adresse 169.254.x.x :</tspan></text><text x="500" y="486" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">c'est le signe que le DHCP est injoignable (serveur éteint, câble, VLAN, relais).</tspan></text></svg>
