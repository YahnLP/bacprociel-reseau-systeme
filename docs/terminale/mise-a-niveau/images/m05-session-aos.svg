<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Une session sur l'OmniSwitch</title><desc>Une fenêtre de commandes AOS avec l'invite -&gt; et quatre commandes annotées : system name, show system, write memory, copy working certified.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Une session AOS commentée</tspan></text><rect x="30" y="56" width="580" height="390" rx="8" fill="#1e1e1e" stroke="#37474f" stroke-width="3"/><rect x="30" y="56" width="580" height="28" rx="8" fill="#37474f" stroke="#37474f" stroke-width="0"/><text x="46" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#cfd8dc" text-anchor="start" font-weight="700"><tspan x="46" dy="0">OmniSwitch – console</tspan></text><text x="46" y="116" font-family="Consolas, Menlo, monospace" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="700"><tspan x="46" dy="0">-&gt; </tspan></text><text x="71.8" y="116" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="71.8" dy="0">system name SW-KINE</tspan></text><circle cx="588" cy="111" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="588" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="588" dy="0">A</tspan></text><text x="46" y="156" font-family="Consolas, Menlo, monospace" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="700"><tspan x="46" dy="0">-&gt; </tspan></text><text x="71.8" y="156" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="71.8" dy="0">user admin password Kine#Adm2027</tspan></text><circle cx="588" cy="151" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="588" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="588" dy="0">B</tspan></text><text x="46" y="196" font-family="Consolas, Menlo, monospace" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="700"><tspan x="46" dy="0">-&gt; </tspan></text><text x="71.8" y="196" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="71.8" dy="0">show system</tspan></text><circle cx="588" cy="191" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="588" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="588" dy="0">C</tspan></text><text x="46" y="236" font-family="Consolas, Menlo, monospace" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="700"><tspan x="46" dy="0">   Name:        SW-KINE,</tspan></text><text x="252.39999999999998" y="236" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="700"><tspan x="252.39999999999998" dy="0"></tspan></text><text x="46" y="276" font-family="Consolas, Menlo, monospace" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="700"><tspan x="46" dy="0">   Description: Alcatel-Lucent OS6400…</tspan></text><text x="372.8" y="276" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="700"><tspan x="372.8" dy="0"></tspan></text><text x="46" y="316" font-family="Consolas, Menlo, monospace" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="700"><tspan x="46" dy="0">-&gt; </tspan></text><text x="71.8" y="316" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="71.8" dy="0">write memory</tspan></text><circle cx="588" cy="311" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="588" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="588" dy="0">D</tspan></text><text x="46" y="356" font-family="Consolas, Menlo, monospace" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="700"><tspan x="46" dy="0">-&gt; </tspan></text><text x="71.8" y="356" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="71.8" dy="0">copy working certified</tspan></text><circle cx="588" cy="351" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="588" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="588" dy="0">E</tspan></text><text x="46" y="396" font-family="Consolas, Menlo, monospace" font-size="14" fill="#80cbc4" text-anchor="start" font-weight="700"><tspan x="46" dy="0">-&gt; </tspan></text><text x="71.8" y="396" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="71.8" dy="0">show interfaces status</tspan></text><circle cx="588" cy="391" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="588" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="588" dy="0">F</tspan></text><circle cx="650" cy="112" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="650" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="650" dy="0">A</tspan></text><text x="672" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="672" dy="0">Donne un nom au switch</tspan></text><circle cx="650" cy="164" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="650" y="169" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="650" dy="0">B</tspan></text><text x="672" y="169" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="672" dy="0">Remplace le mot de passe d'usine</tspan></text><circle cx="650" cy="216" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="650" y="221" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="650" dy="0">C</tspan></text><text x="672" y="221" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="672" dy="0">Nom, version, durée de marche</tspan></text><circle cx="650" cy="268" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="650" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="650" dy="0">D</tspan></text><text x="672" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="672" dy="0">Écrit dans le répertoire working</tspan></text><circle cx="650" cy="320" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="650" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="650" dy="0">E</tspan></text><text x="672" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="672" dy="0">Certifie : reprise au redémarrage</tspan></text><circle cx="650" cy="372" r="12" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="650" y="377" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="650" dy="0">F</tspan></text><text x="672" y="377" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="672" dy="0">Ports up/down, vitesse</tspan></text><text x="500" y="462" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="1" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0"></tspan></text></svg>
