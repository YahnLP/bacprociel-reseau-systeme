<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Le déroulé des 3 heures de l'épreuve</title><desc>Frise des quatre phases : préparer 40 minutes, réaliser 1 h 35, maintenance 30 minutes, restitution 15 minutes, avec les trois appels à l'examinateur.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">L'épreuve de 3 heures en un coup d'œil</tspan></text><rect x="40" y="90" width="201.44444444444443" height="90" rx="8" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="142.22222222222223" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="142.22222222222223" dy="0">A · PRÉPARER</tspan></text><text x="142.22222222222223" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="142.22222222222223" dy="0">40 min</tspan></text><text x="142.22222222222223" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="142.22222222222223" dy="0">dossier, matériel,</tspan></text><text x="142.22222222222223" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="142.22222222222223" dy="0">planning, tests</tspan></text><rect x="244.44444444444443" y="90" width="482.55555555555554" height="90" rx="8" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="487.2222222222222" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="487.2222222222222" dy="0">B · RÉALISER</tspan></text><text x="487.2222222222222" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="487.2222222222222" dy="0">1 h 35</tspan></text><text x="487.2222222222222" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="487.2222222222222" dy="0">câbler, brasser,</tspan></text><text x="487.2222222222222" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="487.2222222222222" dy="0">configurer, tester</tspan></text><rect x="730.0" y="90" width="150.33333333333331" height="90" rx="8" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><text x="806.6666666666666" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="806.6666666666666" dy="0">C · MAINTENANCE</tspan></text><text x="806.6666666666666" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="806.6666666666666" dy="0">30 min</tspan></text><text x="806.6666666666666" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="806.6666666666666" dy="0">sauvegarde, MAJ,</tspan></text><text x="806.6666666666666" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="806.6666666666666" dy="0">dépannage</tspan></text><rect x="883.3333333333333" y="90" width="73.66666666666666" height="90" rx="8" fill="#8e24aa" stroke="#8e24aa" stroke-width="0"/><text x="921.6666666666666" y="125" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="921.6666666666666" dy="0">RESTIT.</tspan></text><text x="921.6666666666666" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="921.6666666666666" dy="0">15 min</tspan></text><text x="921.6666666666666" y="212" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="921.6666666666666" dy="0">compte rendu,</tspan></text><text x="921.6666666666666" y="230" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="921.6666666666666" dy="0">entretien</tspan></text><line x1="448.88888888888886" y1="74" x2="448.88888888888886" y2="90" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><circle cx="448.88888888888886" cy="70" r="7" fill="#c62828" stroke="#ffffff" stroke-width="2"/><line x1="602.2222222222222" y1="74" x2="602.2222222222222" y2="90" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><circle cx="602.2222222222222" cy="70" r="7" fill="#c62828" stroke="#ffffff" stroke-width="2"/><line x1="730.0" y1="74" x2="730.0" y2="90" stroke="#c62828" stroke-width="3" stroke-linecap="round"/><circle cx="730.0" cy="70" r="7" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="448.88888888888886" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="448.88888888888886" dy="0">Appel n°1</tspan></text><text x="602.2222222222222" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="602.2222222222222" dy="0">Appel n°2</tspan></text><text x="730.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0">Appel n°3</tspan></text><rect x="80" y="290" width="260" height="84" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="210" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="210" dy="0">Appel 1</tspan></text><text x="210" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="210" dy="0">raccordement</tspan></text><text x="210" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="210" dy="0">et mesure</tspan></text><rect x="380" y="290" width="260" height="84" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="510" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="510" dy="0">Appel 2</tspan></text><text x="510" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="510" dy="0">configuration</tspan></text><text x="510" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="510" dy="0">du switch</tspan></text><rect x="680" y="290" width="260" height="84" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="810" y="316" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="810" dy="0">Appel 3</tspan></text><text x="810" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="810" dy="0">tests négatifs</tspan></text><text x="810" y="358" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="810" dy="0">démontrés</tspan></text><text x="500" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Trois points d'arrêt avec l'examinateur</tspan></text></svg>
