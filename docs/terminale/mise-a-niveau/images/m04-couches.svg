<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img"><title>Les quatre couches</title><desc>Quatre couches empilées : application, transport, réseau et accès réseau, avec leur rôle, leur adresse et ce qui peut les casser.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="520" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un message traverse quatre couches</tspan></text><text x="130" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">Couche</tspan></text><text x="350" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="350" dy="0">Son rôle</tspan></text><text x="590" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">Son adresse / repère</tspan></text><text x="840" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="840" dy="0">Ce qui la casse</tspan></text><rect x="30" y="80" width="940" height="80" rx="12" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><rect x="30" y="80" width="200" height="80" rx="12" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><rect x="210" y="80" width="20" height="80" rx="0" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="130" y="127" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">APPLICATION</tspan></text><text x="350" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="350" dy="0">le service demandé</tspan></text><text x="590" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">Port : 80, 443, 53, 67</tspan></text><text x="840" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="840" dy="0">Service arrêté, mauvais</tspan><tspan x="840" dy="17.5">DNS</tspan></text><rect x="30" y="172" width="940" height="80" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="30" y="172" width="200" height="80" rx="12" fill="#00897b" stroke="#00897b" stroke-width="0"/><rect x="210" y="172" width="20" height="80" rx="0" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="130" y="219" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">TRANSPORT</tspan></text><text x="350" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="350" dy="0">le dialogue de bout</tspan><tspan x="350" dy="18.1">en bout</tspan></text><text x="590" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">Numéro de port, TCP /</tspan><tspan x="590" dy="18.1">UDP</tspan></text><text x="840" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="840" dy="0">Port filtré, service sur</tspan><tspan x="840" dy="17.5">un autre port</tspan></text><rect x="30" y="264" width="940" height="80" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><rect x="30" y="264" width="200" height="80" rx="12" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><rect x="210" y="264" width="20" height="80" rx="0" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><text x="130" y="311" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">RÉSEAU</tspan></text><text x="350" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="350" dy="0">aller d'un réseau à</tspan><tspan x="350" dy="18.1">l'autre</tspan></text><text x="590" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">Adresse IP, ping (ICMP)</tspan></text><text x="840" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="840" dy="0">Mauvaise adresse,</tspan><tspan x="840" dy="17.5">passerelle, route</tspan></text><rect x="30" y="356" width="940" height="80" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3"/><rect x="30" y="356" width="200" height="80" rx="12" fill="#8e24aa" stroke="#8e24aa" stroke-width="0"/><rect x="210" y="356" width="20" height="80" rx="0" fill="#8e24aa" stroke="#8e24aa" stroke-width="0"/><text x="130" y="403" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">ACCÈS RÉSEAU</tspan></text><text x="350" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="350" dy="0">aller chez le voisin</tspan><tspan x="350" dy="18.1">direct</tspan></text><text x="590" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="590" dy="0">Adresse MAC, Ethernet,</tspan><tspan x="590" dy="18.1">Wi-Fi</tspan></text><text x="840" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="840" dy="0">Câble, port, VLAN, carte</tspan><tspan x="840" dy="17.5">réseau</tspan></text><line x1="995" y1="90" x2="995" y2="430" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="30" y="455" width="940" height="50" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="477" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Pour dépanner : on remonte de la couche du bas (câble) vers celle du haut (service).</tspan></text><text x="500" y="496" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Un problème en bas rend inutile tout ce qui se règle au-dessus.</tspan></text></svg>
