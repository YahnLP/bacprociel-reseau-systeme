<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Lire le résultat de ipconfig /all</title><desc>Une fenêtre de commandes avec le résultat d'ipconfig /all : adresse physique, DHCP activé, adresse IPv4, masque, passerelle, serveur DHCP et serveur DNS, avec des repères.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Lire un « ipconfig /all » : ligne par ligne</tspan></text><rect x="30" y="56" width="600" height="390" rx="8" fill="#1e1e1e" stroke="#37474f" stroke-width="3"/><rect x="30" y="56" width="600" height="28" rx="8" fill="#37474f" stroke="#37474f" stroke-width="0"/><text x="46" y="76" font-family="Consolas, Menlo, monospace" font-size="13" fill="#cfd8dc" text-anchor="start" font-weight="700"><tspan x="46" dy="0">C:\&gt; ipconfig /all</tspan></text><text x="46" y="118" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Adresse physique . . . . : </tspan></text><text x="278.8" y="118" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="278.8" dy="0">00-D0-95-12-34-56</tspan></text><circle cx="652" cy="113" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="652" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="652" dy="0">A</tspan></text><text x="46" y="156" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="400"><tspan x="46" dy="0">DHCP activé . . . . . . . : </tspan></text><text x="287.20000000000005" y="156" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="287.20000000000005" dy="0">Oui</tspan></text><circle cx="652" cy="151" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="652" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="652" dy="0">B</tspan></text><text x="46" y="194" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Adresse IPv4 . . . . . . . : </tspan></text><text x="295.6" y="194" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="295.6" dy="0">192.168.10.101</tspan></text><circle cx="652" cy="189" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="652" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="652" dy="0">C</tspan></text><text x="46" y="232" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Masque de sous-réseau . . : </tspan></text><text x="287.20000000000005" y="232" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="287.20000000000005" dy="0">255.255.255.0</tspan></text><circle cx="652" cy="227" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="652" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="652" dy="0">D</tspan></text><text x="46" y="270" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Passerelle par défaut . . : </tspan></text><text x="287.20000000000005" y="270" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="287.20000000000005" dy="0">192.168.10.1</tspan></text><circle cx="652" cy="265" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="652" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="652" dy="0">E</tspan></text><text x="46" y="308" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Serveur DHCP . . . . . . . : </tspan></text><text x="295.6" y="308" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="295.6" dy="0">192.168.10.5</tspan></text><circle cx="652" cy="303" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="652" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="652" dy="0">F</tspan></text><text x="46" y="346" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Serveurs DNS . . . . . . . : </tspan></text><text x="295.6" y="346" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="295.6" dy="0">192.168.100.1</tspan></text><circle cx="652" cy="341" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="652" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="652" dy="0">G</tspan></text><text x="46" y="384" font-family="Consolas, Menlo, monospace" font-size="14" fill="#b0bec5" text-anchor="start" font-weight="400"><tspan x="46" dy="0">Bail obtenu . . . . . . . : </tspan></text><text x="287.20000000000005" y="384" font-family="Consolas, Menlo, monospace" font-size="14" fill="#fff59d" text-anchor="start" font-weight="700"><tspan x="287.20000000000005" dy="0">lundi 18 janvier 08:12</tspan></text><circle cx="652" cy="379" r="13" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="652" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="652" dy="0">H</tspan></text><text x="712" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="712" dy="0">A Adresse MAC : l'identité de la</tspan><tspan x="712" dy="16.2">carte</tspan></text><text x="712" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="712" dy="0">B Oui = adresse reçue</tspan><tspan x="712" dy="16.2">automatiquement</tspan></text><text x="712" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="712" dy="0">C L'adresse du poste (dans la plage</tspan><tspan x="712" dy="16.2">DHCP)</tspan></text><text x="712" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="712" dy="0">D Définit quel est son réseau (/24)</tspan></text><text x="712" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="712" dy="0">E Le routeur à qui parler pour</tspan><tspan x="712" dy="16.2">sortir</tspan></text><text x="712" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="712" dy="0">F Qui a distribué l'adresse</tspan></text><text x="712" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="712" dy="0">G Qui traduit les noms en adresses</tspan></text><text x="712" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="start" font-weight="600"><tspan x="712" dy="0">H Durée de validité de l'adresse</tspan></text><rect x="30" y="455" width="940" height="0.1" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="0"/></svg>
