<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"><title>Le switch apprend les adresses MAC</title><desc>Un switch avec trois PC. Il note la MAC source de chaque trame et le port d'arrivée dans sa table, puis n'envoie ensuite que vers le bon port.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="440" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Le switch apprend : MAC source → port d'arrivée</tspan></text><rect x="330" y="120" width="340" height="100" rx="12" fill="#e0f2f1" stroke="#00897b" stroke-width="4"/><rect x="350" y="135" width="56" height="34" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="2"/><text x="378" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="378" dy="0">1/1</tspan></text><rect x="426" y="135" width="56" height="34" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="2"/><text x="454" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="454" dy="0">1/2</tspan></text><rect x="502" y="135" width="56" height="34" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="2"/><text x="530" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="530" dy="0">1/3</tspan></text><rect x="578" y="135" width="56" height="34" rx="4" fill="#ffffff" stroke="#00897b" stroke-width="2"/><text x="606" y="157" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="606" dy="0">1/4</tspan></text><text x="500" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">SWITCH</tspan></text><line x1="378" y1="169" x2="140" y2="280" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><rect x="110" y="270" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="115" y="275" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="140" y1="310" x2="140" y2="320" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="122" y="318" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="140" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="140" dy="0">PC-1</tspan></text><text x="140" y="362" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="140" dy="0">MAC …:11</tspan></text><line x1="454" y1="169" x2="400" y2="280" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><rect x="370" y="270" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="375" y="275" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="400" y1="310" x2="400" y2="320" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="382" y="318" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="400" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="400" dy="0">PC-2</tspan></text><text x="400" y="362" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="400" dy="0">MAC …:22</tspan></text><line x1="530" y1="169" x2="680" y2="280" stroke="#3a4270" stroke-width="3" stroke-linecap="round"/><rect x="650" y="270" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="655" y="275" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="680" y1="310" x2="680" y2="320" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="662" y="318" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="680" y="345" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="680" dy="0">PC-3</tspan></text><text x="680" y="362" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="680" dy="0">MAC …:33</tspan></text><rect x="720" y="70" width="250" height="190" rx="12" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="845" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="845" dy="0">Table d'adresses MAC</tspan></text><rect x="735" y="112" width="220" height="30" rx="5" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/><text x="790" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="790" dy="0">…:11</tspan></text><text x="870" y="133" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">→ port 1/1</tspan></text><rect x="735" y="150" width="220" height="30" rx="5" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/><text x="790" y="171" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="790" dy="0">…:22</tspan></text><text x="870" y="171" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">→ port 1/2</tspan></text><rect x="735" y="188" width="220" height="30" rx="5" fill="#e8eaf6" stroke="#9fa8da" stroke-width="1.5"/><text x="790" y="209" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="790" dy="0">…:33</tspan></text><text x="870" y="209" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">→ port 1/3</tspan></text><rect x="30" y="380" width="940" height="48" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="402" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Quand PC-1 envoie à PC-3, le switch lit la MAC source (…:11), la mémorise avec le port 1/1,</tspan></text><text x="500" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">puis envoie vers le port de PC-3 seulement. Si la MAC est inconnue, il envoie sur tous les ports sauf celui d'arrivée.</tspan></text></svg>
