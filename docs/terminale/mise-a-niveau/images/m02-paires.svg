fill="none" stroke="#bdbdbd" stroke-width="6" stroke-linecap="round"/><rect x="470" y="210" width="500" height="190" rx="12" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="490" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="490" dy="0">Pourquoi tordre les fils ?</tspan></text><text x="490" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="490" dy="0">• Les perturbations électriques (moteur, néon,</tspan></text><text x="500" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="500" dy="0">câble voisin) touchent les deux fils de la même façon.</tspan></text><text x="490" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="490" dy="0">• Comme le message est lu par différence entre</tspan></text><text x="500" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="500" dy="0">les deux fils, ces perturbations s'annulent.</tspan></text><text x="490" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="490" dy="0">• Détorsader trop près du connecteur annule ce bénéfice.</tspan></text></svg>
