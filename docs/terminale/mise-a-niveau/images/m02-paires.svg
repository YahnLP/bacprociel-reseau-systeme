<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"><title>Pourquoi les paires sont torsadées</title><desc>Une coupe d'un câble avec quatre paires torsadées, une croix de séparation et une gaine, puis une paire vue de côté.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="420" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">À l'intérieur d'un câble réseau : 4 paires torsadées</tspan></text><circle cx="220" cy="215" r="150" fill="#cfd8dc" stroke="#455a64" stroke-width="5"/><circle cx="220" cy="215" r="128" fill="#eceff1" stroke="#90a4ae" stroke-width="2"/><line x1="220" y1="100" x2="220" y2="330" stroke="#b0bec5" stroke-width="8" stroke-linecap="round"/><line x1="105" y1="215" x2="335" y2="215" stroke="#b0bec5" stroke-width="8" stroke-linecap="round"/><circle cx="146" cy="155" r="18" fill="#ef6c00" stroke="#222" stroke-width="2"/><circle cx="174" cy="155" r="18" fill="#fafafa" stroke="#222" stroke-width="2"/><circle cx="266" cy="155" r="18" fill="#2e9d4a" stroke="#222" stroke-width="2"/><circle cx="294" cy="155" r="18" fill="#fafafa" stroke="#222" stroke-width="2"/><circle cx="146" cy="275" r="18" fill="#1e63c9" stroke="#222" stroke-width="2"/><circle cx="174" cy="275" r="18" fill="#fafafa" stroke="#222" stroke-width="2"/><circle cx="266" cy="275" r="18" fill="#8d5a3b" stroke="#222" stroke-width="2"/><circle cx="294" cy="275" r="18" fill="#fafafa" stroke="#222" stroke-width="2"/><text x="220" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="220" dy="0">coupe du câble</tspan></text><line x1="40" y1="110" x2="100" y2="150" strok