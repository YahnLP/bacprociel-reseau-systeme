<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"><title>Le binaire d'un octet</title><desc>Un octet de huit bits avec les valeurs 128, 64, 32, 16, 8, 4, 2, 1 et la façon de retrouver un nombre, puis la table des valeurs d'un masque.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="440" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un octet : 8 cases qui valent 128, 64, 32, 16, 8, 4, 2, 1</tspan></text><text x="500" y="62" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">exemple : 25  =  16 + 8 + 1</tspan></text><rect x="70" y="78" width="96" height="56" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="118" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="118" dy="0">128</tspan></text><rect x="70" y="140" width="96" height="44" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/><text x="118" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="118" dy="0">0</tspan></text><rect x="177" y="78" width="96" height="56" rx="8" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><text x="225" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#90a4ae" text-anchor="middle" font-weight="700"><tspan x="225" dy="0">64</tspan></text><rect x="177" y="140" width="96" height="44" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/><text x="225" y="172" font-family="Segoe UI, Helvetica, Arial, sans-ser