<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="1000" height="450" role="img"><title>La passerelle</title><desc>Un poste parle directement à un voisin du même réseau, mais passe par sa passerelle pour joindre un autre réseau ou Internet.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="450" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Même réseau : direct. Autre réseau : par la passerelle</tspan></text><rect x="30" y="70" width="520" height="330" rx="16" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="60" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#3949ab" text-anchor="start" font-weight="700"><tspan x="60" dy="0">Réseau du cabinet 192.168.10.0/24</tspan></text><rect x="90" y="160" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="95" y="165" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="120" y1="200" x2="120" y2="210" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="102" y="208" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="120" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="120" dy="0">PC-A</tspan></text><text x="120" y="252" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="120" dy="0">192.168.10.25</tspan></text><rect x="96" y="306" width="48" height="14" rx="2" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><rect x="88" y="318" width="64" height="26" rx="5" fill="#eceff1" strok