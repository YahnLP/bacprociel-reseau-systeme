" stroke="#f9a825" stroke-width="2"/><text x="760" y="175" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="760" dy="0">La passerelle est l'adresse du routeur de ton réseau.</tspan></text><text x="760" y="197" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="760" dy="0">Elle est toujours dans le MÊME réseau que le poste.</tspan></text><circle cx="60" cy="424" r="12" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="60" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="60" dy="0">1</tspan></text><text x="80" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="80" dy="0">vers l'imprimante : directement, car même réseau</tspan></text><circle cx="540" cy="424" r="12" fill="#c62828" stroke="#ffffff" stroke-width="2"/><text x="540" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="540" dy="0">2</tspan></text><text x="560" y="429" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="560" dy="0">vers Internet : par la passerelle, car autre réseau</tspan></text></svg>
