<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"><title>Le plan de mise à jour</title><desc>Cinq étapes alignées dans le temps : lire le bulletin, sauvegarder, planifier, installer et tester, consigner, avec un retour arrière possible.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="380" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Mettre à jour un switch : cinq étapes, un filet de sécurité</tspan></text><rect x="30" y="70" width="176" height="190" rx="12" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><circle cx="118" cy="70" r="17" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="118" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="118" dy="0">1</tspan></text><text x="118" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="118" dy="0">Lire</tspan></text><text x="118" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="118" dy="0">le bulletin,</tspan></text><text x="118" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="118" dy="0">noter la version</tspan></text><line x1="208" y1="165" x2="220" y2="165" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="222" y="70" width="176" height="190" rx="12" fill="#ffffff" stroke="#00897b" stroke-width="3"/><circle cx="310" cy="70" r="17" fill="#00897b" stroke="#ffffff" stroke-width="2"/><text x="310" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="310" dy="0">2</tspan></text><text x="310" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="310" dy="0">Sauvegarder</tspan></text><text x="310" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="310" dy="0">la configuration</tspan></text><text x="310" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="310" dy="0">et l'ancienne version</tspan></text><line x1="400" y1="165" x2="412" y2="165" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="414" y="70" width="176" height="190" rx="12" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><circle cx="502" cy="70" r="17" fill="#ef6c00" stroke="#ffffff" stroke-width="2"/><text x="502" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="502" dy="0">3</tspan></text><text x="502" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="502" dy="0">Planifier</tspan></text><text x="502" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="502" dy="0">hors horaires,</tspan></text><text x="502" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="502" dy="0">prévenir le client</tspan></text><line x1="592" y1="165" x2="604" y2="165" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="606" y="70" width="176" height="190" rx="12" fill="#ffffff" stroke="#8e24aa" stroke-width="3"/><circle cx="694" cy="70" r="17" fill="#8e24aa" stroke="#ffffff" stroke-width="2"/><text x="694" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="694" dy="0">4</tspan></text><text x="694" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8e24aa" text-anchor="middle" font-weight="700"><tspan x="694" dy="0">Installer</tspan></text><text x="694" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8e24aa" text-anchor="middle" font-weight="700"><tspan x="694" dy="0">et tester</tspan></text><text x="694" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="694" dy="0">redémarrer,</tspan></text><text x="694" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="694" dy="0">vérifier VLAN, Wi-Fi</tspan></text><line x1="784" y1="165" x2="796" y2="165" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="798" y="70" width="176" height="190" rx="12" fill="#ffffff" stroke="#2e7d32" stroke-width="3"/><circle cx="886" cy="70" r="17" fill="#2e7d32" stroke="#ffffff" stroke-width="2"/><text x="886" y="75" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="886" dy="0">5</tspan></text><text x="886" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="886" dy="0">Consigner</tspan></text><text x="886" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="886" dy="0">journal et</tspan></text><text x="886" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="886" dy="0">nouvelle sauvegarde</tspan></text><path d="M720,262 C720,320 220,320 220,262" fill="none" stroke="#c62828" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#ar)"/><text x="470" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="470" dy="0">Si la mise à jour échoue : retour arrière (ancienne version + configuration sauvegardée)</tspan></text></svg>
