<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Délimiter une panne avec des ping successifs</title><desc>Une échelle de cinq ping, du plus proche au plus lointain : sa propre adresse, un voisin, la passerelle, une adresse Internet, un nom.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">L'échelle des ping : on monte jusqu'à la première marche qui échoue</tspan></text><text x="560" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="560" dy="0">si ça marche, c'est que…</tspan></text><text x="860" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="860" dy="0">si ça échoue, suspecter…</tspan></text><rect x="30" y="78" width="300" height="60" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="52" cy="108" r="14" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="52" y="113" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="52" dy="0">1</tspan></text><text x="76" y="114" font-family="Consolas, Menlo, monospace" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="76" dy="0">ping 127.0.0.1</tspan></text><rect x="430" y="78" width="240" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="550" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="550" dy="0">ma propre pile réseau</tspan></text><rect x="690" y="78" width="280" height="60" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="830" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">poste à réparer</tspan></text><rect x="66" y="152" width="300" height="60" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="88" cy="182" r="14" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="88" y="187" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="88" dy="0">2</tspan></text><text x="112" y="188" font-family="Consolas, Menlo, monospace" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="112" dy="0">ping un voisin</tspan></text><rect x="430" y="152" width="240" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="550" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="550" dy="0">câble, switch, VLAN, adresse</tspan></text><rect x="690" y="152" width="280" height="60" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="830" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">câble, port, VLAN, masque</tspan></text><rect x="102" y="226" width="300" height="60" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="124" cy="256" r="14" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="124" y="261" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="124" dy="0">3</tspan></text><text x="148" y="262" font-family="Consolas, Menlo, monospace" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="148" dy="0">ping la passerelle</tspan></text><rect x="430" y="226" width="240" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="550" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="550" dy="0">poste bien relié au routeur</tspan></text><rect x="690" y="226" width="280" height="60" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="830" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">passerelle erronée, routeur</tspan></text><rect x="138" y="300" width="300" height="60" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="160" cy="330" r="14" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="160" y="335" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="160" dy="0">4</tspan></text><text x="184" y="336" font-family="Consolas, Menlo, monospace" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="184" dy="0">ping 8.8.8.8</tspan></text><rect x="430" y="300" width="240" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="550" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="550" dy="0">Internet joignable par IP</tspan></text><rect x="690" y="300" width="280" height="60" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="830" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">route par défaut, box</tspan></text><rect x="174" y="374" width="300" height="60" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="196" cy="404" r="14" fill="#3949ab" stroke="#ffffff" stroke-width="2"/><text x="196" y="409" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="196" dy="0">5</tspan></text><text x="220" y="410" font-family="Consolas, Menlo, monospace" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="700"><tspan x="220" dy="0">ping www.exemple.fr</tspan></text><rect x="430" y="374" width="240" height="60" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/><text x="550" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="550" dy="0">le DNS fonctionne</tspan></text><rect x="690" y="374" width="280" height="60" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="830" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="830" dy="0">serveur DNS erroné</tspan></text></svg>
