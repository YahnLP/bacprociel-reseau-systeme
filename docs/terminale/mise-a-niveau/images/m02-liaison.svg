circle cx="776" cy="210" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><rect x="790" y="172" width="18" height="16" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="799" cy="210" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><rect x="813" y="172" width="18" height="16" rx="2" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="822" cy="210" r="2.5" fill="#90a4ae" stroke="#90a4ae" stroke-width="1"/><text x="745" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="745" dy="0">switch</tspan></text><text x="745" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="745" dy="0">(port 1/10)</tspan></text><rect x="30" y="330" width="940" height="50" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Lien permanent : 90 m max de câble fixe + cordons : 100 m au total.</tspan></text><text x="500" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Même repère (P9) sur la prise, le panneau et le cordon : le prochain technicien s'y retrouve.</tspan></text></svg>
