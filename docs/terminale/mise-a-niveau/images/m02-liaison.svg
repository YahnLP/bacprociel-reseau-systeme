<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>De la prise murale au switch</title><desc>La liaison complète : prise murale, câble fixe de 90 mètres maximum, panneau de brassage, cordon de brassage, switch. Même étiquette P9 sur la prise, le panneau et le cordon.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">La liaison complète d'une prise au switch</tspan></text><rect x="30" y="150" width="110" height="90" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="3"/><text x="85" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="85" dy="0">Salle de soins 2</tspan></text><rect x="55" y="168" width="60" height="54" rx="6" fill="#fafafa" stroke="#455a64" stroke-width="3"/><rect x="70" y="182" width="30" height="26" rx="3" fill="#263238" stroke="#263238" stroke-width="1"/><rect x="78" y="232" width="44" height="22" rx="3" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="100" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="100" dy="0">P9</tspan></text><text x="85" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="85" dy="0">prise murale</tspan></text><text x="85" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="85" dy="0">(keystone)</tspan></text><line x1="140" y1="195" x2="410" y2="195" 