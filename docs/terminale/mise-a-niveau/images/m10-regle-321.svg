 rx="18" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><text x="850" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="850" dy="0">1 copie hors site</tspan></text><rect x="40" y="366" width="920" height="40" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/><text x="500" y="391" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Une sauvegarde uniquement sur le switch disparaît avec lui : il faut une copie à l'extérieur.</tspan></text></svg>
