<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"><title>La règle de sauvegarde 3-2-1</title><desc>Trois copies : l'original sur le switch, une sauvegarde sur le PC de l'administrateur, une copie hors site, sur deux supports différents.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="420" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">La règle 3-2-1 appliquée au switch du cabinet</tspan></text><rect x="10" y="70" width="280" height="220" rx="14" fill="#ffffff" stroke="#00897b" stroke-width="3.5"/><rect x="10" y="70" width="280" height="38" rx="14" fill="#00897b" stroke="#00897b" stroke-width="0"/><rect x="10" y="90" width="280" height="18" rx="0" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="150" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="150" dy="0">COPIE 1</tspan></text><rect x="108" y="148" width="84" height="26" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><rect x="115.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="124.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="133.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="142.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="151.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="160.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="169.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><rect x="178.0" y="156" width="6.0" height="11" rx="1" fill="#ffffff" stroke="#00897b" stroke-width="1.5"/><circle cx="112" cy="152" r="2" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="150" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="150" dy="0">configuration en service</tspan></text><text x="150" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="150" dy="0">sur le switch</tspan></text><rect x="360" y="70" width="280" height="220" rx="14" fill="#ffffff" stroke="#3949ab" stroke-width="3.5"/><rect x="360" y="70" width="280" height="38" rx="14" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><rect x="360" y="90" width="280" height="18" rx="0" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="500" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">COPIE 2</tspan></text><rect x="470" y="130" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="475" y="135" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="500" y1="170" x2="500" y2="180" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="482" y="178" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="500" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">SW-KINE_2027-01-18.cfg</tspan></text><text x="500" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">sur le PC de l'administrateur<