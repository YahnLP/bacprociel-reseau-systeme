<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img"><title>Le relais DHCP</title><desc>Un portable du VLAN 20 envoie un Discover en diffusion, le switch le relaie au serveur DHCP situé dans le VLAN 10, le serveur choisit une adresse dans la plage du VLAN 20.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="520" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un serveur DHCP dans un autre VLAN : le relais</tspan></text><rect x="25" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#ef6c00" stroke-width="3"/><text x="130" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">Portable (VLAN 20)</tspan></text><text x="130" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="130" dy="0">n'a pas d'adresse</tspan></text><line x1="130" y1="100" x2="130" y2="443" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="395" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#00897b" stroke-width="3"/><text x="500" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Switch · relais</tspan></text><text x="500" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">ip helper address</tspan></text><line x1="500" y1="100" x2="500" y2="443" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><rect x="765" y="50" width="210" height="50" rx="10" fill="#ffffff" stroke="#3949ab" stroke-width="3"/><text x="870" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="870" dy="0">Serveur DHCP (VLAN 10)</tspan></text><text x="870" y="91" font-family="Consolas, Menlo, monospace" font-size="11.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="870" dy="0">192.168.10.5</tspan></text><line x1="870" y1="100" x2="870" y2="443" stroke="#90a4ae" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/><line x1="138" y1="145" x2="492" y2="145" stroke="#ef6c00" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="315.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0">① DISCOVER en diffusion (reste dans le VLAN 20)</tspan></text><text x="315.0" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0">① DISCOVER en diffusion (reste dans le VLAN 20)</tspan></text><line x1="508" y1="217" x2="862" y2="217" stroke="#00897b" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="685.0" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0">② Le switch le transmet en direct au serveur,</tspan><tspan x="685.0" dy="16.2">en ajoutant « je viens du réseau 192.168.20.1 »</tspan></text><text x="685.0" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0">② Le switch le transmet en direct au serveur,</tspan><tspan x="685.0" dy="16.2">en ajoutant « je viens du réseau 192.168.20.1 »</tspan></text><line x1="862" y1="289" x2="508" y2="289" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="685.0" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0">③ Le serveur choisit une adresse dans la plage</tspan><tspan x="685.0" dy="16.2">192.168.20.100–150 : OFFER</tspan></text><text x="685.0" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0">③ Le serveur choisit une adresse dans la plage</tspan><tspan x="685.0" dy="16.2">192.168.20.100–150 : OFFER</tspan></text><line x1="492" y1="361" x2="138" y2="361" stroke="#00897b" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><text x="315.0" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0">④ Le switch rend l'OFFER au portable : il</tspan><tspan x="315.0" dy="16.2">reçoit 192.168.20.101</tspan></text><text x="315.0" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="315.0" dy="0">④ Le switch rend l'OFFER au portable : il</tspan><tspan x="315.0" dy="16.2">reçoit 192.168.20.101</tspan></text><rect x="40" y="450" width="920" height="54" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="474" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Sans relais, la diffusion du portable ne sort jamais du VLAN 20 : le serveur ne la reçoit pas.</tspan></text><text x="500" y="494" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Le portable obtient alors une adresse 169.254.x.x (APIPA).</tspan></text></svg>
