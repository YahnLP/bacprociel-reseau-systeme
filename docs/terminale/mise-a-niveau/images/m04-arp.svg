<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img"><title>Le protocole ARP</title><desc>Le poste demande à tous quelle est la MAC de 192.168.10.5, le serveur répond avec sa MAC.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="400" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">ARP : retrouver la MAC d'un équipement dont on connaît l'IP</tspan></text><line x1="120" y1="230" x2="880" y2="230" stroke="#3a4270" stroke-width="4" stroke-linecap="round"/><rect x="120" y="180" width="60" height="40" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="125" y="185" width="50" height="30" rx="3" fill="#c5cae9" stroke="#3949ab" stroke-width="1"/><line x1="150" y1="220" x2="150" y2="230" stroke="#3949ab" stroke-width="4" stroke-linecap="round"/><rect x="132" y="228" width="36" height="7" rx="3" fill="#eceff1" stroke="#3949ab" stroke-width="2"/><text x="150" y="255" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="150" dy="0">PC-1</tspan></text><text x="150" y="272" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="150" dy="0">192.168.10.25</tspan></text><rect x="492" y="161" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="501" cy="170.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="512" y1="170.5" x2="540" y2="170.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="492" y="183" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="501" cy="192.5" r="3" fill="#2e7d32" stroke="#3949ab" stroke-width="1"/><line x1="512" y1="192.5" x2="540" y2="192.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><rect x="492" y="205" width="56" height="19" rx="3" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/><circle cx="501" cy="214.5" r="3" fill="#f9a825" stroke="#3949ab" stroke-width="1"/><line x1="512" y1="214.5" x2="540" y2="214.5" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><text x="520" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="520" dy="0">Serveur</tspan></text><text x="520" y="265" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="520" dy="0">192.168.10.5</tspan></text><rect x="826" y="186" width="48" height="14" rx="2" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><rect x="818" y="198" width="64" height="26" rx="5" fill="#eceff1" stroke="#3949ab" stroke-width="3"/><rect x="830" y="214" width="40" height="16" rx="2" fill="#ffffff" stroke="#3949ab" stroke-width="2"/><line x1="836" y1="220" x2="864" y2="220" stroke="#3949ab" stroke-width="1.5" stroke-linecap="round"/><circle cx="874" cy="206" r="2.5" fill="#2e7d32" stroke="#2e7d32" stroke-width="1"/><text x="850" y="249" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="850" dy="0">Imprimante</tspan></text><text x="850" y="266" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="850" dy="0">192.168.10.20</tspan></text><rect x="70" y="60" width="400" height="56" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="270" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="270" dy="0">①  À TOUS (diffusion) :</tspan></text><text x="270" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="270" dy="0">« Qui a l'adresse 192.168.10.5 ? »</tspan></text><line x1="200" y1="118" x2="200" y2="175" stroke="#3949ab" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><line x1="250" y1="118" x2="440" y2="160" stroke="#3949ab" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><line x1="300" y1="118" x2="800" y2="160" stroke="#3949ab" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="540" y="60" width="410" height="56" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="745" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="745" dy="0">②  Le serveur répond, à PC-1 seul :</tspan></text><text x="745" y="104" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="745" dy="0">« C'est moi, ma MAC est 00:D0:95:AA:BB:CC »</tspan></text><line x1="520" y1="150" x2="270" y2="185" stroke="#00897b" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="60" y="300" width="880" height="72" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="326" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">③  PC-1 garde la réponse dans sa table ARP (commande arp -a) pour ne pas redemander.</tspan></text><text x="500" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">L'imprimante, qui n'est pas concernée, ignore la question.</tspan></text></svg>
