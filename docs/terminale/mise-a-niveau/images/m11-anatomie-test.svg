<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img"><title>Anatomie d'un bon test</title><desc>Un test précise d'où on le fait, ce qu'on fait, ce qu'on attend, et si c'est un test positif ou négatif ; deux exemples sont donnés.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="430" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un bon test répond à quatre questions</tspan></text><rect x="30" y="62" width="236" height="40" rx="8" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><text x="148.0" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="148.0" dy="0">D'où ?</tspan></text><rect x="270" y="62" width="296" height="40" rx="8" fill="#00897b" stroke="#00897b" stroke-width="0"/><text x="418.0" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="418.0" dy="0">Que fait-on ?</tspan></text><rect x="570" y="62" width="216" height="40" rx="8" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><text x="678.0" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="678.0" dy="0">Qu'attend-on ?</tspan></text><rect x="790" y="62" width="180" height="40" rx="8" fill="#8e24aa" stroke="#8e24aa" stroke-width="0"/><text x="880.0" y="88" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0">Positif ou négatif ?</tspan></text><rect x="30" y="112" width="236" height="88" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/><text x="148.0" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="148.0" dy="0">PC-SOINS2</tspan></text><rect x="270" y="112" width="296" height="88" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/><text x="418.0" y="142" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="418.0" dy="0">ipconfig : l'adresse reçue</tspan></text><text x="418.0" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="418.0" dy="0">est entre .100 et .150</tspan></text><rect x="570" y="112" width="216" height="88" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/><text x="678.0" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="678.0" dy="0">adresse 192.168.10.1xx</tspan></text><rect x="790" y="112" width="180" height="88" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/><text x="880.0" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0">positif</tspan></text><rect x="30" y="212" width="236" height="88" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/><text x="148.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="148.0" dy="0">Portable patient</tspan></text><rect x="270" y="212" width="296" height="88" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/><text x="418.0" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="418.0" dy="0">ping 192.168.10.5</tspan></text><text x="418.0" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="418.0" dy="0">(le serveur)</tspan></text><rect x="570" y="212" width="216" height="88" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2.5"/><text x="678.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="678.0" dy="0">AUCUNE réponse</tspan></text><rect x="790" y="212" width="180" height="88" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/><text x="880.0" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#c62828" text-anchor="middle" font-weight="700"><tspan x="880.0" dy="0">négatif</tspan></text><rect x="30" y="330" width="940" height="80" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="356" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Sans « résultat attendu », on ne peut pas conclure. Sans test négatif, on ne prouve pas la sécurité.</tspan></text><text x="500" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Chaque exigence du client doit être prouvée par au moins un test.</tspan></text><text x="500" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">On écrit les tests AVANT d'intervenir, pour ne pas les adapter à ce qui marche.</tspan></text></svg>
