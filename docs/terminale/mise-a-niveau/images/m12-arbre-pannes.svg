<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Quelle cause examiner selon le symptôme</title><desc>Un arbre de décision qui part d'un équipement injoignable et oriente vers le câble, le VLAN, l'adresse, la passerelle, le DNS ou le DHCP selon les tests.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Le symptôme oriente la recherche de cause</tspan></text><rect x="350" y="60" width="300" height="50" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="500.0" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Un équipement ne répond plus</tspan></text><rect x="30" y="160" width="280" height="50" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="170.0" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="170.0" dy="0">Voyant de lien éteint ?</tspan></text><rect x="360" y="160" width="280" height="50" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="500.0" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Joint dans son réseau, pas</tspan><tspan x="500.0" dy="16.9">ailleurs ?</tspan></text><rect x="690" y="160" width="280" height="50" rx="10" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="830.0" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="830.0" dy="0">Adresse en 169.254 ?</tspan></text><line x1="500" y1="112" x2="170" y2="158" stroke="#5b6385" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="500" y1="112" x2="500" y2="158" stroke="#5b6385" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="500" y1="112" x2="830" y2="158" stroke="#5b6385" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="170" y1="212" x2="170" y2="258" stroke="#5b6385" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="180" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="180" dy="0">oui</tspan></text><rect x="30" y="262" width="280" height="70" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="170" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="170" dy="0">Câble, port du switch,</tspan></text><text x="170" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="170" dy="0">cordon débranché</tspan></text><line x1="500" y1="212" x2="500" y2="258" stroke="#5b6385" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="510" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="510" dy="0">oui</tspan></text><rect x="360" y="262" width="280" height="70" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="500" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Passerelle, masque,</tspan></text><text x="500" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">route par défaut</tspan></text><line x1="830" y1="212" x2="830" y2="258" stroke="#5b6385" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="840" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#2e7d32" text-anchor="start" font-weight="700"><tspan x="840" dy="0">oui</tspan></text><rect x="690" y="262" width="280" height="70" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="830" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="830" dy="0">DHCP injoignable :</tspan></text><text x="830" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="830" dy="0">relais, VLAN, serveur</tspan></text><rect x="30" y="352" width="940" height="94" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Si la réponse est « non » partout : l'équipement est dans le mauvais VLAN, a une mauvaise adresse IP,</tspan></text><text x="500" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">ou le DNS est en cause (adresse OK, nom injoignable).</tspan></text><text x="500" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Outils : show interfaces status · show mac-learning · show vlan port · show ip routes · show ip helper</tspan></text></svg>
