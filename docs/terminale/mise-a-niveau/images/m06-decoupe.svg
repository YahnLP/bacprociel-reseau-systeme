<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>Découper un réseau /24</title><desc>Une barre de 256 adresses découpée en deux blocs de 128 (deux /25) puis en quatre blocs de 64 (quatre /26), avec l'adresse de réseau et de diffusion de chaque bloc.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="470" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Découper un /24 : on coupe le bloc de 256 en deux, puis en quatre</tspan></text><text x="500" y="66" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">192.168.10.0 /24 : 256 adresses, 254 utilisables (réseau = .0, diffusion = .255)</tspan></text><rect x="50.0" y="76" width="900.0" height="60" rx="0" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="500.0" y="101" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">.0</tspan></text><text x="500.0" y="121" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500.0" dy="0">à .255</tspan></text><text x="500" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">→ 2 blocs de 128 : masque /25 (255.255.255.128), 126 adresses utilisables chacun</tspan></text><rect x="50.0" y="176" width="450.0" height="60" rx="0" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="275.0" y="201" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0">.0</tspan></text><text x="275.0" y="221" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="275.0" dy="0">à .127</tspan></text><rect x="500.0" y="176" width="450.0" height="60" rx="0" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="725.0" y="201" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0">.128</tspan></text><text x="725.0" y="221" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="725.0" dy="0">à .255</tspan></text><text x="500" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">→ 4 blocs de 64 : masque /26 (255.255.255.192), 62 adresses utilisables chacun</tspan></text><rect x="50.0" y="276" width="225.0" height="60" rx="0" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="162.5" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="162.5" dy="0">.0</tspan></text><text x="162.5" y="321" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="162.5" dy="0">à .63</tspan></text><rect x="275.0" y="276" width="225.0" height="60" rx="0" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="387.5" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="387.5" dy="0">.64</tspan></text><text x="387.5" y="321" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="387.5" dy="0">à .127</tspan></text><rect x="500.0" y="276" width="225.0" height="60" rx="0" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="612.5" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="612.5" dy="0">.128</tspan></text><text x="612.5" y="321" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="612.5" dy="0">à .191</tspan></text><rect x="725.0" y="276" width="225.0" height="60" rx="0" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3"/><text x="837.5" y="301" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="837.5" dy="0">.192</tspan></text><text x="837.5" y="321" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="837.5" dy="0">à .255</tspan></text><rect x="50" y="360" width="900" height="90" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Dans chaque bloc : la 1ʳᵉ adresse est celle du RÉSEAU, la dernière est la DIFFUSION, toutes deux inutilisables.</tspan></text><text x="500" y="410" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Exemple, bloc .128 à .191 : réseau .128 · utilisables .129 à .190 · diffusion .191</tspan></text><text x="500" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Taille du bloc = 256 − valeur du masque (192 → 64).</tspan></text></svg>
