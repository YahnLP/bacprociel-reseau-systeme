<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img"><title>Un plan d'adressage visuel</title><desc>Le réseau 192.168.10.0/24 représenté en bande : passerelle .1, serveur .5, imprimante .20, borne .30, plage DHCP .100 à .150, libre ensuite.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="380" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Plan d'adressage du réseau POSTES : 192.168.10.0 /24</tspan></text><rect x="50" y="110" width="900" height="60" rx="4" fill="#eceff1" stroke="#90a4ae" stroke-width="3"/><rect x="401.5625" y="110" width="179.296875" height="60" rx="0" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/><text x="491.2109375" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="491.2109375" dy="0">plage DHCP</tspan></text><text x="491.2109375" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#2e7d32" text-anchor="middle" font-weight="700"><tspan x="491.2109375" dy="0">.100 à .150</tspan></text><rect x="50.515625" y="100" width="7" height="80" rx="2" fill="#ef6c00" stroke="#ef6c00" stroke-width="0"/><line x1="53.515625" y1="180" x2="130" y2="236" stroke="#ef6c00" stroke-width="2" stroke-linecap="round"/><rect x="50" y="236" width="160" height="50" rx="8" fill="#ffffff" stroke="#ef6c00" stroke-width="2.5"/><text x="130" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">passerelle</tspan></text><text x="130" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="130" dy="0">192.168.10.1</tspan></text><rect x="64.578125" y="100" width="7" height="80" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><line x1="67.578125" y1="180" x2="320" y2="236" stroke="#3949ab" stroke-width="2" stroke-linecap="round"/><rect x="240" y="236" width="160" height="50" rx="8" fill="#ffffff" stroke="#3949ab" stroke-width="2.5"/><text x="320" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">serveur</tspan></text><text x="320" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="320" dy="0">192.168.10.5</tspan></text><rect x="117.3125" y="100" width="7" height="80" rx="2" fill="#3949ab" stroke="#3949ab" stroke-width="0"/><line x1="120.3125" y1="180" x2="510" y2="236" stroke="#3949ab" stroke-width="2" stroke-linecap="round"/><rect x="430" y="236" width="160" height="50" rx="8" fill="#ffffff" stroke="#3949ab" stroke-width="2.5"/><text x="510" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="510" dy="0">imprimante</tspan></text><text x="510" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="510" dy="0">192.168.10.20</tspan></text><rect x="152.46875" y="100" width="7" height="80" rx="2" fill="#00897b" stroke="#00897b" stroke-width="0"/><line x1="155.46875" y1="180" x2="700" y2="236" stroke="#00897b" stroke-width="2" stroke-linecap="round"/><rect x="620" y="236" width="160" height="50" rx="8" fill="#ffffff" stroke="#00897b" stroke-width="2.5"/><text x="700" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="700" dy="0">borne Wi-Fi</tspan></text><text x="700" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="700" dy="0">192.168.10.30</tspan></text><text x="64" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="start" font-weight="700"><tspan x="64" dy="0">.0 réseau</tspan></text><text x="950" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#c62828" text-anchor="end" font-weight="700"><tspan x="950" dy="0">.255 diffusion</tspan></text><text x="788.28125" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="788.28125" dy="0">libre pour</tspan></text><text x="788.28125" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b6385" text-anchor="middle" font-weight="700"><tspan x="788.28125" dy="0">l'avenir</tspan></text><rect x="50" y="308" width="900" height="56" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="332" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">Les adresses FIXES (passerelle, serveur, imprimante, borne) sont HORS de la plage DHCP :</tspan></text><text x="500" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#5b6385" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">sinon un poste pourrait recevoir une adresse déjà utilisée (conflit).</tspan></text></svg>
