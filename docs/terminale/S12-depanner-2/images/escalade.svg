<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img"><title>Quand et comment passer la main</title><desc>Trois niveaux : je dépanne seul si je connais la panne et que je suis autorisé ; je demande à un collègue ou à mon responsable si je bloque ou si le risque est élevé ; je fais appel au constructeur ou au prestataire pour une panne matérielle sous garantie ou hors de mon périmètre.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a4270"/></marker></defs><rect width="1000" height="440" fill="#ffffff" rx="10"/><text x="500.0" y="30" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0">Passer la main, ce n'est pas un échec : c'est une décision</tspan></text><rect x="30" y="75" width="300" height="250" rx="14" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/><text x="180" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#00897b" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">Niveau 1 – Moi</tspan></text><text x="180" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="180" dy="0">Je dépanne seul si :</tspan></text><text x="60" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">• je connais la panne,</tspan></text><text x="60" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">• j'ai l'autorisation,</tspan></text><text x="60" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="60" dy="0">• je peux revenir en arrière.</tspan></text><line x1="332" y1="200" x2="350" y2="200" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="352" y="75" width="300" height="250" rx="14" fill="#e8eaf6" stroke="#3949ab" stroke-width="3"/><text x="502" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#3949ab" text-anchor="middle" font-weight="700"><tspan x="502" dy="0">Niveau 2 – Mon responsable</tspan></text><text x="502" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="502" dy="0">Je préviens et je demande si :</tspan></text><text x="382" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="382" dy="0">• je bloque depuis 30 min,</tspan></text><text x="382" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="382" dy="0">• le risque est élevé,</tspan></text><text x="382" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="382" dy="0">• la décision n'est pas la mienne.</tspan></text><line x1="654" y1="200" x2="672" y2="200" stroke="#5b6385" stroke-width="3" stroke-linecap="round" marker-end="url(#ar)"/><rect x="674" y="75" width="300" height="250" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3"/><text x="824" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ef6c00" text-anchor="middle" font-weight="700"><tspan x="824" dy="0">Niveau 3 – Constructeur</tspan></text><text x="824" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="824" dy="0">On fait appel à l'extérieur si :</tspan></text><text x="704" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="704" dy="0">• panne matérielle sous garantie,</tspan></text><text x="704" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="704" dy="0">• logiciel en cause,</tspan></text><text x="704" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="start" font-weight="400"><tspan x="704" dy="0">• hors de notre périmètre.</tspan></text><rect x="30" y="350" width="940" height="70" rx="10" fill="#fffde7" stroke="#f9a825" stroke-width="2"/><text x="500" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="700"><tspan x="500" dy="0">En passant la main, je transmets TOUT : symptôme, tests faits, résultats, ce que j'ai déjà modifié.</tspan></text><text x="500" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#1f2544" text-anchor="middle" font-weight="400"><tspan x="500" dy="0">Celui qui reprend ne doit rien avoir à me redemander.</tspan></text></svg>
